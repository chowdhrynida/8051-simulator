Real-Time Clock\n**Kis liye:** **time/date** rakhna (digital clock, attendance, data logger) — 8051 band ho tab bhi battery se chalta hai.\n**Working:** I²C slave, address **D0H (write) / D1H (read)**. Registers (BCD): 00H seconds (bit7=CH halt), 01H minutes, 02H hours, 03H day, 04H date, 05H month, 06H year, 07H control.\n**Pins:** `VBAT`, `GND`, `VCC`, `SQW`, `SCL`, `SDA`.\n**Simulator me:** SCL → P1.0, SDA → P1.1, VCC → Battery(+), GND → Ground. Right-click → **Set time to my PC clock**.\n**Padhna:** START → `D0H` → `00H` → RESTART → `D1H` → read bytes (last ko NACK) → STOP. (Pura I²C code: example \"i2c\" topic.)\n>> rel: i2c, dev-eeprom\n\n@@ dev-eeprom | Devices | AT24C02 EEPROM (I2C) | at24c02 kya hai, eeprom kya hai, eeprom ka use, 24c02, eeprom simulator me, data save permanent, eeprom wiring, power off ke baad data\n## AT24C02 EEPROM (256 bytes)\n**Kis liye:** data **permanent save** — password, settings, counters (bijli band hone par bhi rehta hai).\n**Working:** I²C slave address **A0H/A1H** (A2 A1 A0 pins se badalta hai). Write: START → A0H → address → data → STOP (≈5 ms write time). Read: address set → RESTART → A1H → data.\n**Pins:** `A0 A1 A2 GND` | `VCC WP SCL SDA`.\n**Simulator me:** A0/A1/A2/WP → Ground, SCL → P1.0, SDA → P1.1, VCC → Battery(+), GND → Ground. Right-click → **Erase EEPROM**.\n>> rel: i2c, dev-rtc\n\n@@ dev-cap | Devices | Capacitor, Battery, Ground | capacitor kya hai, capacitor ka use, battery kya hai, ground kya hai, battery simulator me, ground kyun lagate hain, vcc gnd, supply kaise de, power supply simulator me\n## Capacitor, Battery, Ground\n- **Battery:** simulator ka **+5V supply**. `PLUS` = +5V, `MINUS` = 0V. Devices ke VCC / load ke (+) ko PLUS se jodo.\n- **Ground (GND):** **0V reference**. Har circuit ka return path — LED cathode, device GND, resistor ka dusra end yahin. **Bina ground ke current loop poora nahi hota, device kaam nahi karta.**\n- **Capacitor:** charge store karta hai. Use: **power-on reset** (10 µF + 8.2K on RST), crystal ke 30 pF, supply **decoupling** (0.1 µF), debounce, filtering.\n>> rel: dev-resistor, reset\n\n@@ sim-workflow | Simulator | Simulator ka poora workflow (shuru se end tak) | simulator kaise use kare, simulator ka use, simulator kaise chalate hain, simulator shuru kaise kare, simulator workflow, simulator steps, pehle kya kare, kaise start kare, simulator tutorial, poora simulator, simulator ke baare me\n## McuLab 8051 Simulator — Kaise use karein\n**Step 1 — Login:** username/password se login (naya account Register se).\n**Step 2 — Code likho:** Main window ke **\"Assemble code\"** box me 8051 assembly. (Ya 'Samples'/ChipMitra se code lo.)\n**Step 3 — Assemble:** syntax check; error ho to line **red** me dikhti hai.\n**Step 4 — Run / Step:** \n- **Run** = poora chalta hai; **Speed** (0.1% … 100% RealTime) se tez/dheema.\n- **Step** = ek-ek instruction (debug). Har step par registers/flags update.\n- **Reset** = CPU restart, **Stop** = rok do.\n**Step 5 — Circuit (optional):** **DEVICES** button → circuit designer: devices lagao, wire karo, **RUN**.\n**Step 6 — Debug:** Registers, PSW, Ports, Register banks, Code memory, Timer/Interrupt/Serial panels dekho; **UART waveform** window; **Oscilloscope**.\n**Save:** Main code **Save Code**; circuit/project **File → Save** (auto-save bhi).\n**Pooch sakte ho:** \"main window me kya kya hota hai\", \"devices window kaise use kare\", \"oscilloscope kaise khole\", \"led nahi jal rahi\" ...\n>> rel: sim-mainwin, sim-devwin, sim-wire\n\n@@ sim-mainwin | Simulator | Main window ke panels (Registers, PSW, Ports, Timer...) | main window, main window me kya hai, panels, registers panel, psw flags panel, ports panel, register banks panel, code memory panel, execution trace, timer counter panel, interrupt control panel, serial uart panel, clock machine cycle panel, assemble code box, run step reset buttons\n## Main Window — Panels aur Buttons\n| Panel / Button | Kya dikhata/karta hai |\n|---|---|\n| **Assemble code** box | Aapka assembly code (line highlight, error red) |\n| **Assemble** | Sirf syntax check + machine code banata hai |\n| **Run / Stop** | Program chalao / rok do |\n| **Step** | Ek instruction (current line highlight) |\n| **Reset** | PC=0000, registers reset |\n| **Save Code** | Code .asm file me save |\n| **DEVICES** | Circuit designer window |\n| **Registers** | A, B, DPTR, SP, PC live |\n| **PSW Flags** | CY, AC, F0, RS1, RS0, OV, P |\n| **Ports P0–P3 (bit-level)** | Har pin ka 0/1 **dikhata hai** (sirf indicator, isse input nahi diya jata — input ke liye Devices me Push Button/Keypad/sensor use karo) |\n| **Register banks (R0–R7)** | 4 banks ke registers + internal RAM |\n| **Code memory** | Assembled hex bytes, PC highlight, Prev/Next 256, Go, DPTR region |\n| **TIMER / COUNTER** | TMOD, TCON, TH/TL, TF/TR bits |\n| **INTERRUPT CONTROL** | IE, IP, EA, ET0.. bits |\n| **SERIAL / UART** | SCON, SBUF, TI/RI + **Open Waveform** |\n| **Clock / Machine Cycle** | Crystal (11.0592 MHz), machine cycle time, **Speed** selector, cycle counter |\n| **EXECUTION TRACE** | Har instruction ka log |\n| **🤖 Doubt Clear** | Ye ChipMitra! |\n**Tip:** Step + Registers panel = code samajhne ka sabse achha tarika.\n>> rel: sim-workflow, errors\n\n@@ sim-devwin | Simulator | DEVICES window (circuit designer) kaise use kare | devices window, circuit designer, devices window kaise use kare, component library, canvas, devices kaise lagaye, drag drop, circuit banana, devices window me kya hai, toolbar, run stop reset speed, upload code, editor code button\n## DEVICES Window — Circuit Designer\n**Layout:** Left **Component Library** (search box + categories) · Center **canvas (grid)** · Top **menu + toolbar**.\n**Toolbar:** Wire Mode (W) · ▶ **RUN** · ■ **STOP** · 🔄 **Reset** · 📂 **Upload Code** · 📝 **Editor Code** · **Speed** (0.1×, 1× Real, 5×, 20×) · Zoom **+/−/100%**.\n**Components lagana:** library me item par click → canvas par click (place). Drag karke move.\n**Mouse/Keys:**\n| Kaam | Kaise |\n|---|---|\n| Move | Drag |\n| Rotate 90° | `R` ya right-click |\n| Delete | `Delete` |\n| Copy / Paste / Duplicate | `Ctrl+C / V / D` |\n| Multi-select | Shift+click ya Shift+drag |\n| Duplicate × N | Right-click → *Duplicate × N (array)* |\n| Settings | Double-click (resistor, POT, sensors, IC code) |\n| Run | `F5` |\n**Menu:** File → New / Open / Save / Save As. Project **auto-save** hota hai.\n**Chalane ka tarika:** IC rakho → devices → wires → code (Editor Code/Upload) → RUN.\n>> rel: sim-wire, sim-saveload, sim-copy\n\n@@ sim-wire | Simulator | Wiring kaise karte hain (Wire Mode) | wire kaise lagaye, wiring kaise kare, wire mode, wire kaise judti hai, pin se pin jodna, wire delete, wire route, wire bend, wire nahi lag rahi, wire kaise hataye, wire kaise lagate hain, wires kaise lagate hain, wire lagana, wire lagane ka tarika, simulator me wire\n## Wiring\n1. **Wire Mode (W)** ON karo (button ya `W` key).\n2. **Pehle pin par click** (pin chhota gol hota hai) → phir **dusre pin par click** → wire ban gayi.\n3. Beech me click karke **bend points** daal sakte ho; `Esc` = cancel.\n4. Wire par click = select → `Delete`. Wire Mode band karne ke liye `W`/`Esc`.\n5. Ek pin se multiple wires ho sakti hain (node).\n**Rules (real jaise):**\n- Har device ko **power** (VCC/+ → Battery PLUS) aur **GND** chahiye.\n- Wires ka koi rang matter nahi — electrical connection matter karta hai.\n- **LED bina resistor** → jal jaayegi. **Motor/relay direct pin se** nahi — driver (L293D/ULN/NPN).\n- Open pin (kuch nahi juda) = floating.\nWire nahi ban rahi? Pin ke upar sahi se click karo, aur Wire Mode ON ho.\n>> rel: sim-devwin, interface-general\n\n@@ sim-saveload | Simulator | Project Save / Open / New Project | project save kaise kare, save hota hai, new project, open project, save as, autosave, project kho gaya, circuit save, sim file, project load, auto save\n## Project Save / Open\n- **Auto-save:** Devices window kholne ke baad har ~1.5 sec me **code + circuit** browser me save hota hai; page reload par **wapas** aa jata hai.\n- **File → New Project:** naam poochta hai, **editor aur circuit** saaf karta hai (purana project browser me safe).\n- **File → Open Project (browser):** saved projects ki list; 🗑 se delete.\n- **Save / Save As:** browser me save + **.sim file download** (code + circuit dono).\n- **Open from file (.sim):** download ki hui file se wapas.\nNote: auto-save usi browser me rehta hai; dusre computer par ke liye .sim file bhejo.\n>> rel: sim-devwin\n\n@@ sim-copy | Simulator | Copy / Paste / Duplicate devices | copy paste, duplicate, 8 led ek saath, array banana, ctrl c ctrl v, multiple select, group move, copy kaise kare components, led copy\n## Copy / Paste / Duplicate\n- Component click → **Ctrl+C**, **Ctrl+V** (mouse jahan hai wahan paste). Wires bhi (agar dono ends copy me hain).\n- **Ctrl+D** = turant duplicate. **Ctrl+X** = cut. **Ctrl+A** = sab select.\n- **Shift+click / Shift+drag** = multiple select; phir group me move/rotate/delete.\n- **8 LED 90° rotate ke saath:** ek LED lagao, rotate karo, right-click → **Duplicate × N (array)** → copies 7, Row/Column, spacing → Create.\n>> rel: sim-devwin\n\n@@ sim-uart | Simulator | UART Waveform window | uart window, uart waveform, serial waveform, rx inject, tx rx waveform, baud rate live, serial window kaise khole, start bit stop bit dikhana, open waveform\n## UART Waveform Window\nMain window ke **SERIAL / UART** panel me **📈 Open Waveform** dabao.\n- **TX (P3.1)** aur **RX (P3.0)** ki waveform: **START bit, D0–D7, STOP bit**, live **baud rate** dikhta hai.\n- **Inject:** manual byte bhejo jaise koi device ne bheja ho (SCON me **REN=1** chahiye).\n- Code me `MOV SCON,#50H`, TH1=FDH, `SETB TR1` zaroori; bina TR1 ke kuch nahi chalega.\nReal hardware jaisa timing (11.0592 MHz, baud ke hisaab se). Devices window me P3.1 par **Oscilloscope** bhi laga sakte ho.\n>> rel: baud, serial-tx, dev-cro\n\n@@ sim-debug | Simulator | Simulator me kuch kaam nahi kar raha (troubleshooting) | led nahi jal rahi simulator me, circuit kaam nahi kar raha, device response nahi de raha, simulator hang, run dabaya kuch nahi hua, simulator me problem, code upload nahi hua, nothing happens, kuch nahi ho raha, troubleshooting\n## Simulator Troubleshooting\n| Samasya | Check karo |\n|---|---|\n| RUN par \"Code nahi hai\" | Pehle Main editor me code likho/Assemble; ya Devices me **Editor Code / Upload Code** |\n| LED nahi jalti | VCC/GND connect? resistor? sahi pin? code me pin 0/1 sahi (active-low/high)? |\n| LED kaali | Resistor nahi tha (burnt) — resistor lagao |\n| LCD blank | VDD/VSS/VEE, E pulse, init `38H,0EH,01H`, RS/E pins |\n| Motor nahi ghoom raha | L293D VCC1+VCC2 aur GND, EN=1, IN1≠IN2 |\n| Relay/lamp | NPN base resistor, E→GND, lamp ka path |\n| UART kuch nahi | `SETB TR1`, TH1, `SCON` |\n| Timer rukta nahi | TF0 clear, TR0, reload |\n| Program turant ruk gaya | End me `SJMP $` / loop |\n| Slow | Speed 1×/5×/20× badlo |\n| Window nahi khul rahi | Pop-up/zoom check; dobara button dabao |\nCode ke errors ke liye **🩺 Check My Code** use karo.\n>> rel: errors, sim-workflow\n\n@@ sim-login | Simulator | Login / Register | login, register, account, username password, login kaise kare, signup, password bhool gaye, user account\n## Login / Register\nSimulator kholte hi **splash** aur phir **Login** screen. Naya user: **Register** tab me naam, username, password. Login ke baad main simulator + **Doubt Clear (ChipMitra)** milta hai. Account details sirf is browser me save hoti hain.\n>> rel: sim-workflow\n\n@@ sim-speed | Simulator | Speed (tez / dheema chalana) | speed kaise badle, simulator speed, run speed, slow motion, tez chalana, dheema chalana, speed selector, real time, 1x 5x 20x, led blink bahut tez, delay dikh nahi raha\n## Simulator Speed\n- **Main window:** *Clock / Machine Cycle* panel me **Speed** dropdown: 0.1%, 1%, 5%, 10%, 50%, **100% (RealTime)**. Kam speed = ek-ek change aankhon se dekh sakte ho; 100% = real 11.0592 MHz.\n- **Devices window:** toolbar me **0.1×, 1× Real, 5×, 20×**. 1× Real me LED blink ka delay bilkul real time jaisa dikhta hai; bada delay ho to 5×/20× karo.\n- Delay bahut chhota ho to LED ek saath on dikhti hai (persistence) — real hardware me bhi aisa hota hai.\n>> rel: sim-mainwin, sim-devwin\n\n@@ pullup-down | Connections | Pull-up / Pull-down resistor kyun | pull up resistor, pull down resistor, pullup, pulldown, floating pin, floating input, input pin 0 1 random, pull up kyun lagate hain, pull up kya hai, p0 pull up\n## Pull-up / Pull-down\n**Floating pin:** input pin ko kuch na jodo to uski value **0 ya 1 random** hoti hai (noise pakadta hai).\n- **Pull-up (10K → +5V):** switch na dabe to pin = **1**; dabane par (switch → GND) pin = **0**. 8051 ke **P1, P2, P3 me internal pull-up** hai (dobara lagane ki zaroorat nahi). **P0 me nahi** — external 10K lagao.\n- **Pull-down (10K → GND):** default 0, press par 1 (kam use hota hai).\n**I²C (SDA/SCL)** par **4.7K pull-up** zaroori hai.\nSimulator me bhi input pin kuch se na juda ho to wo default pull-up (P1–P3) ke hisaab se 1 padhta hai; P0 ko open-drain maana jata hai.\n>> rel: dev-switch, ports, i2c\n\n@@ sink-source | Connections | Current sink aur source (active-high / active-low) | sink source, current sink, current source, active low, active high, led pin se kaise jode, pin kitna current deta hai, 8051 pin current, drive capability, mA\n## Sink vs Source\n- **Source:** pin **HIGH** hoke current **bahar deta hai** (pin → load → GND).\n- **Sink:** pin **LOW** hoke current **andar leta hai** (+5V → load → pin).\n**8051:** sink achha (~10 mA/pin, kul ~70 mA), **source bahut kamzor** (~60–100 µA internal pull-up se). Isliye zyadatar load **active-low (sink)** se jode jaate hain: LED ka anode +5V (resistor se), cathode pin → pin 0 = ON.\n| Style | Connection | ON kab |\n|---|---|---|\n| Active-high | pin → R → LED → GND | pin = 1 |\n| Active-low | +5V → R → LED → pin | pin = 0 |\n**Zyada current (>10 mA)** → driver: transistor / ULN2003 / L293D / relay.\n>> rel: dev-led, dev-uln, led-interface\n\n@@ common-ground | Connections | Common Ground aur Power rules | common ground, ground kyun, ground connect, gnd common, power supply connections, vcc gnd, supply separate, motor supply alag, 5v 12v, power connection rules\n## Power / Ground ke Rules\n1. **Har device ko VCC aur GND dono** chahiye. Sirf signal wire se kuch nahi chalta.\n2. **Common ground:** 8051, sensors, drivers aur motor supply — sab ke **GND aapas me juda** hona chahiye, warna signal ka reference nahi milta.\n3. **Alag supply:** motor/relay ke liye alag (6–12V) supply use karo, par GND common rakho (L293D: VCC1=5V logic, VCC2=motor supply).\n4. **Decoupling:** har IC ke VCC-GND ke beech 0.1 µF capacitor (real me).\n5. **Simulator me:** Battery PLUS = +5V, MINUS = 0V, Ground component = 0V. Jahan VCC likha ho wahan Battery PLUS jodo, jahan GND wahan Ground.\n>> rel: dev-cap, dev-dcmotor\n\n@@ logic-levels | Connections | Logic levels (0 aur 1 kitne volt) | logic level, ttl, cmos, 5v 3.3v, voltage level, high low voltage, vih vil, level shifter, 3.3v sensor, logic 1 kitne volt\n## Logic Levels\n- **TTL (8051):** LOW ≤ **0.8 V**, HIGH ≥ **2.0 V**. Output HIGH ≈ 4–5V.\n- Beech ka voltage (0.8–2V) **undefined** — avoid.\n- **3.3V devices** ko 5V pin se direct mat jodo (resistor divider / level shifter), 5V devices (HC-SR04 echo) 8051 ke saath theek.\n- **RS-232** ±12V hota hai → **MAX232** se TTL me badlo.\n>> rel: shift-reg, sink-source\n\n@@ which-output | Which device | Output ke liye kaun sa device chunein (LED vs 7-seg vs LCD) | kaun sa display, led vs 7 segment vs lcd, display kaun sa use kare, output device choose, kab lcd kab led, display comparison, indicator ya display\n## Output Devices — kab kaunsa\n| Device | Kab use karein | Pins | Fayda | Nuksan |\n|---|---|---|---|---|\n| **LED** | ON/OFF status, alarm, chaser | 1 pin/LED | Sabse simple | Sirf 1 bit |\n| **7-Segment** | 1 digit number (counter, timer) | 7–8 pins | Bright, simple | Sirf digits, pins zyada |\n| **4-Digit 7-Seg** | Multi-digit number (clock, counter) | 12 pins | Bright, bade numbers | Multiplexing code zaroori |\n| **8×8 Dot Matrix** | Letters, symbols, animation | 16 pins | Koi bhi shape/scroll | Scan code + font table |\n| **LCD 16×2** | Text + numbers + message | 10–11 pins | Poora text | Code lamba (init, commands) |\n| **Buzzer** | Beep/alarm | 1 pin | Awaaz | Sirf tone |\n| **Oscilloscope** | Waveform check (debug) | probe | Signal dekhna | Output nahi, measurement |\nPins kam hon to **74HC595** se outputs badhao; zyada digits ho to **multiplexing** (4-Digit 7-Seg / Dot Matrix).\n>> rel: dev-all, dev-led, dev-7seg, dev-seg4, dev-matrix, dev-lcd\n\n@@ which-motor | Which device | DC motor vs Stepper vs Servo | dc motor vs stepper vs servo, kaun sa motor, motor choose, kab stepper kab servo, motor comparison, motor kaun sa use kare\n## Motors — kab kaunsa\n| Motor | Control | Kab use | Driver |\n|---|---|---|---|\n| **DC motor** | ON/OFF, direction (H-bridge), speed (PWM) | Pankha, wheels, pump | L293D / transistor |\n| **Stepper** | Step-by-step (sequence + delay) | Exact position/rotation — printer, CNC | ULN2003 |\n| **Servo (SG90)** | PWM pulse = angle (0–180°) | Arm, gate, steering | Seedha pin (PWM) + 5V |\nSimple rule: **sirf ghumana** → DC; **exact steps/angle count** → stepper; **ek fixed angle par rukna** → servo.\n>> rel: dev-dcmotor, dev-stepper, dev-servo\n\n@@ which-driver | Which device | Driver kaun sa: Transistor vs ULN2003 vs L293D vs Relay | transistor vs uln2003, l293d vs uln2003, driver choose, kaun sa driver, relay vs transistor, relay kab use kare, driver comparison, motor driver kaun sa\n## Driver / Switch — kab kaunsa\n| Device | Kaam | Kab chunein |\n|---|---|---|\n| **NPN Transistor** | 1 load ON/OFF | Ek buzzer/relay/LED strip |\n| **ULN2003A** | 7 loads ko sink | Stepper, kai relays/LEDs, inverting |\n| **L293D** | 2 motors **dono direction** | DC motor forward/reverse |\n| **Relay** | AC/high-power load, **isolation** | Bulb, pump, appliance (transistor/ULN ke saath) |\n8051 pin directly sirf **LED (resistor ke saath)**/chhota signal chala sakta hai.\n>> rel: dev-npn, dev-uln, dev-dcmotor, dev-relay\n\n@@ which-sensor | Which device | Sensors — kaun sa sensor kis kaam ke liye | sensor kaun sa use kare, sensors comparison, ir vs pir vs ultrasonic, light sensor, temperature sensor, distance sensor, kya measure karna hai, sensor list, kaun sa sensor, sensor kya naapta hai, kya naapta hai, sensor kya kaam karta hai, sensors ka use, temperature sensor kaun sa lun, temperature sensor kaun sa use kare, humidity sensor kaun sa\n## Sensors — kya measure karna hai?\n| Naapna hai | Sensor | Output type | 8051 me |\n|---|---|---|---|\n| Temperature | **LM35** | Analog (10 mV/°C) | ADC0804 chahiye |\n| Temperature + Humidity | **DHT11** | Digital single-wire (40-bit) | seedha pin, timing code |\n| Roshni | **LDR module** | DO digital / AO analog | pin ya ADC |\n| Doori | **HC-SR04** | Echo pulse width | Timer se time |\n| Obstacle (paas/door) | **IR sensor** | Digital | seedha pin |\n| Insaan ki movement | **PIR** | Digital HIGH | seedha pin |\n| Variable setting | **Potentiometer** | Analog | ADC |\n| Time/date | **DS1307 RTC** | I²C | SDA/SCL |\n| Data store | **AT24C02** | I²C | SDA/SCL |\n**Digital sensor** = seedha port pin; **Analog sensor** = ADC0804 ke through.\n>> rel: dev-all, dev-adc, dev-dht11\n\n@@ which-comm | Which device | Parallel vs UART vs I2C (communication) | uart vs i2c, i2c vs spi, parallel vs serial, communication protocols, kaun sa protocol, serial parallel difference, uart i2c kab use kare, uart i2c farak, uart i2c difference, uart vs i2c, uart aur i2c\n## Communication — kab kaunsa\n| | Parallel | UART | I²C |\n|---|---|---|---|\n| Pins | 8+ | 2 (TXD, RXD) | 2 (SDA, SCL) |\n| Devices | 1 | 1 (point-to-point) | Kai (address se) |\n| Speed | Tez | 9600–115200 baud | 100–400 kHz |\n| Example | LCD, ADC0804, DAC | PC, GSM, Bluetooth | DS1307, 24C02 |\n**Serial** me kam pins lagte hain par code me protocol (timing, START/STOP/ACK) sambhalna padta hai. 8051 me **UART hardware** hai; **I²C software (bit-bang)** hota hai.\n>> rel: scon, i2c, shift-reg\n\n@@ which-adc-dac | Which device | ADC vs DAC kab use karte hain | adc vs dac, adc kab dac kab, analog digital kya hai, analog input output, adc dac difference, analog kya hai, digital kya hai\n## ADC vs DAC\n- **ADC0804 (analog → digital):** bahar ki duniya (temperature, light, knob) ko number me badalna → *sensor padhna*.\n- **DAC0808 (digital → analog):** number ko voltage me badalna → *waveform, audio, analog control*.\n- **Analog:** continuous voltage (0–5V ke beech koi bhi value). **Digital:** sirf 0/1; 8051 sirf digital samajhta hai, isliye converter chahiye.\n>> rel: dev-adc, dev-dac, dev-lm35\n\n@@ sim-assembler | Simulator | Simulator ke assembler me kya supported hai | assembler supported, simulator assembler, directives supported, assembler error, assemble error kya hai, line number error, syntax error simulator, hex number format, ffh error, assembler limitations, data directive error\n## Simulator ka Assembler\n**Chalta hai:** saare 8051 instructions, labels (`L:`), comments (`;`), `ORG`, `END`, `EQU`, `BIT`, `DB` (numbers, `'text'`), `DW`, `$`, hex (`25H`, `0FFH`), binary (`1010B`), decimal, ASCII (`'A'`), SFR names (P1, TMOD, SBUF, ACC…), bit names (`TR0`, `P1.0`, `20H.3`), lowercase bhi.\n**Support nahi:** `TEMP DATA 30H` (use `EQU`), `HIGH()/LOW()` operators, macros, C code.\n**Error aaye to:** *Assemble Error* dialog me message aur **line number**; editor me wo line **red** hoti hai. Aam wajah: label/mnemonic ki spelling, galat operand (`MOV R0,R1`), undefined label, hex number galat.\n**Check My Code** (ChipMitra) real assembler + CPU se chalake exact error batata hai.\n>> rel: errors, directives, asm-basics\n\n@@ sim-memory | Simulator | Memory views (Internal RAM, External RAM, Code memory) | internal ram view, external ram, xram, code memory view, memory kaise dekhe, ram dekhna, dptr region, xram base address, memory panel, hex dump, memory view\n## Memory Views (Main window, neeche)\n- **Select Data Memory** dropdown: **Internal RAM (00h–FFh)** ya **External RAM (0000h–FFFFh)**.\n- **Internal RAM:** 8 bytes per row; changes live dikhte hain (kaunsi byte badli, step karke dekho).\n- **External RAM (MOVX):** **XRAM Base Addr** me hex address do → **Go**; **◀ Prev 256 / Next 256 ▶** se pages; **Show DPTR region** = jahan DPTR point kar raha hai wahi page.\n- **Code memory (0000h–FFFFh):** assembled **hex bytes**, 16 per row, current **PC** highlight.\nUse: `MOV 30H,#55H` chalao aur RAM me 30H par 55 dekho; `MOVX @DPTR,A` ka result XRAM view me.\n>> rel: sim-mainwin, memory\n\n@@ sim-step | Simulator | Step / Debug kaise karte hain | step debug, debugging kaise kare, step by step, ek ek instruction, execution trace, register change dekhna, program samajhna, pc highlight, cycles counter, reset counter, sim time\n## Step / Debug\n1. Code **Assemble** karo.\n2. **Step** dabao — ek instruction chalta hai; editor me **current line highlight**.\n3. Har step ke baad dekho: **Registers** (A, B, DPTR, SP, PC), **PSW flags**, **Ports**, **R0–R7**, **RAM**, **Timer/Interrupt/Serial** panels.\n4. **EXECUTION TRACE** me har instruction ka log.\n5. **Clock panel:** *Cycles exec* (machine cycles), *Sim time* (µs), **Reset Counter** se zero — delay ka exact time naapne ke liye.\nDelay loop ka time nikalna: Reset Counter → Run → Stop → *Sim time* padho.\n>> rel: sim-mainwin, delay-loop\n\n@@ sim-shortcuts | Simulator | Keyboard shortcuts aur right-click menu | shortcuts, keyboard shortcut, right click menu, context menu, hotkeys, ctrl c ctrl v, delete rotate, w key, f5, escape, right click options\n## Shortcuts (Devices window)\n| Key | Kaam |\n|---|---|\n| `W` | Wire mode ON/OFF |\n| `Esc` | Wire cancel / selection hatao |\n| `R` | Rotate 90° |\n| `Delete`/`Backspace` | Delete |\n| `Ctrl+C / V / X / D` | Copy / Paste / Cut / Duplicate |\n| `Ctrl+A` | Sab select |\n| `Shift+click/drag` | Multi-select |\n| `F5` | RUN |\n## Right-click menu (component par)\nCopy, Duplicate, **Duplicate × N**, Rotate, Delete — aur device-specific: LED **colour**, 7-seg **CC/CA**, LCD **blue/green**, HC-SR04 **Set Distance**, POT **position**, LM35 **temperature**, LDR **light/threshold**, IR **obstacle**, PIR **motion**, Buzzer **mute**, DS1307 **set time**, EEPROM **erase**, Oscilloscope **Open window**.\n>> rel: sim-devwin, sim-copy\n\n@@ sim-limits | Simulator | Simulator ki limitations (kya nahi hota) | limitations, kya nahi hota, simulator me kya nahi hai, hex file load, c code compile, keil, proteus, real hardware difference, supported nahi, simulator vs real hardware\n## Simulator kya karta hai aur kya nahi\n**Karta hai:** 8051 ke saare instructions (cycle-accurate timing @11.0592 MHz), timers, interrupts, UART, ports, external RAM; real-electrical devices (resistor, LED, motor drivers, LCD HD44780, I²C chips, ADC/DAC...), oscilloscope.\n**Nahi karta:**\n- **C code compile** nahi — sirf assembly (C ke liye Keil se HEX).\n- **.HEX file load** nahi (assembly source chalta hai).\n- Timer2 / 8052 extras nahi (classic 8051).\n- Analog circuits ka full SPICE nahi — simplified electrical model.\n- Real me **noise, bounce, tolerance** nahi hote (button bounce ka dhyan phir bhi rakho).\n>> rel: sim-workflow, c-prog\n\n@@ sim-chipmitra | Simulator | ChipMitra kya kya kar sakti hai | chipmitra kya hai, tum kya kar sakti ho, ye chatbot kya karta hai, doubt clear kya hai, chipmitra features, help, madad, tum kaun ho\n## ChipMitra (Doubt Clear)\nMain simulator ke andar baithi **8051 study-buddy** hoon (offline):\n- 📘 **Theory** — architecture, registers, timers, interrupts, serial, memory\n- 🧩 **Devices** — har device ka use, working, pins, wiring, code\n- 🔌 **Interfacing + Code** — kaise jodte hain, kaise likhte hain\n- 🧮 **Instructions** — 45 instructions (syntax, flags, cycles)\n- 🧪 **Calculators** — timer delay, baud/TH1, DJNZ loop, number conversion\n- 🩺 **Check Code / Explain Code** — real assembler se bug dhoondna, line-by-line explain\n- 🖥️ **Simulator help** — har button/panel/shortcut\n- 🎓 **Viva/exam** questions\nLeft rail se views badlo; type karke bhi pooch sakte ho.\n>> rel: sim-workflow, dev-all\n\n@@ c-ledblink | Circuits | Circuit: LED Blink (step by step) | led blink circuit, led blink kaise banaye simulator me, pehla circuit, first circuit, led blink wiring, led blink project, led blink devices window, led blink step by step\n## Circuit 1 — LED Blink\n**Components:** IC_8051, Resistor (330Ω), LED, Battery, Ground.\n**Wiring (active-low):**\n| From | To |\n|---|---|\n| Battery PLUS | Resistor P1 |\n| Resistor P2 | LED ANODE |\n| LED CATHODE | 8051 P1.0 |\n| Battery MINUS | Ground |\n(IC ka VCC/GND bhi supply se jodo.)\n**Steps:** Main editor me code → **Assemble** → **DEVICES** → components lagao → **Wire Mode (W)** se wires → **RUN**.\n```\nORG 0000H\nLOOP: CLR P1.0          ; LED ON (active-low)\n      ACALL DELAY\n      SETB P1.0         ; LED OFF\n      ACALL DELAY\n      SJMP LOOP\nDELAY: MOV R5,#5\nD1:   MOV R6,#255\nD2:   MOV R7,#255\nD3:   DJNZ R7,D3\n      DJNZ R6,D2\n      DJNZ R5,D1\n      RET\nEND\n```\nSpeed **5×** karo agar dheema lage. LED jale nahi to resistor/ground check karo.\n>> rel: dev-led, sim-debug\n\n@@ c-switchled | Circuits | Circuit: Switch se LED ON/OFF | switch led circuit, button se led, push button led project, switch led wiring, input output circuit, switch aur led\n## Circuit 2 — Push Button se LED\n**Components:** IC_8051, Push Button, Resistor 330Ω, LED, Battery, Ground.\n| From | To |\n|---|---|\n| Button P1 | 8051 P3.0 |\n| Button P2 | Ground |\n| Battery PLUS → Resistor → LED ANODE; LED CATHODE | 8051 P1.0 |\n```\nORG 0000H\n      SETB P3.0           ; input\nLOOP: JB P3.0,OFF         ; dabaya nahi?\n      CLR P1.0            ; LED ON\n      SJMP LOOP\nOFF:  SETB P1.0           ; LED OFF\n      SJMP LOOP\nEND\n```\nRUN ke baad button par click-hold karo.\n>> rel: dev-switch, switch-interface\n\n@@ c-lcdhello | Circuits | Circuit: LCD par text dikhana | lcd circuit, lcd hello, lcd par text, lcd wiring step by step, lcd project, lcd connection table, lcd hello world\n## Circuit 3 — LCD 16×2 par \"HELLO\"\n| LCD pin | Connect |\n|---|---|\n| VSS, VEE, RW, LEDK | Ground |\n| VDD, LEDA | +5V (Battery PLUS) |\n| RS | P3.7 |\n| E | P3.5 |\n| D0–D7 | P0.0–P0.7 |\n```\nORG 0000H\n      MOV P0,#0FFH\n      MOV A,#38H\n      ACALL CMD\n      MOV A,#0CH\n      ACALL CMD\n      MOV A,#01H\n      ACALL CMD\n      MOV DPTR,#MSG\nNEXT: CLR A\n      MOVC A,@A+DPTR\n      JZ DONE\n      ACALL DAT\n      INC DPTR\n      SJMP NEXT\nDONE: SJMP $\nCMD:  MOV P0,A\n      CLR P3.7\n      SETB P3.5\n      CLR P3.5\n      ACALL DLY\n      RET\nDAT:  MOV P0,A\n      SETB P3.7\n      SETB P3.5\n      CLR P3.5\n      ACALL DLY\n      RET\nDLY:  MOV R7,#50\nD1:   MOV R6,#255\nD2:   DJNZ R6,D2\n      DJNZ R7,D1\n      RET\nMSG:  DB 'HELLO',0\nEND\n```\n>> rel: dev-lcd, lcd-interface\n\n@@ c-7segcount | Circuits | Circuit: 7-Segment counter 0-9 | 7 segment counter circuit, 7 segment project, seven segment wiring, counter circuit, 7 segment 0 to 9, digit counter, 7seg circuit\n## Circuit 4 — 7-Segment Counter (0–9)\n**Components:** IC_8051, 7-Segment (CC), 7 × Resistor 330Ω, Ground.\n| 7-seg | Connect |\n|---|---|\n| A…G | P1.0…P1.6 (har ek resistor ke saath) |\n| COM | Ground (Common Cathode) |\n```\nORG 0000H\nMAIN: MOV R2,#0\nLOOP: MOV DPTR,#TAB\n      MOV A,R2\n      MOVC A,@A+DPTR\n      MOV P1,A\n      ACALL DELAY\n      INC R2\n      CJNE R2,#10,LOOP\n      SJMP MAIN\nDELAY: MOV R5,#4\nD1:   MOV R6,#255\nD2:   MOV R7,#255\nD3:   DJNZ R7,D3\n      DJNZ R6,D2\n      DJNZ R5,D1\n      RET\nTAB:  DB 3FH,06H,5BH,4FH,66H,6DH,7DH,07H,7FH,6FH\nEND\n```\nCommon Anode ho to right-click → toggle CA, COM → +5V, aur table ko inverted (C0H,F9H,A4H,B0H,99H,92H,82H,F8H,80H,90H) karo.\n>> rel: dev-7seg, seven-seg\n\n@@ c-motor | Circuits | Circuit: DC Motor forward/reverse (L293D) | dc motor circuit, l293d circuit, motor forward reverse circuit, motor wiring step by step, motor project, h bridge circuit\n## Circuit 5 — DC Motor + L293D\n| From | To |\n|---|---|\n| 8051 P1.0 | L293D IN1 |\n| 8051 P1.1 | L293D IN2 |\n| 8051 P1.2 | L293D EN1 |\n| L293D VCC1, VCC2 | Battery PLUS |\n| L293D GND, GND2 | Ground |\n| L293D OUT1, OUT2 | DC Motor IN1, IN2 |\n```\nORG 0000H\n      SETB P1.2           ; enable\nLOOP: SETB P1.0\n      CLR  P1.1           ; forward\n      ACALL DELAY\n      CLR  P1.0\n      CLR  P1.1           ; stop\n      ACALL DELAY\n      CLR  P1.0\n      SETB P1.1           ; reverse\n      ACALL DELAY\n      CLR  P1.1           ; stop\n      ACALL DELAY\n      SJMP LOOP\nDELAY: MOV R5,#10\nD1:   MOV R6,#255\nD2:   MOV R7,#255\nD3:   DJNZ R7,D3\n      DJNZ R6,D2\n      DJNZ R5,D1\n      RET\nEND\n```\n>> rel: dev-dcmotor, which-motor\n\n@@ c-stepper | Circuits | Circuit: Stepper motor (ULN2003) | stepper circuit, stepper wiring, stepper project, stepper motor circuit step by step, uln2003 stepper connection\n## Circuit 6 — Stepper + ULN2003\n| From | To |\n|---|---|\n| P1.0, P1.1, P1.2, P1.3 | ULN IN1, IN2, IN3, IN4 |\n| ULN OUT1…OUT4 | Stepper IN1…IN4 |\n| ULN GND | Ground |\n| ULN COM, Stepper COM | Battery PLUS |\n```\nORG 0000H\nLOOP: MOV P1,#09H\n      ACALL DLY\n      MOV P1,#0CH\n      ACALL DLY\n      MOV P1,#06H\n      ACALL DLY\n      MOV P1,#03H\n      ACALL DLY\n      SJMP LOOP\nDLY:  MOV R6,#20\nD1:   MOV R7,#255\nD2:   DJNZ R7,D2\n      DJNZ R6,D1\n      RET\nEND\n```\nSequence ulta (03H,06H,0CH,09H) → reverse.\n>> rel: dev-stepper, dev-uln\n\n@@ c-relay | Circuits | Circuit: Relay se Lamp ON/OFF | relay circuit, relay wiring step by step, relay lamp circuit, relay project, lamp control, relay transistor circuit\n## Circuit 7 — Relay + Lamp\n| From | To |\n|---|---|\n| P1.0 | Resistor 1K → NPN B |\n| NPN E | Ground |\n| NPN C | Relay A2 |\n| Relay A1 | Battery PLUS |\n| Battery PLUS | Relay COM |\n| Relay NO | Lamp P1 |\n| Lamp P2 | Ground |\n```\nORG 0000H\nLOOP: SETB P1.0       ; relay ON -> lamp ON\n      ACALL DLY\n      CLR P1.0        ; OFF\n      ACALL DLY\n      SJMP LOOP\nDLY:  MOV R5,#6\nD1:   MOV R6,#255\nD2:   MOV R7,#255\nD3:   DJNZ R7,D3\n      DJNZ R6,D2\n      DJNZ R5,D1\n      RET\nEND\n```\n>> rel: dev-relay, dev-npn\n\n@@ c-ledchaser | Circuits | Circuit: 8 LED Chaser (Knight rider) | led chaser, 8 led, running led, led running light, knight rider, 8 leds circuit, led pattern, led shift\n## Circuit 8 — 8 LED Chaser\n**Components:** 8051, 8 × (Resistor 330Ω + LED), Battery, Ground. **Tip:** ek resistor+LED banao, rotate karo, **Duplicate × N** se 8 bana lo.\nHar LED: Battery PLUS → Resistor → ANODE; CATHODE → P1.0 … P1.7.\n```\nORG 0000H\n      MOV A,#0FEH      ; 11111110 -> P1.0 ON (active-low)\nLOOP: MOV P1,A\n      ACALL DLY\n      RL A             ; agle bit par\n      SJMP LOOP\nDLY:  MOV R6,#2\nD1:   MOV R7,#255\nD2:   DJNZ R7,D2\n      DJNZ R6,D1\n      RET\nEND\n```\nUlta chalane ke liye `RR A`.\n>> rel: sim-copy, dev-led\n\n@@ c-temp | Circuits | Circuit: LM35 + ADC0804 se temperature | temperature circuit, lm35 adc circuit, temperature project, thermometer circuit, lm35 adc lcd, adc wiring step by step, temperature display\n## Circuit 9 — Temperature (LM35 → ADC0804 → LED/LCD)\n| From | To |\n|---|---|\n| LM35 VCC / GND | Battery PLUS / Ground |\n| LM35 OUT | ADC0804 VINP |\n| ADC VINN, AGND, DGND, CS | Ground |\n| ADC VCC | Battery PLUS |\n| ADC DB0–DB7 | P1.0–P1.7 |\n| ADC WR / RD / INTR | P3.0 / P3.1 / P3.2 |\n```\nORG 0000H\nLOOP: CLR P3.0\n      SETB P3.0           ; start conversion\nW:    JB P3.2,W           ; INTR low?\n      CLR P3.1\n      MOV A,P1            ; A = ADC value\n      SETB P3.1\n      MOV B,#2\n      MUL AB              ; ~ temperature (A*1.95)\n      MOV P2,A            ; P2 par dikhao (LED/7seg)\n      SJMP LOOP\nEND\n```\nLM35 par double-click karke temperature slider badlo (25°C → ADC ≈ 13 → P2 ≈ 26).\nResult **LCD par digits** dikhane ke liye `DIV AB` se hundreds/tens/ones nikalo (BCD entry dekho).\n>> rel: dev-lm35, dev-adc, bcd\n\n@@ c-dacwave | Circuits | Circuit: DAC0808 se waveform + oscilloscope | dac circuit, waveform circuit, sawtooth circuit, dac oscilloscope, dac wiring step by step, triangular wave circuit, signal generator\n## Circuit 10 — DAC0808 → Oscilloscope\n| From | To |\n|---|---|\n| P1.7…P1.0 | DAC A1…A8 (A1 = MSB) |\n| DAC VCC, VREFP | Battery PLUS |\n| DAC GND, VREFN | Ground |\n| DAC VOUT | Oscilloscope CH1 |\n| Scope GND | Ground |\n```\nORG 0000H\nL: MOV A,#0\nU: MOV P1,A\n   INC A\n   JNZ U          ; 0..255 sawtooth\n   SJMP L\nEND\n```\nRUN → Oscilloscope par double-click → **AUTOSET**. Triangular: pehle `INC` loop, phir `DEC` loop.\n>> rel: dev-dac, dev-cro\n\n@@ c-ultra | Circuits | Circuit: Ultrasonic se distance | ultrasonic circuit, distance circuit, hc-sr04 circuit, distance measure project, sonar circuit, ultrasonic wiring\n## Circuit 11 — HC-SR04 Distance\n| From | To |\n|---|---|\n| HC-SR04 VCC/GND | Battery PLUS / Ground |\n| TRIG | P1.0 |\n| ECHO | P1.1 |\n| P2.0–P2.7 | 8 LEDs (ya 7-seg) |\n```\nORG 0000H\n      MOV TMOD,#01H\nLOOP: SETB P1.1               ; echo input\n      SETB P1.0\n      NOP\n      NOP\n      NOP\n      NOP\n      NOP\n      NOP\n      NOP\n      NOP\n      NOP\n      NOP                     ; ~10 us\n      CLR P1.0\nW1:   JNB P1.1,W1             ; echo high ka wait\n      MOV TH0,#0\n      MOV TL0,#0\n      SETB TR0\nW2:   JB P1.1,W2              ; echo low hone tak\n      CLR TR0\n      MOV A,TL0               ; ~ time / 256 us\n      MOV P2,A\n      ACALL DLY\n      SJMP LOOP\nDLY:  MOV R6,#100\nD1:   MOV R7,#255\nD2:   DJNZ R7,D2\n      DJNZ R6,D1\n      RET\nEND\n```\nDistance (cm) ≈ TH0:TL0 × 1.085 / 58. Sensor par double-click → distance slider.\n>> rel: dev-hcsr04\n\n@@ c-uart | Circuits | Circuit: UART se data bhejna (waveform) | uart circuit, serial circuit, uart project, serial send circuit, uart waveform dekhna, serial wiring, txd oscilloscope\n## Circuit 12 — UART Transmit + Waveform\n**Components:** IC_8051 (+ optional Oscilloscope: CH1 → P3.1, GND → Ground).\n```\nORG 0000H\n      MOV TMOD,#20H\n      MOV TH1,#0FDH      ; 9600\n      MOV SCON,#50H\n      SETB TR1\nL:    MOV A,#'A'\n      MOV SBUF,A\nW:    JNB TI,W\n      CLR TI\n      ACALL DLY\n      SJMP L\nDLY:  MOV R6,#100\nD1:   MOV R7,#255\nD2:   DJNZ R7,D2\n      DJNZ R6,D1\n      RET\nEND\n```\nMain window → SERIAL/UART → **Open Waveform** (START, D0–D7, STOP). Scope me bhi TXD ka frame dikhega.\n>> rel: sim-uart, serial-tx\n\n@@ c-traffic | Circuits | Circuit: Traffic Light (3 LED) | traffic light, traffic signal circuit, traffic light project, red yellow green led, traffic light code, signal circuit\n## Circuit 13 — Traffic Light\n**Components:** 3 LED (red, yellow, green — right-click → colour), 3 resistors, Battery, Ground.\nHar LED: Battery PLUS → Resistor → ANODE; CATHODE → P1.0 (red), P1.1 (yellow), P1.2 (green).\n```\nORG 0000H\nL:  MOV P1,#0FEH        ; red ON\n    ACALL D5\n    MOV P1,#0FDH        ; yellow ON\n    ACALL D1S\n    MOV P1,#0FBH        ; green ON\n    ACALL D5\n    SJMP L\nD1S: MOV R5,#2\nX1: MOV R6,#255\nX2: MOV R7,#255\nX3: DJNZ R7,X3\n    DJNZ R6,X2\n    DJNZ R5,X1\n    RET\nD5: ACALL D1S\n    ACALL D1S\n    ACALL D1S\n    RET\nEND\n```\n>> rel: dev-led, c-ledblink\n\n@@ c-servo | Circuits | Circuit: Servo ko 90 degree par ghumana | servo circuit, servo wiring, servo project, servo 90 degree, servo circuit step by step\n## Circuit 14 — Servo 90°\n| From | To |\n|---|---|\n| Servo SIG | P1.0 |\n| Servo VCC | Battery PLUS |\n| Servo GND | Ground |\nCode: **Servo Motor (SG90)** entry me working 90° code hai (`MOV R6,#3`). `#2` → 0°, `#4` → 180°.\n>> rel: dev-servo, dev-pwm\n\n@@ multiplexing | Theory | Multiplexing (display scanning) kya hota hai | multiplexing kya hai, display multiplexing, scanning kya hai, multiplex display, persistence of vision, pov, ek ek digit jalana, pins kam karne ka tarika, multiplexing 8051, display scan, refresh rate display, ghosting kya hai, flicker kyun hota hai\n## Multiplexing (Scanning)\n**Idea:** Bahut saare LEDs/digits ko **ek-ek karke** bahut tezi se ON karo. Aankh ka **persistence of vision** (~1/25 s) sab ko ek saath jalta hua dikhata hai.\n**Kyun:** 4 digit × 8 segment = 32 LED. Alag-alag pins se 32 pins lagte, multiplexing me sirf **8 (segment bus) + 4 (digit select) = 12 pins**.\n**Steps (har digit ke liye):**\n1. Saare digits **OFF** karo (ghosting rokne ke liye).\n2. Segment bus par us digit ka **code** rakho.\n3. Sirf **us digit ka select pin** ON karo.\n4. **~1–5 ms** delay.\n5. Agle digit par jao. Poora cycle **< 20 ms** (> 50 Hz) ho to flicker nahi dikhta.\n**Duty cycle:** 4 digits me har digit sirf **1/4 time** ON hota hai → brightness kam; isliye current thoda zyada (resistor chhota) rakhte hain. 8×8 matrix me 1/8.\n**Problems:** *Flicker* = delay bahut bada. *Ghosting* = agle digit ka data purane digit par dikhna (select se pehle blank na karna). *Dim* = delay bahut chhota ya resistor bada.\nSimulator me multiplexing real time me chalti hai — brightness **average ON-time (duty)** se nikalti hai, to slow scan karoge to flicker bhi dikhega.\n>> rel: dev-seg4, dev-matrix, dev-7seg\n\n@@ dev-seg4 | Devices | 4-Digit 7-Segment Display (multiplexed) | 4 digit 7 segment, four digit seven segment, 4 digit display, 4 digit 7seg, 4-digit 7-segment display, 5641as, 5641bs, 4 digit counter, 4 digit clock display, 4 digit display kaise lagaye, 4 digit display simulator me, seg7_4, multi digit display, 4 digit display kaise kaam karta hai, 4 digit display ka use, 4 digit display code, d1 d2 d3 d4, 1234 display\n## 4-Digit 7-Segment Display\n**Kya hai:** 4 seven-segment digits ek package me. **Kis liye:** digital clock (HH:MM), counter 0000–9999, timer, voltmeter/temperature reading, score board.\n**Working:** Chaaron digits ke **segments A–G, DP aapas me jude** hote hain (ek hi 8-pin bus). Har digit ka alag **common pin (D1–D4)** hota hai. Isliye ek time par ek hi digit sahi dikhta hai — baaki digits ko **multiplexing** se tezi se baari-baari jalaya jata hai (dekho: *multiplexing kya hai*).\n**Pins (12):** `A B C D E F G DP D1 D2 D3 D4`\n- **Common Cathode (5641AS):** D1–D4 = digit select, **LOW = digit ON**, segment **HIGH = ON**.\n- **Common Anode (5641BS):** D1–D4 = **HIGH = digit ON**, segment **LOW = ON** (code inverted).\n**Simulator me wiring (CC):**\n| Display pin | 8051 pin |\n|---|---|\n| A, B, C, D, E, F, G, DP | P2.0 … P2.7 |\n| D1, D2, D3, D4 | P1.0, P1.1, P1.2, P1.3 |\nRight-click → **\"Toggle Common Cathode / Common Anode\"**. Segment lines par **330Ω resistor** lagana real-hardware wali aadat hai (bina resistor ke simulator LED ko thoda dim dikhata hai).\n**Code — \"1234\" dikhao (CC):**\n```\n      ORG 0000H\n      MOV 30H,#1\n      MOV 31H,#2\n      MOV 32H,#3\n      MOV 33H,#4\nMAIN: MOV R0,#30H        ; digit data pointer\n      MOV R1,#0FEH       ; D1 select (P1.0 = 0)\nNEXT: MOV P1,#0FFH       ; sab digit OFF (ghosting nahi)\n      MOV A,@R0\n      MOV DPTR,#TAB\n      MOVC A,@A+DPTR     ; digit -> segment code\n      MOV P2,A\n      MOV A,R1\n      MOV P1,A           ; sirf ye digit ON\n      ACALL DELAY        ; ~1 ms\n      MOV A,R1\n      RL A               ; agla digit\n      MOV R1,A\n      INC R0\n      CJNE R0,#34H,NEXT\n      SJMP MAIN\nDELAY: MOV R7,#250\nD1:   DJNZ R7,D1\n      RET\nTAB:  DB 3FH,06H,5BH,4FH,66H,6DH,7DH,07H,7FH,6FH\n      END\n```\n**Tips:** Zyada flicker → delay kam karo. Dim/ghosting → pehle `MOV P1,#0FFH` zaroor karo. Code ke segments badalne ke liye 30H–33H me 0–9 daalo. Common Anode me table ke codes invert (`CPL A`) aur select ko HIGH-active rakho.\n>> rel: multiplexing, dev-7seg, c-seg4count, which-output\n\n@@ c-seg4count | Circuits | Circuit: 4-digit counter 0000-9999 | 4 digit counter circuit, 4 digit counter, 0000 to 9999 counter, 4 digit display counter program, 4 digit seven segment counter, multi digit counter code, 4 digit counter code\n## Circuit 15 — 4-Digit Counter (0000–9999)\n**Components:** IC_8051, 4-Digit 7-Segment (CC), Ground (8051 GND).\n| From | To |\n|---|---|\n| Display A–G, DP | P2.0–P2.7 |\n| Display D1–D4 | P1.0–P1.3 |\n**Code:** (30H = units … 33H = thousands; display left→right = 33H…30H; har ~0.2 s par +1)\n```\n      ORG 0000H\n      MOV 30H,#0\n      MOV 31H,#0\n      MOV 32H,#0\n      MOV 33H,#0\nMAIN: MOV R5,#100\nREF:  ACALL SHOW\n      DJNZ R5,REF\n      ACALL INCR\n      SJMP MAIN\nSHOW: MOV R0,#33H        ; D1 (left) = thousands\n      MOV R1,#0FEH\nNX:   MOV P1,#0FFH\n      MOV A,@R0\n      MOV DPTR,#TAB\n      MOVC A,@A+DPTR\n      MOV P2,A\n      MOV A,R1\n      MOV P1,A\n      ACALL DELAY\n      MOV A,R1\n      RL A\n      MOV R1,A\n      DEC R0\n      CJNE R0,#2FH,NX\n      MOV P1,#0FFH\n      RET\nINCR: MOV R0,#30H\n      MOV R2,#4\nIL:   INC @R0\n      CJNE @R0,#10,DONE\n      MOV @R0,#0\n      INC R0\n      DJNZ R2,IL\nDONE: RET\nDELAY: MOV R7,#200\nD1:   DJNZ R7,D1\n      RET\nTAB:  DB 3FH,06H,5BH,4FH,66H,6DH,7DH,07H,7FH,6FH\n      END\n```\n**Kaise chalta hai:** `SHOW` ek baar chaaron digits ko scan karta hai; `REF` use 100 baar repeat karke ~0.2 s tak display rakhta hai; phir `INCR` units badhata hai aur 10 hote hi carry aage deta hai.\n>> rel: dev-seg4, multiplexing\n\n@@ dev-matrix | Devices | 8x8 LED Dot Matrix (1088AS) | dot matrix, 8x8 dot matrix, 8x8 led matrix, led matrix, dot matrix display, 1088as, 8x8 matrix kaise lagaye, dot matrix simulator me, matrix display, dot matrix kaise kaam karta hai, dot matrix ka use, dot matrix code, letter display matrix, scrolling display, dot matrix row column, row anode column cathode, led matrix 8051, smiley matrix, character display matrix, led matrix kaise kaam karta hai, led matrix working, led matrix kya hai, matrix kya hai\n## 8×8 LED Dot Matrix\n**Kya hai:** 64 LEDs ek 8 row × 8 column grid me (sirf **16 pins**). **Kis liye:** letters/symbols/emoji, scrolling text board, animation, game display.\n**Working (row-column scanning):** Har LED ka ek sira uski **row** se aur doosra **column** se judta hai.\n- **Row Anode (default, 1088AS):** Row **HIGH** + Column **LOW** → us cross-point ki LED ON.\n- Ek time par ek **row** ON karo aur uske columns ka pattern do → phir agli row (8 rows tezi se) → poori image dikhti hai (**multiplexing**, duty 1/8).\n**Pins:** `R1…R8` (rows) aur `C1…C8` (columns).\n**Simulator me wiring:**\n| Matrix pin | 8051 pin |\n|---|---|\n| R1 … R8 | P1.0 … P1.7 |\n| C1 … C8 | P2.0 … P2.7 |\nRight-click → **\"Toggle Row=Anode / Row=Cathode\"** (kuch modules me row/column ulte hote hain). Real hardware me columns par 220–330Ω resistor lagate hain aur rows ko transistor/ULN se drive karte hain.\n**Code — letter \"A\" dikhao:**\n```\n      ORG 0000H\nMAIN: MOV DPTR,#FONT\n      MOV R0,#0          ; row number\n      MOV R1,#01H        ; row select mask (R1 = P1.0)\nSCAN: MOV P1,#00H        ; saari rows OFF (ghosting nahi)\n      MOV A,R0\n      MOVC A,@A+DPTR     ; is row ka pattern\n      CPL A              ; column LOW = LED ON\n      MOV P2,A\n      MOV A,R1\n      MOV P1,A           ; ye row ON\n      ACALL DELAY        ; ~0.5 ms\n      MOV A,R1\n      RL A               ; agli row\n      MOV R1,A\n      INC R0\n      CJNE R0,#8,SCAN\n      SJMP MAIN\nDELAY: MOV R7,#250\nD1:   DJNZ R7,D1\n      RET\nFONT: DB 18H,24H,42H,42H,7EH,42H,42H,42H\n      END\n```\n**Pattern kaise banta hai:** FONT ki har byte ek row hai; byte ka **bit0 = C1 … bit7 = C8**. Jaise `18H = 00011000` → beech ke 2 LED. Apni image banane ke liye 8 bytes badlo (smiley: `3CH,42H,0A5H,81H,0A5H,99H,42H,3CH`). **Scroll** karne ke liye table ke offset ko har ~100 ms par +1 karo.\n**Tips:** Dim lage → delay thoda badhao / resistor kam karo. Flicker → poori scan 20 ms se chhoti rakho. Ek hi row me 8 LED ek saath ON ho sakti hain, isliye real hardware me current ka dhyan rakho (driver lagao).\n>> rel: multiplexing, dev-595, which-output, c-matrixa\n\n@@ c-matrixa | Circuits | Circuit: Dot matrix par letter A | dot matrix circuit, matrix circuit, letter a dot matrix, dot matrix project, 8x8 matrix circuit, led matrix circuit, matrix wiring\n## Circuit 16 — Dot Matrix par \"A\"\n**Components:** IC_8051, 8×8 Dot Matrix, Ground.\n| From | To |\n|---|---|\n| Matrix R1–R8 | P1.0–P1.7 |\n| Matrix C1–C8 | P2.0–P2.7 |\nCode **8×8 LED Dot Matrix** entry me hai. RUN karo → matrix par \"A\" dikhega. FONT ke 8 bytes badalkar koi bhi shape banao.\n>> rel: dev-matrix, multiplexing\n\n@@ dev-dht11 | Devices | DHT11 Temperature + Humidity Sensor | dht11, dht11 kya hai, dht11 sensor, dht11 ka use, dht11 kaise kaam karta hai, dht11 simulator me, dht11 wiring, dht11 code, dht11 8051, humidity sensor, humidity kaise naape, temperature aur humidity, dht11 data pin, dht11 protocol, dht11 start signal, dht11 checksum, single wire sensor, 1 wire sensor, dht11 kaise lagaye, dht11 pull up, dht11 40 bit, dht11 read\n## DHT11 — Temperature + Humidity Sensor\n**Kya hai:** Digital sensor jo **temperature (0–50 °C, ±2°C)** aur **humidity (20–90 %RH, ±5%)** dono deta hai. **Kis liye:** weather station, room monitor, incubator, AC/fan control, greenhouse.\n**LM35 se farak:** LM35 analog hai (ADC chahiye); DHT11 **digital, single wire** hai — ADC nahi chahiye, par protocol timing sahi karni padti hai.\n**Pins:** `VCC` (3.3–5V), `DATA`, `NC`, `GND`. DATA par **~10 kΩ pull-up** hota hai (simulator me 8051 ka internal pull-up kaafi hai).\n**Protocol (single-wire):**\n1. **MCU start:** DATA ko **≥ 18 ms LOW** karo, phir HIGH chhodo.\n2. **DHT11 response:** ~20–40 µs baad **80 µs LOW + 80 µs HIGH**.\n3. **40 bit data**, har bit = **50 µs LOW** + HIGH pulse: **~27 µs = bit 0**, **~70 µs = bit 1**.\n4. Byte order: `RH integer, RH decimal, Temp integer, Temp decimal, Checksum` (Checksum = pehle 4 bytes ka sum, 8-bit).\n5. Last me 50 µs LOW, phir line HIGH (idle).\nDo reads ke beech **≥ 1 s** rakhna chahiye (real sensor ke liye).\n**Simulator me wiring:**\n| DHT11 pin | Connect |\n|---|---|\n| VCC | 8051 VCC (ya Battery+) |\n| GND | Ground |\n| DATA | P1.0 |\n**Temp/Humidity badalne ke liye:** DHT11 par **double-click** (ya right-click → *Set Temperature / Humidity…*). Chhoti si LED data transfer ke time chamakti hai; hover par status aur reads count dikhta hai.\n**Code — read karo (bytes 30H–34H me), humidity P2 par:**\n```\n      ORG 0000H\n      CLR P1.0            ; start signal: LOW\n      MOV R7,#40          ; ~20 ms\nL1:   MOV R6,#230\nL2:   DJNZ R6,L2\n      DJNZ R7,L1\n      SETB P1.0           ; release -> DHT11 jawab dega\nW1:   JB P1.0,W1          ; response LOW ka wait\nW2:   JNB P1.0,W2         ; response HIGH ka wait\nW3:   JB P1.0,W3          ; pehle bit ka LOW shuru\n      MOV R0,#30H\n      MOV R2,#5           ; 5 bytes\nBYTE: MOV R3,#8           ; 8 bits\nBIT:  JNB P1.0,BIT        ; LOW khatam hone ka wait\n      MOV R4,#0\nM:    INC R4              ; HIGH pulse ki chaudai naapo\n      JB P1.0,M\n      MOV A,R4\n      ADD A,#242          ; R4 >= 14 ho to carry = 1 (bit 1)\n      MOV A,R5\n      RLC A               ; carry ko byte me shift karo\n      MOV R5,A\n      DJNZ R3,BIT\n      MOV A,R5\n      MOV @R0,A           ; byte save\n      INC R0\n      DJNZ R2,BYTE\n      MOV P2,30H          ; humidity ko P2 LEDs par dikhao\n      SJMP $\n      END\n```\nResult: `30H = humidity`, `31H = 0`, `32H = temperature`, `33H = 0`, `34H = checksum`. (Debug/Memory me 30H–34H dekho.) Temperature ko 7-seg/LCD par dikhana ho to usko **BCD (DIV AB by 10)** me todo.\n**Common galtiyan:** Start pulse 18 ms se chhota → sensor jawab nahi deta (simulator status me bataata hai). VCC/GND na jodna. Bit-measure loop me threshold galat (0 ≈ 8 iterations, 1 ≈ 21 iterations).\n>> rel: dev-lm35, c-dht11, which-sensor\n\n@@ c-dht11 | Circuits | Circuit: DHT11 se temperature + humidity padhna | dht11 circuit, dht11 project, dht11 wiring step by step, temperature humidity circuit, humidity circuit, dht11 8051 project, weather station circuit\n## Circuit 17 — DHT11 Temperature + Humidity\n**Components:** IC_8051, DHT11, Ground.\n| From | To |\n|---|---|\n| DHT11 VCC | 8051 VCC |\n| DHT11 GND | Ground |\n| DHT11 DATA | P1.0 |\n**Steps:** 1) Wires jodo. 2) DHT11 par double-click → temp 31 °C, humidity 55 % set karo. 3) **DHT11** entry ka code load karke RUN karo. 4) P2 par `55 = 37H` dikhega aur 32H me `31 = 1FH`.\n>> rel: dev-dht11, dev-lm35\n";

// ---- real code check (uses the simulator's own CPU engine) ----
const VALID = setOf(['MOV','MOVX','MOVC','ADD','ADDC','SUBB','INC','DEC','MUL','DIV','DA','ANL','ORL','XRL','CLR','CPL','RL','RLC','RR','RRC','SWAP','SETB','PUSH','POP','XCH','XCHD','JMP','SJMP','LJMP','AJMP','JZ','JNZ','JC','JNC','JB','JNB','JBC','CJNE','DJNZ','LCALL','ACALL','RET','RETI','NOP']);
const h2 = n => (n & 0xFF).toString(16).toUpperCase().padStart(2, '0');
function checkCodeBugs(asm) {
  if (!asm.trim()) return "Pehle apna code paste karo, phir 'Check My Code' dabao.";
  const cpu = new CPU8051();
  try { cpu.assemble(asm); } catch (e) {
    return `❌ Assembler Error mila:\n\n${e.message}\n\nTip: Label spelling, missing comma, ya galat addressing mode check karo. 'Assembly Programming Basics' theory topic bhi dekho common mistakes ke liye.`;
  }
  if (!cpu.program.length) return 'Code assemble hua lekin koi instruction nahi mili — kuch missing hai kya?';
  const warnings = [];
  const unknown = [...new Set(cpu.program.map(i => i.mnem).filter(m => !VALID.has(m.toUpperCase())))].sort();
  if (unknown.length) warnings.push('❌ Ye mnemonic(s) 8051 instruction set mein nahi hain (typo ho sakta hai): ' + unknown.join(', ') + '. Assembler inhe silently ignore kar deta hai!');
  const hasLoopEnd = cpu.program.some(i => ['SJMP','LJMP','AJMP'].includes(i.mnem) && i.args && i.args[0] === '$');
  if (!hasLoopEnd) warnings.push("⚠️ End mein 'SJMP $' jaisa infinite loop nahi dikh raha — continuous chalna hai to CPU jaldi HALT ho jayega.");
  cpu.halted = false; let steps = 0; const MAX = 20000;
  while (!cpu.halted && steps < MAX) { cpu.step_full(); steps++; }
  const status = cpu.halted ? 'CPU HALT ho gaya' : 'infinite loop mein hai (LED-blink jaisa continuous program ho to NORMAL hai)';
  const ports = [[0x90, 'P1'], [0xA0, 'P2'], [0xB0, 'P3'], [0x80, 'P0']];
  const portLines = ports.map(([a, n]) => `  ${n}=${h2(cpu.ram[a])}H(${(cpu.ram[a] & 0xFF).toString(2).padStart(8, '0')}b)`);
  let msg = `✅ Assemble ho gaya (${cpu.program.length} instructions)\n`;
  if (warnings.length) msg += '\n' + warnings.join('\n') + '\n';
  msg += `\n🔍 Chalake dekha (${steps} steps) — ${status}\n  A=${h2(cpu.A)}H  B=${h2(cpu.B)}H\n` + portLines.join('\n');
  return msg;
}

const EXPLAIN_WORDS = setOf(['explain','samjha','samjhao','samjhaiye','samajh','matlab','logic','meaning','kyu','kyun']);

function deviceHint(pin) {
  const m = /^P([0-3])\.([0-7])/.exec(pin.toUpperCase()); if (!m) return '';
  const port = +m[1], bit = +m[2];
  if (port === 1) return ' (LED)';
  if (port === 3 && bit <= 4) return ' (Switch)';
  if (port === 3 && bit === 7) return ' (LCD RS)';
  if (port === 3 && bit === 6) return ' (LCD RW)';
  if (port === 3 && bit === 5) return ' (LCD E)';
  if (port === 2 && bit <= 3) return ' (Keypad row)';
  if (port === 2 && bit >= 4) return ' (Keypad col)';
  if (port === 0) return ' (LCD Data)';

}
function describeOperand(op) {
  op = op.trim();
  if (op.startsWith('#')) return `seedhi value ${op.slice(1)}`;
  if (op === 'A') return 'Accumulator (A)';
  if (op === 'B') return 'Register B';
  if (op === 'C') return 'Carry flag';
  if (op === 'DPTR') return 'Data Pointer (DPTR — 16-bit address register)';
  if (op === 'AB') return 'A aur B (dono registers milake)';
  if (op === '@A+DPTR') return 'code memory ka address jo A+DPTR se milta hai (lookup table)';
  if (op.startsWith('@')) return `jiska address ${op.slice(1)} mein hai (indirect addressing)`;
  if (/^R[0-7]$/.test(op)) return `Register ${op}`;
  const m = /^P([0-3])\.([0-7])$/.exec(op.toUpperCase());
  if (m) return `pin ${op.toUpperCase()}${deviceHint(op)}`;
  if (/^[0-9A-Fa-f]+H$/.test(op)) return `memory address ${op}`;
  return `'${op}' (label/memory location)`;
}

  if (m === 'INC' && a.length === 1) return `${d(a[0])} ki value 1 se badh (increment) rahi hai.`;
  if (m === 'DEC' && a.length === 1) return `${d(a[0])} ki value 1 se ghat (decrement) rahi hai.`;
  if (m === 'MUL' && a.length && a[0] === 'AB') return 'A aur B ka multiplication ho raha hai — 16-bit result: A mein low byte, B mein high byte aata hai.';
  if (m === 'DIV' && a.length && a[0] === 'AB') return 'A ko B se divide kiya ja raha hai — quotient A mein, remainder B mein aata hai.';
  if (['ANL', 'ORL', 'XRL'].includes(m) && a.length === 2) { const n = { ANL: 'AND', ORL: 'OR', XRL: 'XOR' }[m]; return `${d(a[0])} aur ${d(a[1])} ke beech bitwise ${n} ho raha hai, result ${d(a[0])} mein save hota hai.`; }

/* ---------- editor with line highlight (Tk Text tags: hlt / asm_err) ---------- */
function makeHlText(placeholder) {
  const bd = h('div', { class: 'bd' }), ta = h('textarea', { spellcheck: 'false', wrap: 'off', placeholder: placeholder || '' });
  const wrap = h('div', { class: 'hl-wrap' }, bd, ta);
  const st = { hl: null, err: null, extra: null };
  function render() {
    const lines = ta.value.split('\n');
    bd.replaceChildren(...lines.map((t, i) => {
      const cls = (st.err === i + 1) ? 'asm_err' : (st.extra === i + 1 ? 'dptr_row' : (st.hl === i + 1 ? 'hlt' : ''));
      return h('div', { class: cls }, t === '' ? '​' : t);
    }));
    bd.scrollTop = ta.scrollTop; bd.scrollLeft = ta.scrollLeft;
  }
  ta.addEventListener('input', render);
  ta.addEventListener('scroll', () => { bd.scrollTop = ta.scrollTop; bd.scrollLeft = ta.scrollLeft; });
  const api = {
    wrap, ta, render,
    set(v) { ta.value = v; render(); },
    get() { return ta.value; },
    mark(kind, line, see) { st[kind] = line; render(); if (see && line) api.see(line); },
    see(line) {
      const lh = 16, y = (line - 1) * lh;
      if (y < ta.scrollTop) ta.scrollTop = y; else if (y + lh > ta.scrollTop + ta.clientHeight - 20) ta.scrollTop = y - ta.clientHeight / 2;
    },
  };
  render(); return api;
}

/* =====================================================================
   Updating the GUI from the CPU (ports of update_register_fields etc.)
   ===================================================================== */
function crystalMHz() { const v = parseFloat(ui.crystal.value); return isNaN(v) ? 11.0592 : v; }
function fmtTimeUs(us, d1 = 3) { return us < 1000 ? `${us.toFixed(d1)} us` : us < 1e6 ? `${(us / 1000).toFixed(3)} ms` : `${(us / 1e6).toFixed(3)} s`; }
function traceAppend(s) {
  const t = ui.trace; t.value += s;
  if (t.value.length > 120000) t.value = t.value.slice(-80000);
  t.scrollTop = t.scrollHeight;
}
function updateRegisterFields(hlAddr) {
  const a = cpu.A & 0xFF, b = cpu.B & 0xFF;
  ui.regHex.A.value = hex2(a); ui.regHex.B.value = hex2(b);
  ui.regBits.A.forEach((cb, i) => cb.checked = !!((a >> (7 - i)) & 1));
  ui.regBits.B.forEach((cb, i) => cb.checked = !!((b >> (7 - i)) & 1));
  ui.pcsp.PC.value = hex4(cpu.PC); ui.pcsp.SP.value = hex2(cpu.SP); ui.pcsp.DPTR.value = hex4(cpu.get_DPTR());
  for (let bk = 0; bk < 4; bk++) for (let r = 0; r < 8; r++) ui.bankEnt[bk + ',' + r].value = hex2(cpu.ram[bk * 8 + r] & 0xFF);
  [0x80, 0x90, 0xA0, 0xB0].forEach((addr, i) => { const pv = addr < cpu.ram.length ? cpu.ram[addr] : 0xFF; for (let bit = 0; bit < 8; bit++) ui.portBits[i][bit].checked = !!((pv >> bit) & 1); });
  const pm = { CY: 7, AC: 6, F0: 5, RS1: 4, RS0: 3, OV: 2, P: 0 };
  for (const [n, bit] of Object.entries(pm)) ui.psw[n].checked = !!((cpu.PSW >> bit) & 1);
  const ins = cpu._find_instr_by_pc();
  if (ins) {
    const mnem = ins.mnem.toUpperCase(), mc = cpu._MC[mnem] || 1;
    const mcUs = 12.0 / (crystalMHz() * 1e6) * 1e6, insUs = mc * mcUs;
    const totUs = (cpu._total_cycles || 0) * mcUs;
    const t = totUs < 1000 ? `${totUs.toFixed(2)}us` : totUs < 1e6 ? `${(totUs / 1000).toFixed(3)}ms` : `${(totUs / 1e6).toFixed(4)}s`;
    traceAppend(`PC=${hex4(cpu.PC)}  ${(ins.raw || '?').padEnd(20)}  MC=${mc}  ${insUs.toFixed(3)}us  [${t}]\n`);
  }
  if (hlAddr != null) highlightSourceForAddr(hlAddr);
}
function highlightSourceForAddr(addr) {
  editor.mark('hl', null);
  if (addr == null || !cpu.addr2line) return;
  if (addr in cpu.addr2line) editor.mark('hl', cpu.addr2line[addr] + 1, true);
}
function updateMemoryViews() {
  const lines = [];
  for (let a = 0; a < 256; a += 8) { const r = []; for (let i = 0; i < 8; i++) r.push(hex2(cpu.ram[a + i])); lines.push(hex2(a) + ': ' + r.join(' ')); }
  const v = lines.join('\n') + '\n'; if (ui.intRam.value !== v) ui.intRam.value = v;
  if (ui.ramSel.selectedIndex === 1) xramRefresh();
  ui.pcsp.DPTR.value = hex4(cpu.get_DPTR());
}
function refreshCodeMemoryView() {
  const L = []; const c = cpu.code;
  for (let a = 0; a < 65536; a += 16) { let s = hex4(a) + ':'; for (let i = 0; i < 16; i++) s += ' ' + hex2(c[a + i]); L.push(s); }
  ui.codeMem.value = L.join('\n') + '\n';
}
function xramGoto() { const v = parseInt(ui.xAddr.value.trim(), 16); if (!isNaN(v)) { ui.xramBase = v & 0xFF00; xramRefresh(); } }
function xramRefresh() {

const Auth = (function () {
  'use strict';
  const APP_NAME = 'McuLab', CREATOR = 'Developed by Nida Chowdhry';
  const KEY_U = 'mculab_users_v1', KEY_A = 'mculab_activity_v1';
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },

  };

    const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);

      if (![fn, un, pw, pw2].every(Boolean)) { msgWarn('Missing Info', 'Saari fields bharo.'); return; }

      if (pw.length < 4) { msgWarn('Weak Password', 'Password kam se kam 4 characters ka rakho.'); return; }

      u.push({ id: u.length + 1, full_name: fn, username: un, password_hash: sha256(pw) }); saveUsers(u);
      await msgInfo('Success', 'Account ban gaya! Ab Login tab se login karo.');
      sel('l'); regFields.forEach(f => rv[f].value = '');
    };
  }

})();
