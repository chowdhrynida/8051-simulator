<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>McuLab — 8051 Simulator</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:12px "Segoe UI",Tahoma,"Helvetica Neue",Arial,sans-serif;background:#e8e8e8;color:#000;overflow:auto}
button,input,select,textarea{font-family:inherit;font-size:inherit}
[hidden]{display:none!important}

/* ---------- Tk-like widgets ---------- */
.tk-btn{background:#f0f0f0;color:#000;border:1px solid;border-color:#fff #6d6d6d #6d6d6d #fff;box-shadow:inset -1px -1px #a0a0a0,inset 1px 1px #e3e3e3;padding:3px 8px;cursor:default;font:12px "Segoe UI",Arial,sans-serif;min-height:23px}
.tk-btn:active{border-color:#6d6d6d #fff #fff #6d6d6d;box-shadow:inset 1px 1px #a0a0a0,inset -1px -1px #e3e3e3;padding:4px 7px 2px 9px}
.tk-btn:hover{filter:brightness(1.04)}
.ttk-btn{background:#e1e1e1;color:#000;border:1px solid #adadad;padding:3px 8px;min-height:23px;font:12px "Segoe UI",Arial,sans-serif;cursor:default}
.ttk-btn:hover{background:#e5f1fb;border-color:#0078d7}.ttk-btn:active{background:#cce4f7;border-color:#005499}
.lf{border:2px groove #fcfcfc;background:#fff;margin:0;padding:5px;min-width:0}
.lf>legend{padding:0 2px;font-size:12px;color:#000}
.ent{background:#fff;color:#000;border:2px solid;border-color:#a0a0a0 #fff #fff #a0a0a0;box-shadow:inset 1px 1px #696969;padding:1px 3px;font:12px "Segoe UI",Arial,sans-serif;height:21px;min-width:0}
.ent.mono{font:11px "Courier New",monospace}
.ent:focus{outline:1px solid #3399ff;outline-offset:0}
.cell-h{background:#f0f0f0;color:#000;border:2px ridge #fcfcfc;text-align:center;font:9px Arial,sans-serif;padding:1px 0;line-height:12px}
.cell-v{background:#fff;color:#000;border:2px solid;border-color:#a0a0a0 #fff #fff #a0a0a0;text-align:center;font:11px "Courier New",monospace;padding:0;line-height:14px}
select.tk-sel{background:#fff;border:1px solid #7a7a7a;height:21px;padding:0 2px;font:11px Arial,sans-serif}
.cb{width:13px;height:13px;margin:0;accent-color:#0078d7}
.cb.ind{pointer-events:none}
.cb.dis{pointer-events:none;opacity:.55}

/* ---------- main window ---------- */
#app{min-height:100vh}
#main_frame{display:grid;grid-template-columns:minmax(300px,1fr) minmax(400px,1.15fr) minmax(440px,1.25fr);grid-template-rows:auto auto minmax(250px,1fr);padding:10px;min-height:100vh;background:#e8e8e8}
#btn_row{grid-column:1/4;display:flex;gap:10px;padding:0 0 10px;align-items:center;flex-wrap:wrap}
#btn_row .tk-btn,#btn_row .ttk-btn{width:98px}
#devices_btn{background:#FF9800!important;color:#fff;font:bold 12px Arial,sans-serif;width:82px!important}
#left_panel{padding-right:5px;display:flex;flex-direction:column;min-width:0}
#middle_panel{padding:5px;min-width:0;display:flex;flex-direction:column}
#right_panel{padding-left:5px;min-width:0;display:flex;flex-direction:column}
#bottom_panel{grid-column:1/4;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr);padding-top:10px;min-height:250px;gap:0 10px}
#left_panel>.lf,#middle_panel>.lf,#right_panel>.lf{margin-bottom:9px}
.hl-wrap{position:relative;flex:1;min-height:120px;background:#fff;border:2px solid;border-color:#a0a0a0 #fff #fff #a0a0a0;box-shadow:inset 1px 1px #696969;overflow:hidden}
.hl-wrap .bd,.hl-wrap textarea{position:absolute;inset:0;margin:0;border:0;padding:3px 4px;font:13px/16px "Courier New",monospace;white-space:pre;tab-size:8;letter-spacing:0;word-spacing:0;font-variant-ligatures:none}
.hl-wrap .bd{overflow:hidden;color:#000;pointer-events:none;padding-bottom:40px}
.hl-wrap .bd div{min-height:16px}
.hl-wrap textarea{background:transparent;color:transparent;caret-color:#000;resize:none;outline:none;overflow:auto;z-index:1}
.hl-wrap textarea::selection{background:rgba(51,153,255,.38);color:transparent}
.hl-wrap .bd .hlt{background:#fff2a8}
.hl-wrap .bd .asm_err{background:#FF4444;color:#fff}
.hl-wrap .bd .dptr_row{background:#FFFACD;color:#CC0000}
.mem-ta{width:100%;height:100%;resize:none;background:#f0f0f0;border:2px solid;border-color:#a0a0a0 #fff #fff #a0a0a0;box-shadow:inset 1px 1px #696969;padding:3px 4px;font:bold 13px/16px "Courier New",monospace;white-space:pre;overflow:auto;outline:none}
.mem-hdr{font:bold 13px/16px "Courier New",monospace;white-space:pre;color:#000;padding:0 4px 2px}
.trace-ta{width:100%;flex:1;min-height:110px;resize:none;background:#f8f8f8;color:#333;border:2px solid;border-color:#a0a0a0 #fff #fff #a0a0a0;box-shadow:inset 1px 1px #696969;font:12px/15px "Courier New",monospace;padding:3px;white-space:pre;overflow:auto;outline:none}
.bitrow{display:flex;align-items:flex-end}
.bitcol{display:flex;flex-direction:column;align-items:center;margin:0 2px;font-size:12px}
#doubt_btn{position:fixed;right:14px;bottom:14px;z-index:900;background:#7C93C3;color:#fff;border:0;width:66px;height:62px;font:bold 11px "Segoe UI",sans-serif;line-height:14px;cursor:pointer}
#doubt_btn:hover{background:#5C74A8}

/* ---------- floating windows ---------- */
.win{position:fixed;z-index:1000;background:#f0f0f0;border:1px solid #5a5a5a;box-shadow:0 8px 28px rgba(0,0,0,.35);display:flex;flex-direction:column;min-width:260px;min-height:120px}
.win>.tb{display:flex;align-items:center;background:#fff;height:30px;flex:none;user-select:none;cursor:default;border-bottom:1px solid #d0d0d0}
.win.active>.tb{background:#dbe7f6}
.win>.tb .ttl{flex:1;padding:0 10px;font:12px "Segoe UI",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win>.tb button{width:40px;height:30px;border:0;background:transparent;font-size:14px;cursor:default;color:#222}
.win>.tb button:hover{background:#e0e0e0}.win>.tb .x:hover{background:#e81123;color:#fff}
.win>.body{flex:1;min-height:0;position:relative;overflow:auto}
.win .rz{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:5;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.3) 50%,rgba(0,0,0,.3) 58%,transparent 58%,transparent 72%,rgba(0,0,0,.3) 72%,rgba(0,0,0,.3) 80%,transparent 80%)}
#modal_layer{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:9000;display:flex;align-items:center;justify-content:center}
.dlg{background:#f0f0f0;border:1px solid #444;box-shadow:0 10px 36px rgba(0,0,0,.45);min-width:320px;max-width:560px;font:12px "Segoe UI",sans-serif}
.dlg .tb{background:#fff;height:30px;line-height:30px;padding:0 10px;border-bottom:1px solid #d0d0d0}
.dlg .mb{background:#fff;padding:20px 20px 24px;display:flex;gap:16px;align-items:flex-start}
.dlg .ic{font-size:30px;line-height:30px;flex:none}
.dlg .msg{white-space:pre-wrap;line-height:1.45;max-height:60vh;overflow:auto}
.dlg .bb{padding:12px;display:flex;justify-content:flex-end;gap:8px}
.dlg .bb button{min-width:78px;height:25px;background:#e1e1e1;border:1px solid #adadad}
.dlg .bb button:hover{background:#e5f1fb;border-color:#0078d7}.dlg .bb button.def{border-color:#0078d7}

/* ---------- UART window ---------- */
.uart{background:#0a0f0a;color:#ddd;height:100%;display:flex;flex-direction:column}
.uart .hdr{background:#0d1a0d;padding:6px 10px;display:flex;align-items:center;gap:10px;font:11px "Courier New",monospace}
.uart .ch{background:#0f1a0f;margin:5px 6px;padding:4px 6px 6px;border:2px groove #223;position:relative}
.uart .ch legend{font:bold 12px Arial,sans-serif;padding:0 4px}
.uart canvas{display:block;width:100%;background:#020e02;border:1px solid #1a3a1a}
.uart .bot{background:#0d1a0d;padding:6px;display:flex;align-items:center;gap:6px;margin-top:auto}
.uart .bot button{border:1px solid #333;font:12px Arial}

/* ---------- ChipMitra ---------- */
@keyframes pulse{50%{background:#ffe6b0}}

/* ---------- splash + login ---------- */
#boot{position:fixed;inset:0;z-index:8000;background:#e8e8e8;display:flex;align-items:center;justify-content:center}
.splash{width:520px;max-width:96vw;height:320px;background:#0d1b2a;text-align:center;font-family:Arial,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.splash .bolt{font-size:48px;color:#00FF88;margin-top:34px;line-height:56px}
.splash .nm{font:bold 28px Arial;color:#fff;margin-top:4px}
.splash .sb{font-size:14px;color:#88AACC;margin-top:6px}
.splash .by{font:italic 13px Arial;color:#557799;margin-top:30px}
.splash .pg{width:300px;height:8px;background:#1d2d40;margin:30px auto 0;overflow:hidden;position:relative}
.splash .pg i{position:absolute;top:0;bottom:0;width:90px;background:#3b9cff;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{left:-90px}100%{left:300px}}
.auth{width:420px;max-width:96vw;height:480px;background:#f2f4f7;box-shadow:0 12px 40px rgba(0,0,0,.4);font-family:Arial,sans-serif;display:flex;flex-direction:column}
.auth .ah{background:#0d1b2a;height:90px;text-align:center;flex:none}
.auth .ah b{display:block;font:bold 21px Arial;color:#fff;padding-top:20px}.auth .ah span{font-size:13px;color:#88AACC}
.auth .tabs{margin:15px 15px 0;display:flex;gap:2px}
.auth .tabs button{border:1px solid #c4c4c4;border-bottom:0;background:#e5e5e5;padding:5px 12px;font:13px Arial;cursor:pointer}
.auth .tabs button.on{background:#f2f4f7;font-weight:bold}
.auth .pane{margin:0 15px 15px;border:1px solid #c4c4c4;background:#f2f4f7;flex:1;padding:6px 0;overflow:auto}
.auth label{display:block;margin:18px 30px 2px;font:13px Arial}
.auth label:first-child{margin-top:26px}
.auth input{display:block;width:calc(100% - 60px);margin:0 30px;font:14px Arial;padding:3px 4px;border:2px solid;border-color:#a0a0a0 #fff #fff #a0a0a0;box-shadow:inset 1px 1px #696969}
.auth .go{display:block;width:calc(100% - 60px);margin:28px 30px 0;height:48px;border:1px solid;border-color:#fff #555 #555 #fff;color:#fff;font:bold 15px Arial;cursor:pointer}
.auth .go:disabled{opacity:.6}

/* ---------- ChipMitra v3 (light studio) ---------- */
.cm3{--bg:#f4f2ff;--card:#fff;--line:#e3def8;--tx:#1f1b3a;--mut:#6b668a;--acc:#6d4aff;--acc2:#8b6bff;--acc3:#ece7ff;--org:#ff7a2f;--grn:#14b87a;display:flex;height:100%;background:var(--bg);color:var(--tx);font:14px/1.55 "Segoe UI",system-ui,sans-serif}
.cm3 *{box-sizing:border-box}
.cm3 .rail{width:76px;flex:none;background:linear-gradient(180deg,#2a1b6e,#4a2fc2);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
.cm3 .rlogo{width:44px;height:44px;border-radius:14px;background:#fff3;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:10px;box-shadow:inset 0 0 0 1px #fff4}
.cm3 .rb{width:62px;padding:6px 0 4px;border-radius:14px;text-align:center;color:#d8d0ff;cursor:pointer;transition:.15s}
.cm3 .rb:hover{background:#ffffff1f;color:#fff}.cm3 .rb.on{background:#fff;color:var(--acc);box-shadow:0 4px 14px #0003}
.cm3 .ri{font-size:21px;line-height:24px}.cm3 .rl{font:700 10px "Segoe UI";margin-top:1px;letter-spacing:.3px}
.cm3 .sp{flex:1}
.cm3 .area{flex:1;min-width:0;display:flex;flex-direction:column}
.cm3 .hd{display:flex;align-items:center;gap:12px;padding:11px 22px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.cm3 .nm{font:800 21px "Segoe UI";letter-spacing:-.3px}.cm3 .nm b{background:linear-gradient(90deg,var(--acc),var(--org));-webkit-background-clip:text;background-clip:text;color:transparent}
.cm3 .sub{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm3 .pill{font:600 11.5px "Segoe UI";color:var(--acc);background:var(--acc3);padding:5px 12px;border-radius:99px;white-space:nowrap}
.cm3 .vws{flex:1;min-height:0;position:relative}
.cm3 .vw{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}.cm3 .vw[hidden]{display:none}
.cm3 .msgs{flex:1;min-height:0;overflow:auto;padding:22px 28px 6px;scroll-behavior:smooth}
.cm3 .wel{max-width:860px;margin:6px auto 0}
.cm3 .wh{font:800 30px "Segoe UI";letter-spacing:-.5px;margin-bottom:6px}
.cm3 .wp{color:var(--mut);max-width:640px;margin-bottom:18px;font-size:14.5px}
.cm3 .hg{margin-bottom:14px}.cm3 .ht{font:700 12px "Segoe UI";color:var(--acc);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px}
.cm3 .hs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px}
.cm3 .hc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13.2px;transition:.15s}
.cm3 .hc span{font-size:20px}.cm3 .hc:hover{border-color:var(--acc);box-shadow:0 5px 16px #6d4aff22;transform:translateY(-1px)}
.cm3 .wf{margin-top:14px;color:var(--mut);font-size:12.5px}
.cm3 code{font-family:Consolas,monospace;background:var(--acc3);color:#4b2fd0;border-radius:5px;padding:0 5px;font-size:.92em}
.cm3 .row{display:flex;gap:11px;margin:0 auto 16px;max-width:880px}
.cm3 .row.u{justify-content:flex-end}
.cm3 .av{width:34px;height:34px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--org));color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;margin-top:2px;box-shadow:0 3px 10px #6d4aff44}
.cm3 .bc{min-width:0;flex:1}
.cm3 .bub{border-radius:16px;padding:12px 16px;min-width:0;word-wrap:break-word}
.cm3 .bub.u{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-bottom-right-radius:5px;max-width:76%;white-space:pre-wrap}
.cm3 .bub.a{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-top-left-radius:5px;box-shadow:0 2px 10px #6d4aff0f}
.cm3 .typing .bub{padding:13px 16px}.cm3 .dots{display:inline-flex;gap:5px}.cm3 .dots i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:cm3dot 1s infinite}.cm3 .dots i:nth-child(2){animation-delay:.15s}.cm3 .dots i:nth-child(3){animation-delay:.3s}
@keyframes cm3dot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.cm3 .md>*:first-child{margin-top:0}.cm3 .md>*:last-child{margin-bottom:0}
.cm3 .md p{margin:7px 0}.cm3 .md ul,.cm3 .md ol{margin:6px 0;padding-left:22px}.cm3 .md li{margin:3px 0}
.cm3 .md b{color:#14102e}.cm3 .md i{color:var(--acc)}
.cm3 .md .h1,.cm3 .md .h2{font:800 18px "Segoe UI";color:var(--acc);margin:0 0 8px;padding-bottom:7px;border-bottom:2px solid var(--acc3)}
.cm3 .md .h3{font:700 14.5px "Segoe UI";color:var(--org);margin:12px 0 4px}
.cm3 .md hr{border:0;border-top:1px dashed var(--line);margin:12px 0}
.cm3 .tw{overflow:auto;margin:9px 0;border:1px solid var(--line);border-radius:10px}
.cm3 table{border-collapse:collapse;width:100%;font-size:13px}
.cm3 th{background:var(--acc3);color:#3d26b0;text-align:left;padding:7px 11px;font:700 12px "Segoe UI";white-space:nowrap}
.cm3 td{padding:6px 11px;border-top:1px solid var(--line);vertical-align:top}.cm3 tr:nth-child(even) td{background:#faf9ff}
.cm3 .code{margin:10px 0;border-radius:12px;overflow:hidden;background:#1d1a35;box-shadow:0 4px 14px #1d1a3533}
.cm3 .cbar{display:flex;align-items:center;gap:8px;padding:6px 11px;background:#2b2750;font:600 11px Consolas,monospace;color:#b7b0e8}
.cm3 .cbtn{white-space:nowrap;flex:none;background:#413a80;color:#efeaff;border:0;border-radius:7px;font:600 11px "Segoe UI";padding:4px 10px;cursor:pointer}.cm3 .cbtn:hover{background:#5848c8}.cm3 .cbtn.ld{background:var(--org);color:#fff}.cm3 .cbtn.ld:hover{filter:brightness(1.1)}
.cm3 .code pre{margin:0;padding:12px 15px;overflow:auto;font:13px/1.55 Consolas,monospace;color:#d9f7e7;white-space:pre;max-height:380px}
.cm3 .fu{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:10px}.cm3 .fu span{font-size:11.5px;color:var(--mut)}
.cm3 .fchip{background:#fff;border:1px solid var(--line);color:var(--acc);border-radius:99px;padding:4px 12px;font:600 12px "Segoe UI";cursor:pointer}.cm3 .fchip:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.cm3 .comp{flex:none;padding:6px 28px 14px;max-width:936px;width:100%;margin:0 auto}
.cm3 .comp .row{margin:0 0 7px;max-width:none;align-items:flex-end;gap:8px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 8px 8px 16px;box-shadow:0 4px 18px #6d4aff14}.cm3 .comp .row:focus-within{border-color:var(--acc)}
.cm3 textarea{flex:1;resize:none;background:transparent;border:0;outline:none;color:var(--tx);font:14.5px/1.5 "Segoe UI",Consolas,monospace;max-height:150px;padding:7px 0}.cm3 textarea::placeholder{color:#9a95b8}
.cm3 .send{height:40px;padding:0 20px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--acc),var(--org));color:#fff;font:700 13.5px "Segoe UI";cursor:pointer;white-space:nowrap}.cm3 .send:hover{filter:brightness(1.08)}
.cm3 .tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.cm3 .tool{background:#fff;border:1px solid var(--line);color:#4b3fa0;border-radius:99px;padding:5px 13px;font:600 12px "Segoe UI";cursor:pointer}.cm3 .tool:hover{border-color:var(--acc);background:var(--acc3)}
.cm3 .kh{font-size:11px;color:var(--mut)}
.cm3 .vh{padding:18px 28px 6px}.cm3 .vt{font:800 22px "Segoe UI";letter-spacing:-.3px}.cm3 .vs{color:var(--mut);font-size:13px}
.cm3 .vq{margin:8px 28px 4px;max-width:420px;padding:9px 13px;border:2px solid var(--line);border-radius:12px;background:#fff;font:13.5px "Segoe UI";outline:none;color:var(--tx)}.cm3 .vq:focus{border-color:var(--acc)}
.cm3 .vb{flex:1;overflow:auto;padding:6px 28px 24px;min-height:0}
.cm3 .cg{font:800 12px "Segoe UI";color:var(--acc);text-transform:uppercase;letter-spacing:.9px;margin:16px 0 8px}
.cm3 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.cm3 .grid.sg{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.cm3 .dc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;cursor:pointer;text-align:center;transition:.15s}
.cm3 .dc:hover{border-color:var(--acc);box-shadow:0 8px 22px #6d4aff24;transform:translateY(-2px)}
.cm3 .di{font-size:30px;line-height:36px}.cm3 .dn{font:700 13.5px "Segoe UI";margin-top:4px}.cm3 .ds{font-size:11.5px;color:var(--mut)}
.cm3 .grid.ig{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.cm3 .ic{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}.cm3 .ic b{font:800 14px Consolas,monospace;color:var(--acc)}.cm3 .ic span{font-size:11.5px;color:var(--mut)}.cm3 .ic:hover{border-color:var(--acc);background:#faf8ff}
.cm3 .chips{display:flex;flex-wrap:wrap;gap:8px}
.cm3 .tc{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:13px}.cm3 .tc:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.cm3 .none{color:var(--mut);padding:18px 0}
.cm3 ::-webkit-scrollbar{width:9px;height:9px}.cm3 ::-webkit-scrollbar-thumb{background:#cfc7f5;border-radius:9px}
@media(max-width:700px){.cm3 .rail{width:56px}.cm3 .rb{width:48px}.cm3 .rl{display:none}.cm3 .pill{display:none}}

</style>
</head>
<body>
<script>
/* ==== data ==== */
const CM_THEORY={"1. 8051 Kya Hai?": "\n8051 EK 8-BIT MICROCONTROLLER HAI\n\n8051 Intel ne 1980 mein banaya tha (MCS-51 family). Ye ek \"microcontroller\"\nhai, \"microprocessor\" nahi — matlab isme CPU ke saath-saath RAM, ROM, I/O\nports, Timers aur Serial port bhi ek hi chip ke andar built-in hote hain.\n\nIsliye 8051 ko \"computer on a single chip\" bhi kehte hain.\n\nMAIN FEATURES:\n  - 8-bit CPU (data 8 bits mein process hota hai)\n  - 4KB internal ROM (program store karne ke liye)\n  - 128 bytes internal RAM (data store karne ke liye)\n  - 4 parallel I/O ports (P0, P1, P2, P3) — total 32 pins\n  - 2 Timers/Counters (16-bit)\n  - 1 Serial (UART) communication port\n  - 5 Interrupt sources\n  - Operating frequency: aksar 11.0592 MHz crystal use hota hai\n    (ye specific value isliye kyunki isse UART baud rate exactly\n    match ho jaata hai — 9600, 4800 jaise standard rates ke liye)\n\nKAHAN USE HOTA HAI:\n  Washing machines, microwave ovens, remote controls, toys, traffic\n  light controllers, small robots, embedded control systems — jahan\n  bhi simple, dedicated control logic chahiye wahan 8051 jaisa\n  microcontroller perfect hai. Aaj real products mein 8051 ki jagah\n  ARM/PIC/AVR use hote hain, lekin 8051 ABHI BHI colleges mein\n  microcontroller-programming sikhane ke liye #1 choice hai kyunki\n  iska architecture simple aur samajhne mein easy hai.\n", "2. 8051 Architecture": "\n8051 KA INTERNAL ARCHITECTURE\n\n8051 ke andar ye main blocks hote hain:\n\n1. CPU (Central Processing Unit)\n   - ALU (Arithmetic Logic Unit): add, subtract, AND, OR jaise operations\n   - Register Bank: A (Accumulator), B, R0-R7\n   - Program Counter (PC): agla instruction kahan se fetch karna hai,\n     uska address rakhta hai\n   - Stack Pointer (SP): stack ka top address rakhta hai\n\n2. Memory\n   - Program Memory (ROM/Flash): 4KB — aapka assembly code yahan store\n     hota hai (address 0000H se shuru)\n   - Data Memory (RAM): 128 bytes — variables, temp data yahan store\n     hota hai (address 00H se 7FH)\n   - SFR (Special Function Registers): 80H se FFH tak — ye special\n     addresses hain jinse Ports, Timers, Serial port control hote hain\n\n3. I/O Ports\n   - P0, P1, P2, P3 — har port 8 pins ka, total 32 I/O pins\n\n4. Timers/Counters\n   - Timer0 aur Timer1 — dono 16-bit, delay generate karne ya\n     external events count karne ke liye\n\n5. Serial Port (UART)\n   - Doosre devices se data bhejne/lene ke liye (RXD = P3.0, TXD = P3.1)\n\n6. Interrupt Control\n   - 5 interrupt sources jo CPU ko turant kisi important kaam\n     ke liye \"bulaa\" sakte hain (jaise Timer overflow, external signal)\n\nSIMPLE ANALOGY: Socho 8051 ek chota factory hai — CPU manager hai jo\nfaisle leta hai, RAM temporary notice-board hai, ROM permanent rule-book\nhai, aur Ports factory ke darwaze hain jinse cheezein andar-bahar aati\njaati hain.\n", "3. Pin Diagram & Description": "\n8051 KA PIN DIAGRAM (40-pin DIP package)\n\nIMPORTANT PINS:\n  Pin 1-8    : P1.0 - P1.7   (Port 1, pure I/O, no alternate function)\n  Pin 9      : RST           (Reset — HIGH karne se CPU reset ho jaata hai)\n  Pin 10-17  : P3.0 - P3.7   (Port 3, alternate functions bhi hain)\n  Pin 18, 19 : XTAL2, XTAL1  (Crystal oscillator connect karne ke liye)\n  Pin 20     : GND\n  Pin 21-28  : P2.0 - P2.7   (Port 2)\n  Pin 29     : PSEN          (Program Store Enable — external ROM read)\n  Pin 30     : ALE           (Address Latch Enable)\n  Pin 31     : EA            (External Access — HIGH=internal ROM use karo)\n  Pin 32-39  : P0.7 - P0.0   (Port 0)\n  Pin 40     : VCC (+5V)\n\nPORT 3 KE ALTERNATE (SPECIAL) FUNCTIONS:\n  P3.0 = RXD   (Serial data receive)\n  P3.1 = TXD   (Serial data transmit)\n  P3.2 = INT0  (External Interrupt 0)\n  P3.3 = INT1  (External Interrupt 1)\n  P3.4 = T0    (Timer 0 external input)\n  P3.5 = T1    (Timer 1 external input)\n  P3.6 = WR    (External memory Write control)\n  P3.7 = RD    (External memory Read control)\n\nYAAD RAKHNE KA TARIKA: \"Port 3 special hai\" — kyunki har baaki port\n(P0,P1,P2) sirf plain I/O hai, lekin P3 ke har pin ka ek \"double role\"\nhai (isliye P3 ko dual-purpose port kehte hain).\n", "4. Memory Organization": "\n8051 KI MEMORY ORGANIZATION\n\n8051 mein DO alag memory spaces hote hain (Harvard architecture):\n\n(A) PROGRAM MEMORY (ROM) — 0000H se FFFH (4KB)\n    - Yahan aapka ASSEMBLY CODE (instructions) store hota hai\n    - CPU hamesha 0000H se execution shuru karta hai (reset ke baad)\n    - Isko sirf READ kiya ja sakta hai (isliye \"MOVC\" instruction\n      use hoti hai isse padhne ke liye, normal \"MOV\" nahi)\n\n(B) DATA MEMORY (RAM) — 00H se FFH (internal), aur XRAM 0000H-FFFFH (external)\n    Internal RAM ke andar bhi 3 regions hain:\n\n    00H - 1FH : REGISTER BANKS (4 banks, har bank mein R0-R7)\n                 Bank 0 = 00H-07H, Bank 1 = 08H-0FH,\n                 Bank 2 = 10H-17H, Bank 3 = 18H-1FH\n                 (PSW ke RS1,RS0 bits decide karte hain konsa\n                 bank active hai)\n\n    20H - 2FH : BIT-ADDRESSABLE AREA\n                 Ye 16 bytes = 128 individual BITS hain, jinhe\n                 SETB/CLR/JB/JNB se directly access kar sakte ho\n                 (jaise \"SETB 20H.0\")\n\n    30H - 7FH : GENERAL PURPOSE RAM\n                 Yahan apna normal data/variables store karo\n\n    80H - FFH : SFR (Special Function Registers) area\n                 Ports, Timers, PSW, SP, IE, SCON jaise control\n                 registers yahan mapped hain (jaise P1 = 90H)\n\nMEMORY MAP YAAD RAKHNE KA TRICK:\n  \"0 se 1F Register, 20 se 2F Bit, 30 se 7F General, 80 se FF SFR\"\n", "5. Registers — A, B, PSW, SP, DPTR": "\n8051 KE MAIN REGISTERS\n\nA (ACCUMULATOR) — Address E0H\n  Sabse important register. Zyadatar arithmetic/logic operations\n  A ke through hi hote hain. Jaise \"ADD A, R1\" ka matlab A = A + R1\n\nB REGISTER — Address F0H\n  Sirf MUL aur DIV instructions mein use hota hai.\n  MUL AB: A×B ka result -> A(low byte), B(high byte)\n  DIV AB: A÷B ka result -> A(quotient), B(remainder)\n  Baaki time B ko normal RAM byte jaisa bhi use kar sakte ho.\n\nR0-R7 (WORKING REGISTERS)\n  8 general purpose registers, loop counters, temp storage ke\n  liye use hote hain. Ye actually RAM ke 00H-07H addresses hi hain\n  (register bank ke hisaab se shift hote hain).\n\nPSW (PROGRAM STATUS WORD) — Address D0H\n  Ye ek \"flag register\" hai jisme 8 bits hain, har bit ek status\n  batata hai:\n    Bit 7 = CY  (Carry flag — addition mein carry-out ya subtraction\n                  mein borrow hua kya)\n    Bit 6 = AC  (Auxiliary Carry — BCD arithmetic ke liye, lower\n                  nibble se carry)\n    Bit 5 = F0  (User-defined flag, jo bhi chaho use karo)\n    Bit 4,3 = RS1,RS0 (Register bank select — 00=Bank0, 01=Bank1, etc)\n    Bit 2 = OV  (Overflow — signed number arithmetic mein overflow)\n    Bit 1 = --  (Reserved, user-usable)\n    Bit 0 = P   (Parity — A mein 1's ki count odd hai to P=1)\n\nSP (STACK POINTER) — Address 81H\n  Stack ka current top-address rakhta hai. PUSH karne pe SP+1 hota\n  hai phir data store hota hai; POP karne pe pehle data read hota\n  hai phir SP-1 hota hai. Reset ke baad SP=07H hota hai default.\n\nDPTR (DATA POINTER) — 16-bit (DPH:DPL, address 83H:82H)\n  Ye ek 16-bit pointer hai — external memory access (MOVX) aur\n  lookup tables (MOVC A,@A+DPTR) ke liye use hota hai. Isse aap\n  poori 64KB memory address kar sakte ho.\n", "6. Ports P0, P1, P2, P3": "\n8051 KE 4 PORTS — DUAL ROLE SAMJHO\n\nHar port 8-bit hai, total 32 I/O pins milte hain.\n\nPORT 0 (P0) — Address 80H\n  - Agar internal ROM use kar rahe ho: normal I/O port hai, LEKIN\n    iske pins ko \"open-drain\" hone ki wajah se external pull-up\n    resistors lagane padte hain agar output ke liye use karna ho.\n  - Agar external memory use kar rahe ho: ye multiplexed\n    Address(low byte)/Data bus ban jaata hai.\n\nPORT 1 (P1) — Address 90H\n  - SABSE SIMPLE PORT — pure general purpose I/O, koi alternate\n    function nahi. Isliye LED/switch practice ke liye sabse zyada\n    use hota hai (jaise is simulator mein LEDs P1 pe connected hain).\n\nPORT 2 (P2) — Address A0H\n  - Normal I/O, LEKIN external memory use karte time ye Address\n    ka HIGH byte deta hai.\n\nPORT 3 (P3) — Address B0H\n  - Normal I/O + 8 special/alternate functions (RXD, TXD, INT0,\n    INT1, T0, T1, WR, RD) — dekho \"Pin Diagram\" topic mein.\n\nREADING vs WRITING:\n  Port ko \"output\" ki tarah use karna ho to us port ke SFR address\n  pe MOV karo (jaise \"MOV P1, #0FFH\" sabhi LED ON). Port ko \"input\"\n  ki tarah use karna ho to pehle us port pe 1 likho (float karne\n  ke liye), phir waha se MOV karke read karo.\n", "7. Addressing Modes": "\n8051 KE ADDRESSING MODES (data ko access karne ke tarike)\n\n1. IMMEDIATE ADDRESSING (#)\n   Value directly instruction mein likhi hoti hai.\n   Example: MOV A, #25H   → A mein 25H seedha load ho jaata hai\n\n2. REGISTER ADDRESSING\n   Data kisi register (R0-R7, A, B) mein hota hai.\n   Example: MOV A, R0     → R0 ki value A mein copy hoti hai\n\n3. DIRECT ADDRESSING\n   RAM ka exact address diya jaata hai.\n   Example: MOV A, 30H    → RAM address 30H ki value A mein aati hai\n\n4. INDIRECT ADDRESSING (@)\n   Register (R0/R1) ke ANDAR jo address hai, wahan se data lo.\n   Example: MOV A, @R0    → R0 mein jo address hai, uss address\n                             ki RAM value A mein aati hai\n   (Ye \"pointer\" jaisa concept hai — C language ke *ptr jaisa)\n\n5. INDEXED ADDRESSING\n   Lookup tables padhne ke liye use hota hai (Program memory se).\n   Example: MOVC A, @A+DPTR → A+DPTR jo address banta hai,\n                               waha ka ROM byte A mein aata hai\n\n6. RELATIVE ADDRESSING\n   Jump instructions (SJMP, conditional jumps) mein current PC se\n   relative offset use hota hai (-128 se +127 tak).\n\n7. BIT ADDRESSING\n   Individual bits ko directly access karna.\n   Example: SETB P1.0     → sirf P1 ke bit 0 ko 1 karo, baaki\n                              bits untouched rehte hain\n", "8. Instruction Set — Categories": "\n8051 INSTRUCTION SET — 5 MAIN CATEGORIES\n\n1. DATA TRANSFER INSTRUCTIONS\n   MOV, MOVX (external RAM), MOVC (code memory/lookup), PUSH, POP,\n   XCH (exchange), XCHD (exchange lower nibble)\n\n2. ARITHMETIC INSTRUCTIONS\n   ADD, ADDC (add with carry), SUBB (subtract with borrow),\n   INC (increment), DEC (decrement), MUL AB, DIV AB,\n   DA A (Decimal Adjust — BCD arithmetic correct karne ke liye)\n\n3. LOGICAL INSTRUCTIONS\n   ANL (AND), ORL (OR), XRL (XOR), CLR (clear), CPL (complement),\n   RL/RLC (rotate left), RR/RRC (rotate right), SWAP (nibble swap)\n\n4. BRANCHING / CONTROL INSTRUCTIONS\n   SJMP, LJMP, AJMP (unconditional jumps)\n   JZ, JNZ, JC, JNC, JB, JNB, JBC, CJNE, DJNZ (conditional jumps)\n   LCALL, ACALL, RET, RETI (subroutine call/return)\n   NOP (no operation)\n\n5. BIT MANIPULATION INSTRUCTIONS\n   SETB, CLR, CPL (on individual bits)\n   ANL C,bit / ORL C,bit (bit-level logic with Carry flag)\n   MOV C,bit / MOV bit,C\n\nTIP: Beginner hote hue, pehle MOV, ADD, SUBB, SJMP, DJNZ, CJNE aur\nbit instructions (SETB/CLR/JB) achhe se practice karo — 90% programs\ninhi se ban jaate hain!\n", "8b. Arithmetic — ADD, SUB, MUL, DIV Explained": "\nARITHMETIC OPERATIONS — Step-by-Step Deep Dive\n\n(A) ADDITION — ADD / ADDC\n    ADD A, source   → A = A + source\n    Example: MOV A, #05H\n             ADD A, #03H     ; A = 05H + 03H = 08H\n    3 FLAGS update hote hain automatically:\n      CY (Carry)  → agar result 8-bit (FFH) se bada ho jaaye\n      AC (Aux Carry) → agar lower nibble (4 bits) se carry ho\n      OV (Overflow) → agar SIGNED number ka result galat range\n                        mein chala jaaye (jaise 2 positive numbers\n                        add karne se negative result aa jaaye)\n\n    ADDC A, source  → A = A + source + CY (pichhle carry ko bhi\n                        add karta hai — BIG numbers add karne ke\n                        liye use hota hai, jaise 16-bit + 16-bit:\n                        pehle lower bytes ADD karo, phir upper\n                        bytes ADDC karo taaki carry propagate ho)\n\n(B) SUBTRACTION — SUBB (Subtract with Borrow)\n    8051 mein SIRF \"SUBB\" hai, plain \"SUB\" nahi hota!\n    SUBB A, source  → A = A - source - CY\n\n    IMPORTANT: Agar simple subtraction karni hai (A - source, bina\n    borrow ke), to PEHLE \"CLR C\" karna zaroori hai, warna purana CY\n    bit galti se subtract ho jayega!\n    Example: CLR C           ; carry clear karo pehle\n             MOV A, #08H\n             SUBB A, #03H     ; A = 08H - 03H - 0 = 05H\n\n    CY flag yahan \"BORROW\" ka kaam karta hai — agar source, A se\n    bada hai, to CY=1 set hoga (borrow hua matlab).\n\n(C) MULTIPLICATION — MUL AB\n    MUL AB  → A aur B register ko multiply karta hai\n    Result: A = LOW byte, B = HIGH byte (16-bit result, 2 registers\n    mein split hota hai kyunki 8×8 bit multiply ka max result\n    16-bit tak ja sakta hai — 255×255=65025)\n    Example: MOV A, #0AH      ; A = 10\n             MOV B, #05H       ; B = 5\n             MUL AB              ; A=32H(50 low byte), B=00H(high byte)\n    OV flag set hota hai agar result 255 se bada ho (matlab B≠0)\n\n(D) DIVISION — DIV AB\n    DIV AB  → A ko B se divide karta hai\n    Result: A = QUOTIENT, B = REMAINDER\n    Example: MOV A, #0AH      ; A = 10 (dividend)\n             MOV B, #03H       ; B = 3  (divisor)\n             DIV AB              ; A = 03H (quotient), B = 01H (remainder)\n    SPECIAL CASE: Agar B=0 hai (divide by zero), to OV flag SET ho\n    jaata hai aur A,B mein undefined/garbage value aa jaata hai —\n    isliye DIV se pehle hamesha check karo B≠0 hai.\n\nQUICK COMPARISON TABLE:\n    Operation | Instruction | Registers used | Result kaha\n    ----------|-------------|-----------------|-------------\n    Add       | ADD/ADDC    | A + source      | A (+ CY flag)\n    Subtract  | SUBB        | A - source - CY | A (+ CY flag)\n    Multiply  | MUL AB      | A × B           | A(low), B(high)\n    Divide    | DIV AB      | A ÷ B           | A(quotient), B(remainder)\n", "9. Timers & Counters": "\nTIMER/COUNTER 0 aur 1 (16-bit each)\n\nKAAM: Delay generate karna, ya external pulses count karna.\n\nMAIN REGISTERS:\n  TMOD (89H) — Timer MODE set karta hai (kaunsa mode, timer ya\n               counter). Format: GATE-C/T-M1-M0 (har timer ke liye\n               4 bits — Timer1 upper nibble, Timer0 lower nibble)\n  TCON (88H) — Timer CONTROL: TR0/TR1 (Run/Stop), TF0/TF1\n               (Overflow flag — jab timer 0000H pe wapas aata hai\n               to ye flag SET ho jaata hai)\n  TH0,TL0 (8CH,8AH) / TH1,TL1 (8DH,8BH) — Timer ki High aur Low\n               byte, yahan initial value load karte hain\n\nTIMER MODES (M1 M0):\n  Mode 0 : 13-bit timer (purana, kam use hota hai)\n  Mode 1 : 16-bit timer  ← SABSE ZYADA USE HOTA HAI\n  Mode 2 : 8-bit auto-reload (baar-baar same value se restart)\n  Mode 3 : Split mode (Timer0 do alag 8-bit timers ban jaata hai)\n\nSIMPLE DELAY PROGRAM LOGIC (Mode 1):\n  1. MOV TMOD, #01H     ; Timer0, Mode 1 select karo\n  2. MOV TH0, #high_byte\n     MOV TL0, #low_byte  ; starting count value load karo\n  3. SETB TR0            ; Timer start karo\n  4. HERE: JNB TF0, HERE ; overflow hone tak wait karo (poll karo)\n  5. CLR TR0              ; Timer stop karo\n     CLR TF0              ; flag clear karo (manually karna padta hai)\n\nCRYSTAL FREQUENCY CONNECTION: 8051 mein 1 machine cycle = 12 crystal\npulses lagte hain. 11.0592MHz crystal pe 1 machine cycle = 1.085 µs.\nIsi hisab se TH0/TL0 ki value calculate karke exact delay milta hai.\n", "10. Interrupts": "\n8051 KE INTERRUPTS — CPU ko \"abhi turant ye kaam karo\" bolna\n\n8051 mein 5 interrupt sources hain, har ek ka fix \"vector address\"\nhai (jahan CPU turant jump karta hai jab wo interrupt trigger ho):\n\n  IE0  (External Interrupt 0) → Vector: 0003H\n  TF0  (Timer 0 Overflow)     → Vector: 000BH\n  IE1  (External Interrupt 1) → Vector: 0013H\n  TF1  (Timer 1 Overflow)     → Vector: 001BH\n  RI/TI (Serial Interrupt)    → Vector: 0023H\n\nMAIN REGISTERS:\n  IE (Interrupt Enable, A8H) — kaunsa interrupt ON karna hai\n     Bit 7 = EA (Global enable — sabse pehle ye 1 karna zaroori hai!)\n     Bit 1 = ET0 (Timer0), Bit 3 = ET1 (Timer1)\n     Bit 0 = EX0, Bit 2 = EX1 (External interrupts)\n     Bit 4 = ES (Serial interrupt)\n\n  IP (Interrupt Priority, B8H) — agar 2 interrupts same time pe\n     aayein to konsa pehle serve hoga, ye decide karta hai\n     (1 = high priority)\n\nKAISE KAAM KARTA HAI:\n  1. Normal program chal raha hai\n  2. Interrupt trigger hota hai (jaise Timer0 overflow)\n  3. CPU current PC ko stack pe PUSH karta hai\n  4. CPU us interrupt ke vector address pe jump karta hai\n  5. Waha likha ISR (Interrupt Service Routine) code chalta hai\n  6. RETI instruction se CPU wapas original PC pe return karta hai\n\nEXAMPLE (Timer0 ISR):\n    MOV IE, #82H     ; EA=1, ET0=1 (Timer0 interrupt ON)\n    SETB TR0\n    SJMP $           ; main program yahan \"wait\" karta rehta hai\n    ORG 000BH        ; Timer0 ka vector address\n    ; ... ISR code yahan ...\n    RETI             ; wapas jaane ke liye\n\nYAAD RAKHO: RETI se pehle koi bhi register jo ISR mein use kiya,\nusko PUSH/POP se save-restore karna best practice hai, warna main\nprogram ka data corrupt ho sakta hai.\n", "11. Serial Communication (UART)": "\nSERIAL PORT — Doosre devices se data bhejna/lena (ek wire pe,\nbit-by-bit)\n\nMAIN REGISTERS:\n  SBUF (99H) — Serial Buffer. Isme WRITE karne se data TRANSMIT\n               hona shuru hota hai. Isse READ karne se RECEIVED\n               data milta hai.\n  SCON (98H) — Serial CONtrol register\n               SM0,SM1 = Serial mode select (Mode 1 sabse common —\n                         8-bit UART, variable baud rate)\n               REN = Receive Enable\n               TI  = Transmit Interrupt flag (1 hota hai jab\n                     transmission complete ho jaaye)\n               RI  = Receive Interrupt flag (1 hota hai jab naya\n                     byte receive ho jaaye)\n\nBAUD RATE: Timer1 (Mode 2, auto-reload) se generate hota hai.\n11.0592MHz crystal is liye popular hai kyunki isse EXACTLY\n9600, 4800, 2400, 1200 baud jaise standard rates milte hain\nbina kisi error ke.\n\nTYPICAL SEND PROGRAM:\n    MOV TMOD, #20H   ; Timer1, Mode 2 (auto-reload) — baud rate ke liye\n    MOV TH1, #0FDH   ; 9600 baud @ 11.0592MHz ke liye ye value\n    SETB TR1\n    MOV SCON, #50H   ; Mode 1, REN enable\n    MOV SBUF, #'H'   ; 'H' character transmit karo\n    HERE: JNB TI, HERE  ; transmit complete hone tak wait\n    CLR TI\n\nTYPICAL RECEIVE PROGRAM:\n    HERE: JNB RI, HERE  ; koi data aane tak wait\n    MOV A, SBUF          ; received byte ko A mein le lo\n    CLR RI                ; flag clear karo agli receive ke liye\n", "12. Assembly Programming Basics": "\n8051 ASSEMBLY PROGRAM KAISE LIKHTE HAIN\n\nBASIC STRUCTURE:\n    ORG 0000H        ; program yahan se shuru hoga (reset vector)\n        SJMP MAIN     ; interrupt vectors ki jagah bachane ke liye\n                       ; seedha MAIN pe jump kar do\n\n    ORG 0030H        ; interrupt vectors (0000H-002FH) ke baad\n                       ; actual code yahan se shuru karo\n    MAIN:\n        MOV A, #00H\n        ; ... aapka code ...\n        SJMP $        ; infinite loop (program yahi rukega — warna\n                       ; CPU \"halt\" ho jaayega jo galat hai agar\n                       ; continuous chalna hai)\n    END\n\nCOMMON DIRECTIVES:\n  ORG addr   — batata hai next instruction kis address pe rakhi jaaye\n  END        — assembly source file ka end batata hai\n  DB value   — Define Byte (data table banane ke liye)\n  EQU        — koi naam ek constant value ko assign karo\n               (jaise COUNT EQU 10)\n\nLABELS: Koi bhi naam jo colon (:) ke saath likha ho, wo ek \"label\"\nhai jise jump/call instructions target kar sakte hain.\n    LOOP:\n        DJNZ R0, LOOP    ; R0 = 0 hone tak LOOP pe wapas jao\n\nCOMMENTS: Semicolon (;) ke baad jo bhi likho wo comment hai, CPU\nusko ignore karta hai — apna code samjhaane ke liye use karo!\n\nCOMMON BEGINNER MISTAKES:\n  1. SJMP $ ya koi infinite loop bhool jaana → program \"halt\" ho\n     jaata hai jaldi (single-shot chal ke ruk jaata hai)\n  2. Label ka naam typo — \"LOOP\" likha aur \"LOOPP\" pe jump kiya\n  3. Bit-addressable na hone wali RAM location pe SETB/CLR try karna\n     (sirf 20H-2FH range hi bit-addressable hai)\n  4. Register bank confusion — R0-R7 alag banks mein alag physical\n     address pe hote hain\n", "13. Interfacing — LED, 7-Segment, LCD, Keypad": "\nCOMMON INTERFACING CONCEPTS (Is simulator ke mapping ke hisaab se)\n\nLED INTERFACING (P1.0 - P1.7)\n  Har LED ek port pin se connect hoti hai. Pin HIGH (1) karne se\n  LED ON hoti hai (agar current-limiting resistor ke saath common\n  cathode setup hai). Simplest program: MOV P1, #0FFH sab ON,\n  MOV P1, #00H sab OFF.\n\n7-SEGMENT DISPLAY (Common Cathode, segments A-G on P1.0-P1.6)\n  Har digit (0-9) ek specific segment pattern se banta hai.\n  Jaise \"0\" dikhane ke liye segments A,B,C,D,E,F ON karne padte\n  hain (G OFF). Ek lookup table (DB directive se) banake MOVC se\n  padhna sabse efficient tarika hai.\n\nLCD (16x2, RS=P3.7, RW=P3.6, E=P3.5, Data=P0.0-P0.7)\n  RS=0 matlab COMMAND bhej rahe ho (jaise clear screen, cursor\n  position), RS=1 matlab DATA (actual character) bhej rahe ho.\n  E pin pe HIGH-to-LOW transition (falling edge) hone se LCD\n  data ko \"latch\" (capture) karta hai — isliye E ko pulse karna\n  zaroori hai har command/data ke baad.\n\nKEYPAD (Rows P2.0-P2.3 output, Cols P2.4-P2.7 input)\n  \"Scanning\" technique use hoti hai: ek-ek row ko LOW karo,\n  phir columns check karo koi LOW hai kya (matlab wahan key press\n  hui). Row-column combination se pata chalta hai kaunsi key\n  dabi hai.\n\nDC MOTOR (P1.0/P1.1 direction control)\n  2 pins se direction control hoti hai (H-bridge circuit ke\n  through) — jaise P1.0=1,P1.1=0 forward, P1.0=0,P1.1=1 reverse.\n", "14. Debugging Tips (Iss Simulator Mein)": "\nAPNA CODE DEBUG KAISE KARO\n\n1. \"Assemble\" dabao pehle — agar syntax error hai to red highlight\n   ke saath line number dikhega. Error message dhyan se padho,\n   aksar label spelling ya missing comma jaisi choti galti hoti hai.\n\n2. \"Step\" button use karo — instruction-by-instruction chalao aur\n   Register panel (A, R0-R7, PSW flags) dekho ki values expected\n   ke hisaab se change ho rahi hain ya nahi.\n\n3. PSW flags dekho — CY, AC, OV, P bits arithmetic ke baad check\n   karo, especially agar conditional jumps (JC, JNC) use kar rahe ho.\n\n4. Agar program \"halt\" ho jaata hai turant — check karo ki end mein\n   \"SJMP $\" ya koi infinite loop hai kya. Warna CPU 1 baar chal ke\n   ruk jaata hai.\n\n5. LED/LCD/etc kaam nahi kar raha — Devices window mein pehle wire\n   connections check karo (IC ke pin se component ke pin tak wire\n   hona chahiye), phir port mapping check karo (jaise LED P1 pe\n   honi chahiye, P2 pe nahi).\n\n6. Infinite loop mein phasa lagta hai — Step button se dheere-dheere\n   chalao aur dekho PC (Program Counter) kahan baar-baar wapas\n   aa raha hai, wahi tumhara loop hai.\n\n7. Is Doubt-Clear chat mein apna poora code paste karke pooch sakte\n   ho \"isme kya bug hai\" — main check karke bataunga.\n", "15. Simulator Kaise Use Karein (Complete Guide)": "\nIS SIMULATOR KA POORA WORKFLOW — Step by Step\n\nYe simulator 2 main windows mein kaam karta hai: (A) MAIN WINDOW jaha code\nlikhte/test karte ho, (B) DEVICES WINDOW jaha real components ke saath\ncircuit banake dekhte ho.\n\n═══════════════════════════════════════════\n(A) MAIN WINDOW — Code likhna aur test karna\n═══════════════════════════════════════════\n\nLEFT SIDE:\n  \"Assemble code\" box — yahan apna 8051 assembly code type karo\n  \"Clock / Machine Cycle\" — simulation speed control karta hai\n\nTOP BUTTONS:\n  Assemble  — code check karta hai, errors dikhata hai agar hon\n  Run       — poora program ek saath continuously chalata hai\n  Step      — EK instruction chalata hai har click pe (debugging\n              ke liye best — dheere-dheere dekh sakte ho kya ho\n              raha hai)\n  Reset     — CPU ko wapas shuru (PC=0000H, saare registers 0) kar\n              deta hai, naya test shuru karne se pehle use karo\n  Stop      — chal rahe \"Run\" ko beech mein rok deta hai\n  Save Code — apna .asm file save karta hai (DEVICES window mein\n              upload karne ke liye zaroori)\n  DEVICES   — Devices/Circuit window kholta hai\n\nMIDDLE — LIVE OBSERVATION PANELS (Run/Step karte waqt yahan dekho):\n  Registers      — A (Accumulator), B, DPTR, SP, PC ki current value\n  PSW Flags      — CY, AC, F0, OV, P flags (bit-level, ON/OFF dikhta hai)\n  Ports P0-P3    — har port ke individual pins ki HIGH/LOW state,\n                    bit-level pe dikhta hai\n  Register Banks — R0-R7 (jo bank active hai uske values)\n\nBOTTOM:\n  Code Memory (0000h-FFFFh) — aapka assembled machine code (hex bytes)\n                                yahan dikhta hai, current PC highlight\n                                hota hai\n\nTIP: \"Step\" button dabate-dabate Registers/PSW/Ports panel dekho —\nisse pata chalta hai HAR instruction ke baad exactly kya change hua,\njo debugging ke liye sabse powerful tarika hai.\n\n═══════════════════════════════════════════\n(B) DEVICES WINDOW — Real circuit banana\n═══════════════════════════════════════════\n\nYe tab kaam aata hai jab LED, LCD, 7-segment, motor, keypad jaise\nREAL COMPONENTS ke saath apna code test karna ho (sirf register\nvalues dekhne se zyada, VISUAL simulation).\n\nSTEP-BY-STEP:\n  1. Pehle Main Window mein code likho, \"Assemble\" karo (errors check\n     karne ke liye), phir \"Save Code\" dabake .asm file save karo\n  2. \"DEVICES\" button dabao — naya circuit-designer window khulega\n  3. LEFT SIDE mein \"Component Library\" hai — yahan se IC_8051 ko\n     canvas pe DRAG karke place karo (search box se dhoondh sakte ho)\n  4. Fir jo components chahiye (LED, 7-Segment, LCD, Motor, Keypad,\n     Switch, etc.) unhe bhi canvas pe drag-place karo\n  5. \"Wire Mode (W)\" button dabao (ya keyboard shortcut 'W') — ab\n     wiring mode ON ho jayega\n  6. IC_8051 ke kisi PIN pe click karo, phir component ke pin pe\n     click karo — dono ke beech ek WIRE ban jayegi (jaise IC ka\n     P1.0 pin → LED ka anode pin)\n  7. Sab connections ho jaane ke baad, \"Upload Code\" button dabao aur\n     apni saved .asm file select karo\n  8. \"RUN\" dabao — ab simulation LIVE chalegi aur components\n     (LED jalna-bujhna, LCD pe text, 7-seg digits, etc.) REAL-TIME\n     update honge apke code ke hisaab se!\n\nCOMMON MISTAKE: Agar components respond nahi kar rahe, to check karo:\n  - Wire sahi PIN se sahi PIN tak gayi hai kya (jaise LED ka pin\n    IC ke SAHI port-pin se juda hai kya — is simulator mein LEDs\n    generally P1 pe, switches P3 pe expected hote hain)\n  - Code \"Upload\" hua tha kya RUN dabane se pehle\n  - Assemble mein koi error to nahi tha\n\n═══════════════════════════════════════════\n(C) UART WAVEFORM VIEWER (Serial communication dekhne ke liye)\n═══════════════════════════════════════════\n\nAgar aapka code Serial Port (UART) use karta hai, to \"UART Waveform\"\nwindow kholke aap TX/RX ki actual waveform (START bit, D0-D7 data\nbits, STOP bit) live dekh sakte ho, saath mein current Baud rate bhi\ndikhta hai. \"RX inject\" box se manually koi byte \"receive\" hone ka\nsimulate bhi kar sakte ho (jaise koi doosra device data bhej raha ho).\n\n═══════════════════════════════════════════\n(D) MERI (ChipMitra) MADAD KAISE LO\n═══════════════════════════════════════════\n\nKabhi bhi confuse ho — simulator ka koi button samajh na aaye, wire\nconnect na ho paaye, ya code chalne ke baad expected result na aaye\n— seedha mujhse pucho! Apna sawal type karo ya code paste karke\n\"Check My Code\" dabao.\n"};
const CM_WORKFLOW={"Main Window — Buttons aur Panels": "\nMAIN WINDOW mein \"Assemble code\" box hota hai jahan aap apna 8051\nassembly code likhte ho. Neeche/upar ye buttons milte hain:\n\n  - Assemble  -> sirf syntax check karta hai, chalata nahi\n  - Run       -> poora program end-to-end chala deta hai\n  - Step      -> ek-ek instruction karke chalata hai (debugging ke\n                 liye best)\n  - Reset     -> CPU ko wapas shuru se restart karta hai\n  - Stop      -> Run ko beech mein rok deta hai\n  - Save Code -> current code ko .asm file mein save karta hai\n                 (DEVICES window use karne ke liye zaroori hai)\n  - DEVICES   -> circuit-designer window kholta hai\n\nSide mein LIVE panels dikhte hain jo har step ke baad update hote\nhain: Registers (A, B, DPTR, SP, PC), PSW Flags (CY, AC, F0, OV, P),\nPorts P0-P3 (bit-level pin states), Register banks (R0-R7), aur Code\nmemory (assembled hex bytes with current PC highlight).\n\nTIP: Agar samajh nahi aa raha code kya kar raha hai, to \"Step\"\nbutton se ek-ek instruction chalao aur Registers/PSW panel dekho ki\nhar step ke baad kya value change hui.\n", "DEVICES Window — Circuit Kaise Banayein": "\nDEVICES window mein real components ke saath ek circuit banate hain\ntaaki aapka code actual hardware jaisa simulate ho (LED jalna,\nLCD pe text aana, wagera).\n\nSteps (order important hai):\n  1. Pehle Main Window mein apna code \"Assemble\" karo (syntax check\n     ho jaana chahiye, error-free)\n  2. \"Save Code\" button se .asm file save karo\n  3. \"DEVICES\" button dabao — circuit-designer window khulega\n  4. LEFT side \"Component Library\" se IC_8051 ko canvas pe drag\n     karo\n  5. Jo bhi component chahiye (LED, LCD, 7-Segment, Motor, Keypad,\n     Switch) usko bhi canvas pe drag-drop karo\n  6. \"Wire Mode (W)\" button ya shortcut dabao — wiring mode ON hoga\n  7. IC ke pin pe click karo, phir component ke uss pin pe click\n     karo jise jodna hai — ek wire automatically ban jaayegi\n     (jaise IC ka P1.0 pin -> LED ka anode)\n  8. \"Upload Code\" button dabake wahi .asm file select karo jo\n     Save Code se banayi thi\n  9. \"RUN\" button dabao — components ab real-time simulate honge\n     (LED jalega, LCD pe text aayega, wagera)\n\nAgar LED nahi jal raha ya component response nahi de raha, to check\nkaro: wiring sahi pin se juda hai kya, code assemble error-free hai\nkya, aur \"Upload Code\" ke through latest .asm file hi load hui hai\nkya.\n", "UART / Serial Waveform Window": "\nAgar aap serial communication (UART) wala code test kar rahe ho,\nto ek special window milta hai jo TX/RX ki actual waveform dikhata\nhai — START bit, D0 se D7 tak data bits, aur STOP bit, plus current\nBaud rate live dikhta hai.\n\n\"RX inject\" box se aap manually data receive hone ka simulation kar\nsakte ho, jaise koi external device ne UART pe data bheja ho — ye\ntesting ke liye useful hai jab aapke paas do real devices nahi hain.\n", "Simulator Port Mapping (Yaad Rakhne Wali Cheez)": "\nIs simulator mein components fixed pins se jude hote hain:\n  - LEDs           -> P1.0 se P1.7\n  - Switches        -> P3.0 se P3.4\n  - Keypad rows      -> P2.0 se P2.3\n  - Keypad cols       -> P2.4 se P2.7\n  - LCD RS           -> P3.7\n  - LCD RW            -> P3.6\n  - LCD E              -> P3.5\n  - LCD Data (8-bit)    -> P0.0 se P0.7\n  - 7-Segment display    -> P1.0 se P1.6\n  - Crystal frequency      -> 11.0592 MHz (isliye UART baud rates\n                              jaise 9600 exactly match hote hain)\n\nCode likhte waqt agar aap in exact pins ka use karoge, to DEVICES\nwindow mein wiring bhi seedha in hisaab se karna aasan hoga.\n"};
const CM_SAMPLES={"LED Blink (P1)": "; Ek LED blink karna P1.0 pe\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    SETB P1.0\n    ACALL DELAY\n    CLR  P1.0\n    ACALL DELAY\n    SJMP MAIN\n\nDELAY:\n    MOV R0, #0FFH\nD1: MOV R1, #0FFH\nD2: DJNZ R1, D2\n    DJNZ R0, D1\n    RET\nEND\n", "All LEDs Chase (P1)": "; LED ek-ek karke left se right chase karega\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV A, #01H\nLOOP:\n    MOV P1, A\n    ACALL DELAY\n    RL A\n    SJMP LOOP\n\nDELAY:\n    MOV R0, #0FFH\nD1: MOV R1, #0FFH\nD2: DJNZ R1, D2\n    DJNZ R0, D1\n    RET\nEND\n", "Read Switch -> LED (P3.0 -> P1.0)": "; Switch dabao to LED ON ho\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV P3, #0FFH      ; P3 ko input mode ke liye HIGH karo\nLOOP:\n    MOV C, P3.0        ; switch state carry mein lo\n    MOV P1.0, C        ; wahi state LED pe bhej do\n    SJMP LOOP\nEND\n", "7-Segment Counter 0-9 (P1)": "; 0 se 9 tak counter, 7-seg display pe (common cathode)\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV R0, #00H\nLOOP:\n    MOV A, R0\n    MOV DPTR, #SEGTABLE\n    MOVC A, @A+DPTR\n    MOV P1, A\n    ACALL DELAY\n    INC R0\n    CJNE R0, #0AH, LOOP\n    MOV R0, #00H\n    SJMP LOOP\n\nSEGTABLE:\n    DB 3FH, 06H, 5BH, 4FH, 66H   ; 0,1,2,3,4\n    DB 6DH, 7DH, 07H, 7FH, 6FH  ; 5,6,7,8,9\n\nDELAY:\n    MOV R1, #0FFH\nD1: MOV R2, #0FFH\nD2: DJNZ R2, D2\n    DJNZ R1, D1\n    RET\nEND\n", "Timer0 Delay (Mode 1)": "; Timer0 se accurate delay (11.0592MHz crystal)\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV TMOD, #01H     ; Timer0, Mode 1 (16-bit)\nLOOP:\n    CPL P1.0            ; LED toggle\n    MOV TH0, #3CH        ; ~50ms delay values\n    MOV TL0, #0B0H\n    SETB TR0\nWAIT:\n    JNB TF0, WAIT\n    CLR TR0\n    CLR TF0\n    SJMP LOOP\nEND\n", "Timer0 Interrupt ISR": "; Timer0 overflow pe interrupt use karke LED toggle\nORG 0000H\n    SJMP MAIN\nORG 000BH             ; Timer0 ISR vector\n    CPL P1.0\n    MOV TH0, #3CH\n    MOV TL0, #0B0H\n    RETI\nORG 0030H\nMAIN:\n    MOV TMOD, #01H\n    MOV TH0, #3CH\n    MOV TL0, #0B0H\n    MOV IE, #82H       ; EA=1, ET0=1\n    SETB TR0\n    SJMP $              ; wait yahin — interrupt handle karega\nEND\n", "UART Send Character": "; Serial port se ek character bhejna (9600 baud @ 11.0592MHz)\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV TMOD, #20H    ; Timer1 Mode2 (auto-reload) baud rate ke liye\n    MOV TH1, #0FDH     ; 9600 baud\n    SETB TR1\n    MOV SCON, #50H     ; Serial Mode 1, REN enable\n    MOV SBUF, #'H'\n    JNB TI, $\n    CLR TI\n    SJMP $\nEND\n", "LCD Display 'HI' (RS=P3.7 RW=P3.6 E=P3.5 Data=P0)": "; LCD pe \"HI\" print karna (simplified, 8-bit mode)\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    CLR P3.6            ; RW=0 (write mode)\n    ; --- LCD init command: Function set 8-bit, 2-line ---\n    MOV P0, #38H\n    CLR P3.7             ; RS=0 (command)\n    SETB P3.5             ; E pulse HIGH\n    CLR P3.5              ; E LOW -> latch\n    ACALL DELAY\n\n    ; --- Display ON, cursor ON ---\n    MOV P0, #0FH\n    CLR P3.7\n    SETB P3.5\n    CLR P3.5\n    ACALL DELAY\n\n    ; --- Write 'H' ---\n    MOV P0, #'H'\n    SETB P3.7            ; RS=1 (data)\n    SETB P3.5\n    CLR P3.5\n    ACALL DELAY\n\n    ; --- Write 'I' ---\n    MOV P0, #'I'\n    SETB P3.7\n    SETB P3.5\n    CLR P3.5\n    ACALL DELAY\n\n    SJMP $\n\nDELAY:\n    MOV R0, #50H\nD1: MOV R1, #0FFH\nD2: DJNZ R1, D2\n    DJNZ R0, D1\n    RET\nEND\n", "DJNZ Delay Loop (Basic)": "; Simple nested-loop delay - beginner practice\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV A, #00H\nLOOP:\n    INC A\n    ACALL DELAY\n    CJNE A, #0FFH, LOOP\n    SJMP MAIN\n\nDELAY:\n    MOV R0, #0FFH\nD1: MOV R1, #0FFH\nD2: DJNZ R1, D2\n    DJNZ R0, D1\n    RET\nEND\n", "Add Two Numbers (with Carry check)": "; Do numbers add karke result + carry dikhana\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV A, #0F5H\n    MOV R1, #2BH\n    ADD A, R1          ; A = A + R1, CY/AC/OV flags update honge\n    MOV P1, A            ; result LED pe dikhao\n    MOV C, PSW.7          ; carry flag ko C mein lo\n    SJMP $\nEND\n", "Subtract Two Numbers (SUBB)": "; Subtraction — CLR C zaroori hai pehle!\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    CLR C               ; purana carry clear karo warna galat result aayega\n    MOV A, #08H\n    MOV R1, #03H\n    SUBB A, R1           ; A = 08H - 03H - 0 = 05H\n    MOV P1, A              ; result LED pe dikhao (05H)\n    SJMP $\nEND\n", "Multiply Two Numbers (MUL AB)": "; 10 x 5 = 50 (16-bit result A=low, B=high)\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV A, #0AH         ; A = 10\n    MOV B, #05H          ; B = 5\n    MUL AB                 ; A = 32H (50 decimal, low byte)\n                            ; B = 00H (high byte, kyunki 50 < 256)\n    MOV P1, A               ; result P1 pe dikhao\n    SJMP $\nEND\n", "Divide Two Numbers (DIV AB)": "; 10 / 3 = Quotient 3, Remainder 1\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV A, #0AH         ; A = 10 (dividend)\n    MOV B, #03H          ; B = 3  (divisor)\n    DIV AB                 ; A = 03H (quotient), B = 01H (remainder)\n    MOV P1, A               ; quotient LED pe dikhao\n    SJMP $\nEND\n", "Timer1 Delay (Mode 2, Auto-Reload)": "; Timer1 Mode 2 se baar-baar same delay (auto-reload hota hai)\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV TMOD, #20H      ; Timer1, Mode 2 (8-bit auto-reload)\n    MOV TH1, #06H         ; reload value (delay control karta hai)\n    SETB TR1\nLOOP:\n    CPL P1.0               ; LED toggle\nWAIT:\n    JNB TF1, WAIT\n    CLR TF1                 ; sirf flag clear karo — TL1 khud\n                              ; TH1 se auto-reload ho jaayega!\n    SJMP LOOP\nEND\n", "Keypad Scan (rows P2.0-3, cols P2.4-7)": "; Simple keypad scan — jab bhi koi key dabegi, P1 LEDs pe\n; usका row-col pattern dikhega (basic detection, poori matrix\n; decode nahi, sirf \"koi key dabi\" wala idea)\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV P2, #0F0H       ; rows(P2.0-3)=0 output, cols(P2.4-7)=1 input\nLOOP:\n    MOV A, P2\n    ANL A, #0F0H        ; sirf column bits dekho\n    CJNE A, #0F0H, KEY_FOUND   ; agar koi column LOW hui -> key dabi\n    SJMP LOOP\n\nKEY_FOUND:\n    MOV P1, A            ; dabi hui key ka column-pattern LED pe dikhao\n    ACALL DELAY\n    SJMP LOOP\n\nDELAY:\n    MOV R0, #0FFH\nD1: MOV R1, #0FFH\nD2: DJNZ R1, D2\n    DJNZ R0, D1\n    RET\nEND\n", "External Interrupt INT0 (P3.2)": "; INT0 pin (P3.2) pe signal aate hi LED turant toggle ho\n; (polling ke bajaye interrupt-driven — fast response ke liye)\nORG 0000H\n    SJMP MAIN\nORG 0003H              ; INT0 ISR vector address\n    CPL P1.0\n    RETI\nORG 0030H\nMAIN:\n    SETB P3.2            ; INT0 pin ko input mode\n    MOV IE, #81H          ; EA=1, EX0=1 (external interrupt0 enable)\n    SETB IT0               ; edge-triggered (falling edge pe trigger)\n    SJMP $                  ; wait yahin — interrupt handle karega\nEND\n", "Serial Receive Character (UART RX)": "; Serial port se ek character receive karke usko P1 (LED) pe dikhana\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV TMOD, #20H     ; Timer1 Mode2 (auto-reload) baud rate ke liye\n    MOV TH1, #0FDH      ; 9600 baud @ 11.0592MHz\n    SETB TR1\n    MOV SCON, #50H      ; Serial Mode 1, REN=1 (receive enable)\nWAIT_RX:\n    JNB RI, WAIT_RX      ; RI=1 hone tak wait karo (data aa gaya)\n    MOV A, SBUF            ; receive buffer se data A mein lo\n    MOV P1, A                ; LED pe dikhao\n    CLR RI                    ; RI flag clear karo agla byte lene ke liye\n    SJMP WAIT_RX\nEND\n", "Motor ON/OFF via Switch": "; Switch (P3.0) dabao to Motor (P1.7) chalu ho jaaye\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    SETB P3.0            ; switch pin input mode ke liye HIGH\nLOOP:\n    MOV C, P3.0            ; switch state carry mein lo\n    CPL C                    ; switch active-low hai to invert karo\n    MOV P1.7, C                ; motor pin pe wahi state bhej do\n    SJMP LOOP\nEND\n", "Stack PUSH/POP Demo": "; Register value ko stack pe save karke wapas nikalna\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV SP, #60H       ; stack pointer ko safe area (60H) pe set karo\n    MOV A, #25H          ; A mein ek value do\n    PUSH ACC               ; A ki value stack pe save karo\n    MOV A, #00H              ; A ko change kar do (purani value bhula do)\n    POP ACC                    ; stack se wapas A mein le aao\n    MOV P1, A                    ; result LED pe dikhao (25H wapas aa gaya)\n    SJMP $\nEND\n", "Bit Test — JB/JNB Example": "; Ek particular bit check karke decision lena (JB/JNB)\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    SETB P3.1           ; switch pin input mode\nLOOP:\n    JB P3.1, SWITCH_OPEN   ; agar bit SET hai -> ek jagah jao\n    SETB P1.0                ; switch band (0) -> LED ON\n    SJMP LOOP\nSWITCH_OPEN:\n    CLR P1.0               ; switch open (1) -> LED OFF\n    SJMP LOOP\nEND\n", "7-Segment Countdown 9 to 0": "; 9 se 0 tak countdown, 7-seg display pe (common cathode)\nORG 0000H\n    SJMP MAIN\nORG 0030H\nMAIN:\n    MOV R0, #09H\nLOOP:\n    MOV A, R0\n    MOV DPTR, #SEGTABLE\n    MOVC A, @A+DPTR\n    MOV P1, A\n    ACALL DELAY\n    CJNE R0, #00H, SKIP\n    MOV R0, #0AH          ; wapas 9 se shuru (0AH -> DEC se 9 ban jaayega)\nSKIP:\n    DEC R0\n    SJMP LOOP\n\nSEGTABLE:\n    DB 3FH, 06H, 5BH, 4FH, 66H   ; 0,1,2,3,4\n    DB 6DH, 7DH, 07H, 7FH, 6FH  ; 5,6,7,8,9\n\nDELAY:\n    MOV R1, #0FFH\nD1: MOV R2, #0FFH\nD2: DJNZ R2, D2\n    DJNZ R1, D1\n    RET\nEND\n"};

<script>
/* ==== kb ==== */
const CM_KB_TXT="@@ what | Basics | 8051 kya hai? | 8051 kya hai, what is 8051, 8051 introduction, intro, microcontroller kya hai, mcs-51, intel 8051, about 8051, 8051 history, 8051 ke baare mein\n## 8051 kya hai?\n**8051** ek **8-bit microcontroller** hai jo **Intel ne 1980** mein banaya (MCS-51 family). \"Computer on a chip\" kehte hain kyunki ek hi chip mein CPU + RAM + ROM + I/O ports + Timers + Serial port sab hota hai.\n\n**Original 8051 ki main features:**\n- 8-bit CPU, 8-bit data bus, 16-bit address bus (64KB code + 64KB data)\n- **4KB** on-chip ROM (code) aur **128 bytes** on-chip RAM\n- **4 ports** (P0–P3) = **32 I/O pins**\n- **2 Timers/Counters** (T0, T1) — 16-bit\n- **1 full-duplex UART** (serial port)\n- **5 interrupts** (2 external, 2 timer, 1 serial), 2 priority levels\n- Boolean (bit) processor — individual bits ko SET/CLR/test kar sakte ho\n- On-chip oscillator, 12 clock = 1 machine cycle\n- 40-pin DIP package, +5V supply\n\nAaj bhi colleges mein sabse zyada padhaya jata hai (AT89C51/AT89S52 chips). Isse aage poochho: *architecture*, *pins*, *memory*, *timers*, *interrupts*, *serial* — kuch bhi!\n>> rel: features, arch, pins, micro-vs-proc\n\n@@ features | Basics | 8051 ki features (list) | features of 8051, 8051 ki features, 8051 features, specifications, specs, 8051 kitna ram rom, 8051 ke bare me sab\n## 8051 ki Features\n| Feature | Value |\n|---|---|\n| CPU | 8-bit |\n| On-chip ROM | 4KB (8052: 8KB) |\n| On-chip RAM | 128 bytes (8052: 256 bytes) |\n| I/O pins | 32 (P0–P3) |\n| Timers | 2 × 16-bit (8052: 3) |\n| Serial | 1 UART (full duplex) |\n| Interrupts | 5 sources (8052: 6) |\n| External memory | 64KB code + 64KB data |\n| Oscillator | on-chip (crystal 1–24 MHz, commonly 11.0592 MHz) |\n| Package | 40-pin DIP |\n| Supply | +5V |\n| Architecture | Harvard (code aur data memory alag), CISC |\n\nExtra: bit-addressable RAM (128 bits), 4 register banks, hardware multiply/divide (MUL AB, DIV AB), 255 instructions-ish (111 opcodes).\n>> rel: what, memory, harvard\n\n@@ arch | Architecture | 8051 Architecture / Block diagram | architecture, 8051 architecture, block diagram, internal structure, 8051 ka architecture, functional blocks, internal blocks\n## 8051 Architecture (Block Diagram ke blocks)\n- **CPU** — ALU, Accumulator (A), B register, PSW, SP, DPTR, PC, instruction register, decoder, timing & control\n- **ROM (4KB)** — program/code memory\n- **RAM (128B)** — register banks, bit-area, scratch pad, stack\n- **SFR area** — peripherals ke control registers (80H–FFH)\n- **4 I/O ports** — P0, P1, P2, P3 (latch + driver + pull-up)\n- **2 Timers/Counters** — Timer0, Timer1\n- **Serial port (UART)** — SBUF, SCON\n- **Interrupt control** — IE, IP, TCON\n- **Oscillator + clock circuit** — XTAL1/XTAL2\n- **Bus control** — ALE, PSEN, EA (external memory ke liye)\n\nData flow: ROM → instruction register → decoder → ALU ↔ Accumulator ↔ ports/RAM. **Harvard architecture**: code aur data ke alag address space (isliye MOVC aur MOVX alag hain).\n>> rel: memory, sfr, harvard, pins\n\n@@ pins | Hardware | 8051 Pin Diagram (40 pins) | pin diagram, pin description, 8051 pins, pins of 8051, pin configuration, 40 pin, dip, pin number, kaun si pin kya karti hai\n## 8051 Pin Diagram (40-pin DIP)\n| Pin | Name | Kaam |\n|---|---|---|\n| 1–8 | P1.0–P1.7 | Port 1 (general I/O). P1.0=T2, P1.1=T2EX (8052) |\n| 9 | RST | Reset (High ≥ 2 machine cycles) |\n| 10 | P3.0 / RXD | Serial receive |\n| 11 | P3.1 / TXD | Serial transmit |\n| 12 | P3.2 / INT0 | External interrupt 0 |\n| 13 | P3.3 / INT1 | External interrupt 1 |\n| 14 | P3.4 / T0 | Timer0 external input |\n| 15 | P3.5 / T1 | Timer1 external input |\n| 16 | P3.6 / WR | External data memory write |\n| 17 | P3.7 / RD | External data memory read |\n| 18, 19 | XTAL2, XTAL1 | Crystal connection |\n| 20 | GND | Ground (0V) |\n| 21–28 | P2.0–P2.7 | Port 2 / A8–A15 (high address) |\n| 29 | PSEN | External program memory read enable |\n| 30 | ALE/PROG | Address Latch Enable |\n| 31 | EA/VPP | External Access (1 = internal ROM, 0 = external) |\n| 32–39 | P0.7–P0.0 | Port 0 / AD7–AD0 (multiplexed address/data) |\n| 40 | VCC | +5V supply |\n\nYaad rakhne ka trick: **pin 20 = GND, pin 40 = VCC**, Port 1 upar-left (1–8), Port 0 niche-right ulte order mein (39→32).\n>> rel: ports, port3, ea-psen-ale, reset\n\n@@ ports | Hardware | Ports P0, P1, P2, P3 | port 0, port 1, port 2, port 3, ports of 8051, i/o ports, p0 p1 p2 p3, port kya hota hai, quasi bidirectional, pull up, open drain, port structure, port, io ports, i/o port\n## 8051 ke 4 Ports\n| Port | Pins | Special kaam |\n|---|---|---|\n| **P0** | 32–39 | **Open-drain** (internal pull-up nahi!) — LED/switch ke liye **external 10K pull-up** lagao. External memory mein AD0–AD7 |\n| **P1** | 1–8 | Pure I/O, internal pull-up. Sabse simple port |\n| **P2** | 21–28 | I/O, external memory mein A8–A15 |\n| **P3** | 10–17 | I/O + alternate functions (RXD, TXD, INT0, INT1, T0, T1, WR, RD) |\n\n**Quasi-bidirectional**: P1, P2, P3 ko **input** banane ke liye pehle us pin pe **1 likhna** padta hai (`SETB P1.0` ya `MOV P1,#0FFH`). Reset ke baad saare ports FFH hote hain, to input ready hi hote hain.\n\n**Drive capability:** pin ground ko *sink* achha karti hai (~10 mA AT89C51) lekin *source* kamzor karti hai (internal pull-up ~50–100 µA). Isliye LED ko **VCC se pin tak** (pin LOW = LED ON, active-low) lagana better rehta hai.\n\nPort ko ek saath likho: `MOV P1,#0AAH` | ek bit: `SETB P1.3` / `CLR P1.3` | padhna: `MOV A,P1` ya `JB P1.0,label`.\n>> rel: port3, pins, led-interface\n\n@@ port3 | Hardware | Port 3 ke Alternate Functions | port 3 alternate function, p3 alternate, rxd txd int0 int1, p3.0 p3.1 p3.2, port3 special functions, alternate function\n## Port 3 — Alternate Functions\n| Pin | Name | Function |\n|---|---|---|\n| P3.0 | RXD | Serial data receive |\n| P3.1 | TXD | Serial data transmit |\n| P3.2 | INT0 | External interrupt 0 |\n| P3.3 | INT1 | External interrupt 1 |\n| P3.4 | T0 | Timer0 external clock/count input |\n| P3.5 | T1 | Timer1 external clock/count input |\n| P3.6 | WR | External RAM write strobe |\n| P3.7 | RD | External RAM read strobe |\n\n⚠️ Agar UART use kar rahe ho to P3.0 aur P3.1 ko general I/O ki tarah use mat karo. Isi tarah INT0/INT1 chahiye to P3.2/P3.3 free rakho.\n>> rel: ports, serial, ext-int\n\n@@ memory | Memory | Memory Organization (RAM/ROM map) | memory organization, memory map, internal ram, ram map, 128 bytes, code memory, data memory, 8051 memory, memory structure, scratch pad, internal memory, external memory, memory, ram, rom, ram rom\n## 8051 Memory Organization\n8051 mein **Harvard architecture** hai: Code aur Data memory alag.\n\n**1. Code (Program) memory** — 0000H–0FFFH (4KB internal), max 64KB. Read-only. Access: `MOVC A,@A+DPTR`.\n\n**2. Internal Data RAM (128B) — 00H–7FH**\n| Address | Use |\n|---|---|\n| 00H–1FH | 4 Register Banks (R0–R7 each) |\n| 20H–2FH | **Bit-addressable** (128 bits = bit addr 00H–7FH) |\n| 30H–7FH | General purpose scratch pad (+ stack) |\n\n**3. SFR area — 80H–FFH** (sirf kuch addresses valid, direct addressing se)\n\n**4. External Data memory (XDATA)** — 0000H–FFFFH (64KB), `MOVX`. \n\n8052 mein 80H–FFH ki **upper 128B RAM** bhi hoti hai (indirect addressing `@R0` se; SFR se alag).\n>> rel: regbank, bitaddr, sfr, stack\n\n@@ regbank | Memory | Register Banks (R0–R7) | register bank, register banks, r0 r7, rs0 rs1, bank select, working registers, bank 0 1 2 3\n## Register Banks\n00H–1FH ke 32 bytes = **4 banks × 8 registers (R0–R7)**.\n| RS1 | RS0 | Bank | Address |\n|---|---|---|---|\n| 0 | 0 | 0 | 00H–07H |\n| 0 | 1 | 1 | 08H–0FH |\n| 1 | 0 | 2 | 10H–17H |\n| 1 | 1 | 3 | 18H–1FH |\n\nRS1/RS0 **PSW** (D4, D3) ke bits hain. Reset ke baad Bank 0 active. Bank badalna:\n```\nSETB PSW.3   ; RS0=1\nCLR  PSW.4   ; RS1=0  -> Bank 1\nMOV R0,#55H  ; ab ye address 08H me jaayega\n```\nFaida: ISR ya subroutine ke liye alag bank use karo to registers save/restore nahi karne padte.\n**Dhyan:** Stack ka default SP=07H hai, jo Bank 1 se takraa sakta hai — zaroorat ho to `MOV SP,#30H`.\n>> rel: psw, stack, memory\n\n@@ bitaddr | Memory | Bit-addressable area | bit addressable, bit address, 20h 2fh, bit area, bit addressable ram, setb clr bit, boolean, bit processor\n## Bit-addressable RAM\n- RAM byte **20H–2FH** = 16 bytes × 8 = **128 bits**, bit addresses **00H–7FH**.\n- Byte 20H ke bits: 00H–07H, byte 21H: 08H–0FH ... byte 2FH: 78H–7FH.\n- Likhne ke 2 tarike: `SETB 05H` ya `SETB 20H.5` (dono same).\n- **SFR bits:** wo SFR bit-addressable hain jinka address **8 ka multiple** hai: P0(80H), TCON(88H), P1(90H), SCON(98H), P2(A0H), IE(A8H), P3(B0H), IP(B8H), PSW(D0H), ACC(E0H), B(F0H). Jaise `SETB TR0` = `SETB 8CH`.\nInstructions: SETB, CLR, CPL, ANL C,bit, ORL C,bit, MOV C,bit, JB, JNB, JBC.\n>> rel: memory, sfr, instr-bit\n\n@@ sfr | Registers | SFR (Special Function Registers) table | sfr, special function register, sfr addresses, sfr table, tmod address, sbuf address, sfr list\n## SFR Table (80H–FFH)\n| SFR | Addr | Bit-addr? | Kaam |\n|---|---|---|---|\n| P0 | 80H | ✔ | Port 0 |\n| SP | 81H | | Stack Pointer |\n| DPL / DPH | 82H / 83H | | DPTR low / high |\n| PCON | 87H | | Power control (SMOD) |\n| TCON | 88H | ✔ | Timer control + ext int flags |\n| TMOD | 89H | | Timer mode |\n| TL0 / TL1 | 8AH / 8BH | | Timer low byte |\n| TH0 / TH1 | 8CH / 8DH | | Timer high byte |\n| P1 | 90H | ✔ | Port 1 |\n| SCON | 98H | ✔ | Serial control |\n| SBUF | 99H | | Serial data buffer |\n| P2 | A0H | ✔ | Port 2 |\n| IE | A8H | ✔ | Interrupt enable |\n| P3 | B0H | ✔ | Port 3 |\n| IP | B8H | ✔ | Interrupt priority |\n| PSW | D0H | ✔ | Program status word |\n| ACC (A) | E0H | ✔ | Accumulator |\n| B | F0H | ✔ | B register |\nBit-addressable wo jinke address 8 se divisible hain.\n>> rel: psw, tmod, tcon, scon, ie-ip\n\n@@ psw | Registers | PSW (Program Status Word) | psw, program status word, flags, carry flag, auxiliary carry, overflow flag, parity flag, cy ac ov p, flag register, d0h\n## PSW — Program Status Word (D0H, bit-addressable)\n| Bit | D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|---|\n| Flag | CY | AC | F0 | RS1 | RS0 | OV | — | P |\n\n- **CY (Carry)** — ADD/SUBB mein carry/borrow; rotate aur CJNE mein bhi use hota hai\n- **AC (Aux Carry)** — D3 se D4 ko carry (BCD/DA ke liye)\n- **F0** — user flag (software ke liye free)\n- **RS1, RS0** — register bank select\n- **OV (Overflow)** — signed arithmetic overflow; MUL mein result > 255 ho to OV=1, DIV mein divide-by-0 par OV=1\n- **P (Parity)** — Accumulator mein **1 ki ginti odd** ho to P=1 (even parity generator)\n\nExample: `MOV A,#0FFH` + `ADD A,#01H` → A=00H, CY=1, AC=1, P=0.\n>> rel: regbank, arith, sfr\n\n@@ acc-b | Registers | A, B, SP, DPTR, PC registers | accumulator, a register, b register, stack pointer, dptr, program counter, pc, data pointer, important registers, 8051 registers\n## Main Registers\n- **A (Accumulator, E0H)** — 8-bit; ALU ke zyadatar operations iske saath. Parity flag isi se bante hain.\n- **B (F0H)** — MUL AB / DIV AB mein use hota hai; baaki time general register.\n- **R0–R7** — working registers (active bank ke).\n- **SP (81H)** — Stack Pointer, 8-bit, reset par **07H**. PUSH par pehle SP++ phir store.\n- **DPTR** — 16-bit = DPH(83H) + DPL(82H); external/code memory address ke liye (`MOVX`, `MOVC`). Ek hi DPTR hota hai (8052 variants mein dual).\n- **PC** — 16-bit Program Counter, reset par **0000H**; agla instruction address rakhta hai. Programmer directly likh nahi sakta (JMP/CALL se badalta hai).\n>> rel: stack, psw, addr-modes\n\n@@ stack | Registers | Stack aur Stack Pointer | stack, stack pointer, push pop, sp register, stack kya hota hai, stack operation, call return stack, stack overflow, push pop kaise kaam karta hai\n## Stack\nStack internal RAM ka ek area hai jahan **return address** (CALL ke time) aur PUSH kiya data rakha jata hai. **LIFO**.\n\n- **SP** reset par **07H** → pehla PUSH address **08H** par store hoga (SP pehle increment hota hai, phir write).\n- `PUSH 30H` : SP = SP+1; [SP] = [30H]\n- `POP 30H`  : [30H] = [SP]; SP = SP−1\n- `ACALL/LCALL` : return address (PC) ke 2 bytes push hote hain (low byte pehle, phir high); `RET` unhe wapas pop karta hai.\n- Stack **upar ki taraf grow** karta hai (8051 mein).\n\n**Common bug:** SP=07H par Bank 1–3 ka data overwrite ho jata hai. Fix: `MOV SP,#60H` program ke start mein.\nHamesha PUSH/POP ka **balance** rakho (jitne push, utne pop, ulte order mein) warna RET galat jagah jayega.\n>> rel: regbank, call-ret, acc-b\n\n@@ reset | Hardware | Reset (RST pin aur reset ke baad ki values) | reset, rst pin, reset circuit, power on reset, reset ke baad, reset values, reset kaise karte hain, reset ke baad kya hota hai, register values after reset\n## Reset\n- **RST pin (9)** ko **HIGH** rakho kam se kam **2 machine cycles** (≈ 24 clock) → 8051 reset.\n- **Power-on reset circuit:** RST → 10µF capacitor → VCC, aur RST → 8.2K resistor → GND. Cap charge hone tak RST high rehta hai. Push-button se manual reset bhi lagate hain.\n\n**Reset ke baad register values:**\n| Register | Value |\n|---|---|\n| PC | 0000H |\n| ACC, B, PSW | 00H |\n| SP | 07H |\n| DPTR | 0000H |\n| P0–P3 | FFH |\n| IP, IE | 0xx00000B / 0xx00000B (sab interrupts disabled) |\n| TMOD, TCON, TH0/1, TL0/1 | 00H |\n| SCON | 00H |\n| SBUF | indeterminate |\n| PCON | 0xxx0000B |\nRAM ki contents **change nahi hoti** (power-on pe random).\nReset ke baad CPU **0000H** se execute karna shuru karta hai — isliye `ORG 0000H` ke baad `SJMP MAIN` rakhte hain taaki interrupt vectors (0003H...) ko skip kar sakein.\n>> rel: ea-psen-ale, osc-timing, stack\n\n@@ osc-timing | Hardware | Crystal, Machine Cycle aur Timing | crystal, oscillator, machine cycle, clock, 11.0592, 12 mhz crystal, 1.085, instruction cycle, state, t state, crystal frequency, kitna time lagta hai, xtal, capacitor 33pf, frequency, 8051 ki frequency, max frequency, clock speed, speed of 8051\n## Crystal / Oscillator / Machine Cycle\n- 8051 mein internal oscillator hai; **XTAL1 (19) aur XTAL2 (18)** ke beech crystal + do **30pF** capacitors (GND tak).\n- **1 Machine Cycle = 12 oscillator clock periods.**\n- Machine cycle time = 12 / fosc\n  - **11.0592 MHz** → 12/11.0592M = **1.085 µs**\n  - **12 MHz** → **1 µs**\n- Zyadatar instructions 1 ya 2 cycle; **MUL aur DIV = 4 cycles**.\n- Ek instruction ka time = cycles × machine-cycle time. Jaise `DJNZ` = 2 cycles = 2.17 µs @ 11.0592 MHz.\n\n**11.0592 MHz kyun?** Isse UART ka baud rate (9600, 4800, 2400 ...) **bilkul exact** milta hai (error 0%). 12 MHz par 9600 baud thoda galat aata hai (~7% error).\n>> rel: delay-loop, baud, timer-delay\n\n@@ ea-psen-ale | Hardware | EA, PSEN, ALE pins aur External Memory | ea pin, psen, ale, external memory interfacing, 74ls373, address latch, external rom, external ram, movx, ea kya hai, ale kya hai\n## EA, PSEN, ALE\n- **EA (31):** `EA = VCC` → internal ROM (0000–0FFF) se chalo, uske upar external. `EA = GND` → saara code external ROM se (8031 mein hamesha GND).\n- **PSEN (29):** External **program** memory ko read karne ka strobe (active low).\n- **ALE (30):** P0 par **low address byte** latch karne ka signal. P0 ek hi time par pehle address (A0–A7) phir data (D0–D7) deta hai (multiplexing). External **74LS373** latch ALE se address ko pakadta hai. ALE frequency = fosc/6.\n\nExternal RAM access: `MOVX A,@DPTR` / `MOVX @DPTR,A` — P2 = A8–A15, P0 = AD0–AD7, RD (P3.7)/WR (P3.6) pulses. External memory use karne par P0 aur P2 I/O ke liye available nahi rehte.\n>> rel: memory, pins, movx-movc\n\n@@ pcon | Registers | PCON aur Power Saving modes | pcon, power control, idle mode, power down mode, smod, power saving, low power, gf0 gf1\n## PCON (87H) — Power Control\n| Bit | D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|---|\n| | SMOD | – | – | – | GF1 | GF0 | PD | IDL |\n- **SMOD** = 1 → serial baud rate **double**\n- **IDL** = 1 → **Idle mode** (CPU band, peripherals + interrupts chalu; interrupt ya reset se wapas)\n- **PD** = 1 → **Power-down** (oscillator band, sirf RAM safe; sirf reset se nikalta hai)\n- GF0/GF1 → general purpose flags\nPCON bit-addressable **nahi** hai: `ORL PCON,#80H` se SMOD set karo.\n>> rel: baud, scon\n\n@@ tmod | Timers | TMOD register | tmod, tmod register, timer mode register, gate, c/t, m1 m0, tmod kya hai, tmod value, tmod set kaise kare, 89h\n## TMOD (89H) — Timer Mode Register (bit-addressable nahi)\n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n| GATE | C/T | M1 | M0 | GATE | C/T | M1 | M0 |\n| ← **Timer 1** | | | | ← **Timer 0** | | | |\n\n- **GATE**: 0 → software control (TRx se); 1 → TRx **aur** INTx pin high ho tabhi chalega\n- **C/T**: 0 → **Timer** (machine cycle count), 1 → **Counter** (T0/T1 pin pe pulses)\n- **M1 M0**: 00 = Mode 0 (13-bit), 01 = **Mode 1 (16-bit)**, 10 = **Mode 2 (8-bit auto-reload)**, 11 = Mode 3 (split)\n\n**Common values:** Timer0 Mode1 → `MOV TMOD,#01H` | Timer1 Mode2 → `MOV TMOD,#20H` | Dono Mode1 → `#11H` | T1 Mode2 + T0 Mode1 → `#21H`.\n>> rel: tcon, timer-modes, timer-delay\n\n@@ tcon | Timers | TCON register | tcon, timer control register, tr0 tr1, tf0 tf1, it0 it1, ie0 ie1, tcon kya hai, 88h, tcon bits\n## TCON (88H) — Timer Control (bit-addressable)\n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n| TF1 | TR1 | TF0 | TR0 | IE1 | IT1 | IE0 | IT0 |\n- **TF0/TF1** — Timer overflow flag (overflow par hardware 1 karta hai; ISR jaane par auto-clear; polling mein `CLR TF0` khud karo)\n- **TR0/TR1** — Timer Run: 1 = start, 0 = stop (`SETB TR0`)\n- **IE0/IE1** — External interrupt edge flag\n- **IT0/IT1** — Interrupt type: **1 = falling-edge triggered**, 0 = low-level triggered\n>> rel: tmod, timer-delay, ext-int\n\n@@ timer-modes | Timers | Timer Modes (0, 1, 2, 3) | timer modes, mode 0, mode 1, mode 2, mode 3, 13 bit timer, 16 bit timer, auto reload, split timer, timer mode kya hote hain, timers and counters, timer counter, t
