imer, timers, counter timer, timer kya hai\n## Timer / Counter Modes\n| Mode | Size | Kaam |\n|---|---|---|\n| **0** | 13-bit | TH (8 bit) + TL ke 5 bits. Purani compatibility, kam use |\n| **1** | **16-bit** | TH:TL, count 0000H–FFFFH. Sabse common (max delay ≈ 71 ms @ 11.0592MHz) |\n| **2** | **8-bit auto-reload** | TL count karta hai; overflow par TH se **auto reload**. Baud rate aur exact periodic delay ke liye best |\n| **3** | Split | Sirf Timer0: TL0 aur TH0 do alag 8-bit timers (TH0 ko TR1/TF1 control). Timer1 ko kuch nahi chahiye to baud generator ke liye chalta rahega |\n\n**Timer vs Counter:** Timer mode mein input = machine cycle (fosc/12). Counter mode (C/T=1) mein input = T0/T1 pin ke **falling edges**; max count frequency = fosc/24.\n\nTimer overflow tab hota hai jab FFFFH (mode 1) se 0000H hota hai → TF set.\n>> rel: tmod, timer-delay, counter\n\n@@ timer-delay | Timers | Timer se Delay kaise banate hain (calculation) | timer delay, delay using timer, timer0 delay, timer1 delay, delay calculation, timer value kaise nikale, th0 tl0 value, 50ms delay, 1 second delay, reload value, timer program, how to calculate timer value, timer0 kaise use karte hain, timer kaise use karein\n## Timer se Delay — Step by step (Mode 1, 11.0592 MHz)\n1. Machine cycle = **1.085 µs**\n2. Counts = Delay / 1.085 µs\n3. **Reload value = 65536 − Counts** → upper byte TH0, lower byte TL0\n\n**Example: 50 ms**: Counts = 50000/1.085 ≈ 46080 → 65536−46080 = **19456 = 4C00H** → TH0=4CH, TL0=00H.\n\n```\nORG 0000H\n    MOV TMOD,#01H      ; Timer0 mode 1\nAGAIN:\n    MOV TH0,#4CH       ; 50 ms\n    MOV TL0,#00H\n    SETB TR0           ; start\nWAIT:\n    JNB TF0,WAIT       ; overflow ka wait\n    CLR TR0            ; stop\n    CLR TF0            ; flag clear (polling mein zaroori!)\n    CPL P1.0           ; toggle LED\n    SJMP AGAIN\nEND\n```\n**Lamba delay:** max ≈ 71 ms hai, isliye 1 second ke liye 50 ms ko **20 baar** loop mein chalao (`MOV R5,#20`).\nMujhe bolo \"**500 ms delay timer0**\" ya \"**1 sec delay**\" — main exact TH/TL calculate kar dungi.\n>> rel: tmod, tcon, timer-modes, delay-loop\n\n@@ counter | Timers | Counter mode (pulses count karna) | counter mode, count pulses, external pulse counting, frequency counter, t0 pin, event counter, ct bit\n## Counter Mode\n`C/T = 1` → timer ka clock external pin se aata hai (T0 = P3.4, T1 = P3.5). Har **high-to-low transition** par count +1.\n```\nMOV TMOD,#05H   ; Timer0, counter, mode 1\nMOV TH0,#0\nMOV TL0,#0\nSETB TR0        ; counting chalu\n; ... baad me TH0:TL0 padho = total pulses\n```\nMax input frequency = fosc/24 (11.0592 MHz → ~460 kHz). Frequency meter banana ho to 1 second ka gate bana ke us dauran count karo (ya Timer1 se 1s delay).\n>> rel: timer-modes, tmod\n\n@@ interrupts | Interrupts | Interrupts (vector table, kaise kaam karte hain) | interrupt, interrupts, interrupt kya hota hai, interrupt kaise kaam karta hai, interrupt vector, vector table, interrupt service routine, isr, interrupt address, 0003h, 000bh, interrupt sources, interrupt types, interrupt handling, interrupt, interrupt vector address, vector address, timer0 vector, int0 vector, interrupt address\n## 8051 Interrupts\nInterrupt = hardware/event ka signal jo CPU ko current kaam rokkar **ISR (Interrupt Service Routine)** chalane par majboor karta hai. Phir `RETI` se wapas.\n\n**5 sources + vector addresses:**\n| Interrupt | Flag | Vector | Natural priority |\n|---|---|---|---|\n| Reset | — | 0000H | — |\n| External INT0 (P3.2) | IE0 | **0003H** | 1 (highest) |\n| Timer 0 overflow | TF0 | **000BH** | 2 |\n| External INT1 (P3.3) | IE1 | **0013H** | 3 |\n| Timer 1 overflow | TF1 | **001BH** | 4 |\n| Serial (RI/TI) | RI, TI | **0023H** | 5 |\n(8052: Timer2 → 002BH)\n\n**Steps jab interrupt aata hai:** current instruction khatam → PC stack me push → vector par jump → ISR → `RETI` → PC pop → main program continue.\n\n**Enable karna:** `SETB EA` (global) + us source ka bit (`SETB ET0` etc.).\nVector gap sirf 8 bytes ka hai, isliye vahan `LJMP ISR` likhte hain.\n>> rel: ie-ip, isr-example, ext-int, reti\n\n@@ ie-ip | Interrupts | IE aur IP registers | ie register, ip register, interrupt enable, interrupt priority, ea bit, ex0 et0 ex1 et1 es, priority set, a8h, b8h, ie kya hai, ip kya hai, interrupt priority kaise set kare\n## IE (A8H) — Interrupt Enable\n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n| **EA** | – | ET2 | **ES** | **ET1** | **EX1** | **ET0** | **EX0** |\n- EA = 1 → global enable (0 = sab band)\n- Example Timer0 interrupt: `MOV IE,#82H` (EA=1, ET0=1) ya `SETB EA / SETB ET0`\n- Serial + Timer1: `MOV IE,#98H`\n\n## IP (B8H) — Interrupt Priority\n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n| – | – | PT2 | **PS** | **PT1** | **PX1** | **PT0** | **PX0** |\n1 = **high priority**. High-priority interrupt low-priority ISR ko beech mein rok sakta hai; same level par natural order (INT0 > T0 > INT1 > T1 > Serial) chalta hai. Reset par sab 0 (low).\n>> rel: interrupts, isr-example\n\n@@ isr-example | Interrupts | Timer Interrupt ISR example code | isr example, timer interrupt program, interrupt program, timer0 interrupt, isr code, interrupt ka code, interrupt program example\n## Timer0 Interrupt Example (P1.0 toggle)\n```\nORG 0000H\n    LJMP MAIN\nORG 000BH            ; Timer0 vector\n    LJMP T0_ISR\nORG 0030H\nMAIN:\n    MOV TMOD,#01H    ; T0 mode1\n    MOV TH0,#4CH     ; 50ms\n    MOV TL0,#00H\n    MOV IE,#82H      ; EA=1, ET0=1\n    SETB TR0\nHERE: SJMP HERE      ; main loop (kuch bhi kaam)\nT0_ISR:\n    CLR TR0\n    MOV TH0,#4CH     ; timer reload (mode1 me manual!)\n    MOV TL0,#00H\n    CPL P1.0\n    SETB TR0\n    RETI\nEND\n```\nRules: ISR mein `RETI` use karo (`RET` nahi). Jo registers (A, PSW, R0...) ISR badalti hai unhe PUSH/POP karo ya alag register bank lo. TF0 ko hardware khud clear karta hai.\n>> rel: interrupts, reti, timer-delay\n\n@@ reti | Interrupts | RET vs RETI | ret vs reti, reti kya hai, difference between ret and reti, reti aur ret mein antar, reti instruction\n## RET vs RETI\nDono stack se return address (PC) pop karte hain, lekin:\n- **RET** — sirf subroutine se wapas\n- **RETI** — **interrupt controller ko batata hai ki ISR complete** (priority-level logic clear karta hai) + PC pop\n\nAgar ISR mein `RET` likh diya to CPU samajhta rahega ki interrupt abhi chal raha hai aur **same ya kam priority ke naye interrupts block** ho jaayenge. Isliye ISR mein hamesha **RETI**.\n>> rel: interrupts, call-ret\n\n@@ ext-int | Interrupts | External Interrupts INT0 / INT1 | external interrupt, int0, int1, ex0, ex1, it0, edge triggered, level triggered, switch interrupt, push button interrupt, external interrupt program\n## External Interrupts (INT0 = P3.2, INT1 = P3.3)\n- **IT0/IT1 = 0** → **low-level** triggered (pin low rahe jab tak interrupt chalta rahega — ISR ke baad bhi low ho to dobara aayega)\n- **IT0/IT1 = 1** → **falling-edge** triggered (1→0 transition pe ek baar; yahi common hai)\n- Enable: `SETB EX0`, `SETB EA`; edge ke liye `SETB IT0`.\n```\nORG 0000H\n    LJMP MAIN\nORG 0003H\n    LJMP EX0_ISR\nORG 0030H\nMAIN: SETB IT0        ; falling edge\n      MOV IE,#81H     ; EA, EX0\nHERE: SJMP HERE\nEX0_ISR: CPL P1.0\n      RETI\nEND\n```\nSwitch ke saath **debounce** ka dhyan rakho (hardware RC ya software delay).\nSimulator mein: Devices window me **Push Button** ko P3.2 se jodo.\n>> rel: interrupts, ie-ip, switch-interface\n\n@@ scon | Serial | SCON register aur Serial modes | scon, serial control register, sm0 sm1, ren, ti ri, serial modes, uart modes, mode 0 1 2 3 serial, tb8 rb8, sbuf, 98h, serial, uart, serial port, serial communication kya hai\n## SCON (98H) — Serial Control (bit-addressable)\n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n| SM0 | SM1 | SM2 | **REN** | TB8 | RB8 | **TI** | **RI** |\n| Mode | SM0 SM1 | Description | Baud |\n|---|---|---|---|\n| 0 | 00 | Shift register (8-bit) | fosc/12 |\n| **1** | **01** | **8-bit UART** (start+8 data+stop = 10 bit) | **variable (Timer1)** |\n| 2 | 10 | 9-bit UART | fosc/32 ya /64 |\n| 3 | 11 | 9-bit UART | variable (Timer1) |\n- **REN** = 1 → receive enable\n- **TI** = TX complete flag (software `CLR TI`)\n- **RI** = RX complete flag (`CLR RI`)\n**Mode 1, REN=1:** `MOV SCON,#50H`.  Sirf transmit: `#40H`.\n>> rel: baud, serial-tx, serial-rx\n\n@@ baud | Serial | Baud Rate calculation (TH1 values) | baud rate, baud rate kaise nikale, th1 value, 9600 baud, 4800 baud, 2400 baud, 19200 baud, smod, baud rate calculation, uart baud, th1 for 9600, baud rate generator\n## Baud Rate (Mode 1, Timer1 Mode 2 auto-reload)\n**Baud = (2^SMOD / 32) × (fosc / 12) / (256 − TH1)**\n\nValues @ **11.0592 MHz:**\n| Baud | TH1 (SMOD=0) | TH1 (SMOD=1) |\n|---|---|---|\n| 1200 | **E8H** (−24) | D0H |\n| 2400 | **F4H** (−12) | E8H |\n| 4800 | **FAH** (−6) | F4H |\n| **9600** | **FDH** (−3) | FAH |\n| 19200 | — | **FDH** (−3) |\nSetup:\n```\nMOV TMOD,#20H   ; Timer1 mode2\nMOV TH1,#0FDH   ; 9600 baud\nMOV SCON,#50H   ; mode1, REN=1\nSETB TR1        ; timer start (zaroori!)\n```\n`TR1` na set karo to UART kuch nahi bhejega. 19200 ke liye `ORL PCON,#80H` (SMOD=1) aur TH1=FDH.\nMujhe \"baud 4800\" ya \"2400 baud ka th1\" likho, main aapke liye calculate kar dungi.\n>> rel: scon, serial-tx, serial-rx\n\n@@ serial-tx | Serial | Serial Transmit program | serial transmit, uart send, send character serial, data transmit, serial program, transmit program, serial communication program, uart transmit code, serial data bhejna, string send\n## Serial Transmit (9600 baud, 8-N-1)\n```\nORG 0000H\n    MOV TMOD,#20H\n    MOV TH1,#0FDH\n    MOV SCON,#50H\n    SETB TR1\nAGAIN:\n    MOV A,#'A'\n    ACALL SEND\n    SJMP AGAIN\nSEND:\n    MOV SBUF,A        ; data likhte hi transmission shuru\nWAIT: JNB TI,WAIT     ; frame complete hone tak ruko\n    CLR TI            ; TI software se clear karo\n    RET\nEND\n```\nString bhejne ke liye `DB 'HELLO',0` table + `MOVC A,@A+DPTR` loop.\nSimulator me **UART waveform window** kholo — TXD (P3.1) ki waveform dikhegi.\n>> rel: baud, scon, serial-rx\n\n@@ serial-rx | Serial | Serial Receive program | serial receive, uart receive, receive character, rx program, data receive, serial read, rxd, receive code, uart receive code, serial data lena\n## Serial Receive (polling)\n```\n    MOV TMOD,#20H\n    MOV TH1,#0FDH\n    MOV SCON,#50H     ; REN=1 zaroori\n    SETB TR1\nHERE:\n    JNB RI,HERE       ; byte aane ka wait\n    MOV A,SBUF        ; data padho\n    CLR RI            ; RI clear karo\n    MOV P1,A          ; P1 pe dikhao\n    SJMP HERE\n```\nSimulator mein: UART window ka **Inject** button / RX box se byte bhejo (REN=1 hona chahiye).\nSerial **interrupt** use karoge to ISR mein check karo RI ya TI, aur dono flags **software** se clear karne padte hain.\n>> rel: scon, baud, serial-tx\n\n@@ micro-vs-proc | Comparison | Microprocessor vs Microcontroller | microprocessor vs microcontroller, microprocessor microcontroller difference, farak, antar, microcontroller aur microprocessor mein kya difference hai\n## Microprocessor vs Microcontroller\n| Point | Microprocessor | Microcontroller |\n|---|---|---|\n| Chip mein | sirf CPU | CPU + RAM + ROM + I/O + Timer + UART |\n| External parts | RAM, ROM, I/O chips lagte hain | Lagbhag nahi |\n| Cost / size / power | zyada | kam |\n| Use | Computers, general purpose | Embedded: washing machine, remote, toy |\n| Speed | bahut tez (GHz) | kam (MHz) |\n| Bit manipulation | kam | zyada (bit-addressable) |\n| Example | 8085, 8086, Pentium | 8051, PIC16F, AVR |\n>> rel: what, harvard\n\n@@ harvard | Comparison | Harvard vs Von Neumann, RISC vs CISC | harvard architecture, von neumann, risc cisc, risc vs cisc, harvard vs von neumann, 8051 harvard hai ya von neumann\n## Harvard vs Von Neumann\n- **Von Neumann:** code aur data **ek hi memory + ek hi bus** (8085, 8086).\n- **Harvard:** code aur data **alag memory, alag address space** (8051, PIC, AVR) → ek saath fetch + data access, tez.\n**8051 Harvard** hai: code memory (MOVC) aur data memory (MOV/MOVX) alag.\n\n## RISC vs CISC\n**CISC** (8051): bahut saare instructions, alag-alag cycle lengths, variable instruction length (1–3 bytes). **RISC** (AVR, ARM, PIC): kam, simple, zyadatar 1 cycle instructions. 8051 **CISC** hai.\n>> rel: arch, memory\n\n@@ variants | Comparison | 8051 family: 8031, 8751, 89C51, 8052 | 8031, 8751, 89c51, 89s51, 89s52, 8052, 8051 family, 8051 variants, difference between 8051 and 8052, 8051 vs 8052, 8031 vs 8051, at89c51, at89s52, 8051 aur 8052 me kya antar\n## 8051 Family\n| Chip | ROM | RAM | Timers | Note |\n|---|---|---|---|---|\n| **8031** | none | 128B | 2 | External ROM zaroori |\n| **8051** | 4KB mask ROM | 128B | 2 | Original |\n| **8751** | 4KB **EPROM** | 128B | 2 | UV erase |\n| **AT89C51** | 4KB **Flash** | 128B | 2 | Electrically erasable, popular |\n| **AT89S51** | 4KB Flash, **ISP** | 128B | 2 | In-system programming |\n| **8052 / AT89C52 / S52** | **8KB** | **256B** | **3** (Timer2) | 6 interrupts |\n| **P89V51RD2** | 64KB | 1KB | 3 | Philips |\n8052 ki extra: Timer2 (16-bit, capture/auto-reload), upper 128B RAM, 8KB ROM, extra interrupt (TF2, vector 002BH).\n>> rel: features, what\n\n@@ mcu-compare | Comparison | 8051 vs PIC vs AVR vs ARM | 8051 vs avr, 8051 vs pic, 8051 vs arm, pic avr comparison, kaun sa microcontroller achha hai, 8051 outdated hai, 8051 vs 8086\n## 8051 vs PIC vs AVR vs ARM\n| | 8051 | PIC16 | AVR (Arduino) | ARM Cortex-M |\n|---|---|---|---|---|\n| Bits | 8 | 8 | 8 | 32 |\n| Clock/cycle | 12 clk/cycle (classic) | 4 | 1 | 1 |\n| Architecture | CISC, Harvard | RISC | RISC | RISC |\n| ADC/PWM on-chip | nahi (classic) | haan | haan | haan |\n| Learning | sabse easy theory | medium | easy (Arduino) | advanced |\n| Use | colleges, legacy | industry | hobby | industry |\n8051 classic mein ADC/PWM/EEPROM nahi, isliye ADC0804 jaise external chips use karte hain. Concept sikhne ke liye abhi bhi best.\n>> rel: what, variants\n\n@@ addr-modes | Programming | Addressing Modes | addressing modes, addressing mode, immediate direct indirect, register addressing, indexed addressing, 8051 addressing modes, addressing mode kya hai, kitne addressing modes, addressing\n## 8051 ke 5 Addressing Modes\n| Mode | Syntax | Example | Matlab |\n|---|---|---|---|\n| **Immediate** | `#data` | `MOV A,#25H` | Data seedha instruction mein |\n| **Register** | R0–R7, A, B | `MOV A,R3` | Register se |\n| **Direct** | address | `MOV A,30H` / `MOV P1,A` | RAM/SFR address seedha |\n| **Register Indirect** | `@R0`, `@R1`, `@DPTR` | `MOV A,@R0` | Register mein **address** hai |\n| **Indexed** | `@A+DPTR`, `@A+PC` | `MOVC A,@A+DPTR` | Lookup table (code memory) |\n(+ Implied: `CLR C`, `RL A`; Bit-direct: `SETB P1.0`).\n**Dhyan:** `MOV A,#30H` = value 30H load; `MOV A,30H` = address 30H ka content load.\nIndirect sirf **R0, R1** se internal RAM ke liye; DPTR external/code memory ke liye.\n>> rel: instr-data, movx-movc, acc-b\n\n@@ directives | Programming | Assembler Directives (ORG, EQU, DB...) | directive, directives, org, end, equ, db, dw, assembler directive, bit directive, data directive, define byte, org kya hota hai, equ kya hai, db kya hota hai\n## Assembler Directives\nYe CPU instructions nahi, **assembler ko instructions** hain:\n| Directive | Kaam | Example |\n|---|---|---|\n| `ORG addr` | Code kis address se shuru ho | `ORG 0000H` |\n| `END` | Program ka end | `END` |\n| `EQU` | Constant naam do | `LED EQU P1.0` / `COUNT EQU 50` |\n| `DB` | Define Byte (data table) | `DB 3FH,06H,5BH` / `DB 'HELLO',0` |\n| `DW` | Define Word (16-bit) | `DW 1234H` |\n| `BIT` | Bit variable | `FLAG BIT 20H.0` |\n| `$` | current address | `SJMP $` (infinite loop) |\n**Simulator ke assembler me:** `ORG, END, EQU, BIT, DB, DW` chalte hain. `TEMP DATA 30H` aur `HIGH/LOW` operators **support nahi** — variable naam ke liye `TEMP EQU 30H` likho. (Real Keil/ASEM me DATA, DS, SEGMENT bhi hote hain.)\nNumber formats: Hex `25H` (A–F se shuru ho to `0FFH`), Binary `1010B`, Decimal `25`, ASCII `'A'`.\n>> rel: asm-basics, program-structure\n\n@@ asm-basics | Programming | Assembly Programming Basics / Program structure | assembly programming, program structure, assembly kaise likhte hain, assembly language basics, first program, program kaise likhe, label, comment, assembly syntax, program format\n## Assembly Program ka Structure\n```\n; comment semicolon se\nORG 0000H           ; program yahan se shuru\n    SJMP MAIN       ; vectors (0003H..) skip karo\nORG 0030H\nMAIN:               ; label: colon ke saath\n    MOV P1,#00H     ; instruction  operand,operand\nLOOP:\n    CPL P1.0\n    ACALL DELAY\n    SJMP LOOP\nDELAY: ...\n    RET\nEND\n```\nFormat: `[LABEL:]  MNEMONIC  destination, source  [; comment]`.\n**Hamesha yaad rakho:** program ke end me `SJMP $` / loop rakho, warna CPU memory me aage ke kachre ko execute karta rahega. `ORG 0000H` ke baad `SJMP MAIN` rakho jab interrupts use ho.\nDestination **pehle**, source **baad** me: `MOV A,B` = B ko A mein copy.\n>> rel: directives, delay-loop\n\n@@ delay-loop | Programming | Software Delay Loop (DJNZ) calculation | delay loop, software delay, djnz delay, delay program, delay subroutine, delay kaise banate hain, delay calculate, 1 ms delay, 1 second delay loop, nested loop delay, delay code, delay\n## DJNZ se Delay\n`DJNZ Rn,label` = **2 machine cycles**. @11.0592 MHz → 1 cycle = 1.085 µs.\n\n**Single loop:**\n```\nMOV R7,#250\nDJNZ R7,$     ; 250 × 2 = 500 cycle ≈ 542 µs\n```\n**Nested loop (~ms):**\n```\nDELAY:\n    MOV R6,#2        ; outer\nD1: MOV R7,#250      ; inner\nD2: DJNZ R7,D2       ; 500 cyc\n    DJNZ R6,D1\n    RET\n```\nCycles ≈ R6 × (R7×2 + 3) + 3 (call/ret) → time = cycles × 1.085 µs.\nFormula: **Delay ≈ R6 × R7 × 2 × 1.085 µs** (approx).\nAur bada delay: teen nested loop (R5, R6, R7) — ya Timer use karo (zyada accurate). Mujhe likho \"**100 ms delay loop**\" aur main R6/R7 values nikal dungi.\n>> rel: timer-delay, osc-timing\n\n@@ movx-movc | Programming | MOV vs MOVC vs MOVX | mov movc movx difference, movc kya hai, movx kya hai, mov vs movc, movc and movx, external memory instruction, lookup table, movc a,@a+dptr, code memory read\n## MOV vs MOVC vs MOVX\n| Instruction | Kisse access | Direction | Example |\n|---|---|---|---|\n| **MOV** | **Internal RAM / SFR / registers** | read/write | `MOV A,30H` |\n| **MOVC** | **Code (ROM) memory** | **sirf read** | `MOVC A,@A+DPTR` / `@A+PC` |\n| **MOVX** | **External data RAM** (XDATA) | read/write | `MOVX A,@DPTR`, `MOVX @R0,A` |\nKyun alag? 8051 Harvard hai — 3 address spaces.\n\n**Lookup table example (7-seg):**\n```\n    MOV DPTR,#TABLE\n    MOV A,#5\n    MOVC A,@A+DPTR    ; A = 6DH\n    MOV P1,A\nTABLE: DB 3FH,06H,5BH,4FH,66H,6DH,7DH,07H,7FH,6FH\n```\n>> rel: addr-modes, memory, seven-seg\n\n@@ call-ret | Programming | CALL, RET, Subroutines | acall lcall, call kya hai, subroutine, ret instruction, call and return, acall vs lcall, ajmp ljmp sjmp, jump range, sjmp ajmp ljmp difference, long jump short jump\n## Jumps aur Calls\n| Instruction | Range | Size |\n|---|---|---|\n| `SJMP rel` | −128 … +127 bytes | 2 B |\n| `AJMP addr11` | same 2KB page | 2 B |\n| `LJMP addr16` | poori 64KB | 3 B |\n| `ACALL addr11` | 2KB page | 2 B |\n| `LCALL addr16` | 64KB | 3 B |\n| `JMP @A+DPTR` | computed jump | 1 B |\nConditional jumps (JZ, JNZ, JC, JNC, JB, JNB, DJNZ, CJNE) sab **relative** (−128..+127). Door jump chahiye to `JNZ HERE / LJMP FAR / HERE:` trick.\nCALL: return address stack me push → subroutine → `RET` se pop. Subroutine ke andar PUSH/POP balance rakho.\n>> rel: stack, instr-jump\n\n@@ arith | Instructions | Arithmetic instructions (ADD, SUBB, MUL, DIV, DA) | arithmetic instructions, add addc subb, mul ab, div ab, da a, bcd addition, carry in addition, add subtract multiply divide, arithmetic program, 16 bit addition\n## Arithmetic Group\n- `ADD A,src` — A = A + src; CY, AC, OV set\n- `ADDC A,src` — A + src + CY (multi-byte addition)\n- `SUBB A,src` — A = A − src − CY (**pehle `CLR C` karo**!)\n- `INC / DEC` — flags affect nahi\n- `MUL AB` — A × B → **B = high byte, A = low byte**; CY=0; OV=1 agar product > 255\n- `DIV AB` — A ÷ B → **A = quotient, B = remainder**; B=0 → OV=1\n- `DA A` — BCD correction (ADD ke baad)\n**16-bit add:**\n```\nCLR C\nMOV A,R0    ; low byte 1\nADD A,R2    ; + low byte 2\nMOV R4,A\nMOV A,R1    ; high byte 1\nADDC A,R3   ; + high byte 2 + carry\nMOV R5,A\n```\n>> rel: psw, instr-data, bcd\n\n@@ bcd | Instructions | BCD, DA A, Packed/Unpacked | bcd, da a, packed bcd, unpacked bcd, decimal adjust, bcd addition, ascii to bcd, hex to decimal, hex to bcd, swap a, number convert\n## BCD aur DA A\n**Packed BCD** = 1 byte mein 2 decimal digits (25 = 25H). **Unpacked** = 1 byte me 1 digit.\n`DA A` **sirf ADD/ADDC ke baad** A ko BCD banata hai:\n```\nMOV A,#29H\nADD A,#18H    ; = 41H (hex)\nDA  A         ; = 47H (BCD sahi, 29+18=47)\n```\n**Hex → decimal digits (A ka value 0–255):**\n```\nMOV B,#100\nDIV AB        ; A = hundreds, B = rem\nMOV R2,A\nMOV A,B\nMOV B,#10\nDIV AB        ; A = tens, B = ones\n```\nASCII digit → number: `SUBB 30H` (ya `ANL A,#0FH`). Number → ASCII: `ORL A,#30H`.\n>> rel: arith, instr-logic\n\n@@ instr-data | Instructions | Data Transfer instructions | data transfer instructions, mov push pop xch, xchd, data transfer, mov instruction, mov kaise karte hain, copy data, swap registers, mov a r0\n## Data Transfer\n`MOV dest,src` | `MOV DPTR,#16bit` | `MOVC` | `MOVX` | `PUSH/POP` | `XCH A,src` (swap) | `XCHD A,@Ri` (low nibble swap)\n**Restrictions yaad rakho:**\n- Register-to-register direct nahi: `MOV R0,R1` ✘ → `MOV A,R1 / MOV R0,A` ✔\n- `MOV R0,30H` ✔ (direct se register)\n- PUSH/POP sirf **direct** address: `PUSH ACC`, `PUSH 0E0H` (`PUSH A` ✘)\n- Immediate destination nahi hota: `MOV #5,A` ✘\nExample block copy (RAM 30H→40H, 8 bytes):\n```\nMOV R0,#30H\nMOV R1,#40H\nMOV R2,#8\nL: MOV A,@R0\n   MOV @R1,A\n   INC R0\n   INC R1\n   DJNZ R2,L\n```\n>> rel: addr-modes, movx-movc\n\n@@ instr-logic | Instructions | Logical instructions (ANL, ORL, XRL, CPL, rotate) | logical instructions, anl orl xrl, masking, mask bits, rotate, rl rr rlc rrc, swap, and or xor, logic operations, bit masking, nibble\n## Logical Group\n- `ANL` — AND → bits **clear/mask** karna: `ANL A,#0FH` (upper nibble clear)\n- `ORL` — OR → bits **set** karna: `ORL P1,#80H`\n- `XRL` — XOR → bits **toggle**: `XRL A,#0FFH` (complement)\n- `CPL A` — complement, `CLR A` — A=0\n- Rotate: `RL A`, `RR A`, `RLC A`, `RRC A` (carry ke through), `SWAP A` (nibbles ulte)\n**Shift left by 1** = ×2: `CLR C / RLC A`. **LED chaser:** `MOV A,#01H / L: MOV P1,A / RL A / ACALL DELAY / SJMP L`.\nCheck bit: `ANL A,#08H / JNZ BIT3_SET`.\n>> rel: instr-bit, instr-jump\n\n@@ instr-bit | Instructions | Bit manipulation & Boolean instructions | bit instructions, setb clr cpl, jb jnb jbc, bit manipulation, boolean instructions, anl c orl c, mov c bit, bit test, single bit operation\n## Boolean / Bit Instructions\n`SETB bit` | `CLR bit` | `CPL bit` | `MOV C,bit` / `MOV bit,C` | `ANL C,bit` / `ANL C,/bit` | `ORL C,bit` | `JB bit,rel` | `JNB bit,rel` | `JBC bit,rel` (jump + clear) | `JC` / `JNC`\n```\nJNB P3.0,PRESSED   ; switch (active low) dabaa?\nSETB P1.0\nSJMP ...\n```\n`JBC TF0,label` — flag check + clear ek hi instruction mein. Bit-addressable RAM/SFR hi use ho sakte hain.\n>> rel: bitaddr, instr-logic\n\n@@ instr-jump | Instructions | Branch / Compare instructions (CJNE, DJNZ, JZ...) | cjne, djnz, jz jnz, jc jnc, compare instruction, conditional jump, loop instruction, comparison, compare two numbers, cjne carry flag\n## Branch / Loop / Compare\n- `JZ rel` / `JNZ rel` — A==0 / A≠0\n- `JC` / `JNC` — carry\n- `DJNZ Rn/direct,rel` — decrement, ≠0 to jump (loops ke liye)\n- `CJNE a,b,rel` — a≠b to jump; **CY = 1 agar a < b** (unsigned), warna 0\n**Compare ka pattern:**\n```\nCJNE A,#50H,NOTEQ   ; barabar hai?\n; yahan A == 50H\nSJMP DONE\nNOTEQ: JC LESS      ; CY=1 -> A < 50H\n; yahan A > 50H\nLESS: ...\n```\n8051 mein koi alag \"compare\" ya \"JGE\" instruction nahi.\n>> rel: call-ret, instr-bit\n\n@@ instr-list | Instructions | Instruction Set (sab categories) | instruction set, 8051 instructions, instruction list, all instructions, kitne instructions hain, instruction categories, 111 instructions, opcodes\n## 8051 Instruction Set — 5 categories (111 instructions)\n1. **Data transfer:** MOV, MOVC, MOVX, PUSH, POP, XCH, XCHD\n2. **Arithmetic:** ADD, ADDC, SUBB, INC, DEC, MUL, DIV, DA\n3. **Logical:** ANL, ORL, XRL, CLR, CPL, RL, RLC, RR, RRC, SWAP\n4. **Boolean (bit):** SETB, CLR, CPL, ANL C, ORL C, MOV C, JB, JNB, JBC, JC, JNC\n5. **Branching:** AJMP, LJMP, SJMP, JMP, ACALL, LCALL, RET, RETI, JZ, JNZ, CJNE, DJNZ, NOP\nKisi bhi instruction ka naam likho (jaise \"**DJNZ**\" ya \"**MOVC kya hai**\") — main uska syntax, flags, cycles aur example bata dungi. Instruction size 1, 2 ya 3 bytes; cycles 1, 2 ya 4.\n>> rel: addr-modes\n\n@@ c-prog | Programming | 8051 C programming (Keil) | c programming, keil, embedded c, sbit, reg51.h, c language 8051, c program for 8051, c me program, sfr in c, interrupt in c, led blink c code, void main, c language, c code\n## Embedded C (Keil C51)\n```c\n#include <reg51.h>\nsbit LED = P1^0;          // pin ko naam\nsbit SW  = P3^0;\n\nvoid delay(unsigned int ms) {\n    unsigned int i, j;\n    for (i = 0; i < ms; i++)\n        for (j = 0; j < 123; j++);   // ~1 ms @11.0592 MHz\n}\nvoid main() {\n    SW = 1;               // input ke liye\n    while (1) {\n        LED = 0;  delay(500);\n        LED = 1;  delay(500);\n    }\n}\n```\n- Port poora: `P1 = 0xAA;` | bit: `P1_0 = 1;`\n- **Timer ISR:** `void timer0_isr() interrupt 1 { TH0=0x4C; TL0=0; }` (interrupt number: INT0=0, T0=1, INT1=2, T1=3, Serial=4)\n- Serial: `TMOD=0x20; TH1=0xFD; SCON=0x50; TR1=1; SBUF='A'; while(!TI); TI=0;`\nIs simulator me abhi assembly chalti hai — C ka code Keil se HEX banake concept samjho; yahan assembly likhna hota hai.\n>> rel: asm-basics, timer-delay\n\n@@ led-interface | Interfacing | LED interfacing (resistor, active low/high) | led interfacing, led ko kaise jode, led resistor, led current limiting, led blink, led connection, led kaise lagaye, 8051 led, led resistor value, led glow, active low led, led\n## LED Interfacing\nLED ke saath **current-limiting resistor zaroori** (warna LED jal jaayegi).\n**R = (Vsupply − Vf) / I** → (5V − 2V) / 10mA = **300Ω ≈ 330Ω** (red LED, Vf≈2V).\n**Do tarike:**\n1. **Sinking (active-low, recommended):** `VCC → R → LED → pin`. Pin = 0 → LED ON, pin = 1 → OFF.\n2. **Sourcing (active-high):** `pin → R → LED → GND`. Pin = 1 → LED ON (8051 kamzor source karta hai, brightness kam).\n**Port 0 ke liye:** P0 open-drain hai — **pull-up resistor (10K)** ya active-low sinking use karo.\n```\nMOV P1,#00H    ; sab LED ON (active-low)\nACALL DELAY\nMOV P1,#0FFH   ; sab OFF\n```\nSimulator: Devices window → **Resistor** + **LED** + **Ground/Battery** wire karo, LED tab jalegi jab current ka real path ho.\n>> rel: ports, delay-loop\n\n@@ switch-interface | Interfacing | Switch / Push-button interfacing aur Debounce | switch interfacing, push button, button interfacing, switch debounce, debouncing, switch ko kaise jode, pull up resistor, switch input, key press, input pin read\n## Switch Interfacing\n- Ek taraf **pin**, dusri taraf **GND**; pin ko internal/external **pull-up** (P0 par 10K external zaroori).\n- Dabane par pin = **0**, chhodne par = **1** (active-low).\n```\nSETB P3.0          ; input mode\nWAIT: JB P3.0,WAIT ; jab tak 1 (dabaya nahi)\n      ACALL DELAY  ; debounce 10-20 ms\n      JB P3.0,WAIT ; dobara confirm\n      CPL P1.0     ; action\nREL:  JNB P3.0,REL ; chhodne ka wait\n```\n**Debounce:** mechanical contact 5–20 ms bounce karta hai → ek press multiple press lagta hai. Fix: software delay ya RC + Schmitt.\n>> rel: ext-int, ports\n\n@@ seven-seg | Interfacing | 7-Segment display interfacing | seven segment, 7 segment, 7seg, seven segment display, common cathode, common anode, 7 segment code, 7 segment table, display digit, segment display, hex code for 7 segment, 7 segment, seven seg\n## 7-Segment Display\n8 LEDs (a,b,c,d,e,f,g,dp). Port bits: `dp g f e d c b a` = P1.7…P1.0.\n- **Common Cathode (CC):** COM → GND, segment 1 = ON\n- **Common Anode (CA):** COM → VCC, segment **0 = ON**\n| Digit | CC code | CA code |\n|---|---|---|\n| 0 | 3FH | C0H |\n| 1 | 06H | F9H |\n| 2 | 5BH | A4H |\n| 3 | 4FH | B0H |\n| 4 | 66H | 99H |\n| 5 | 6DH | 92H |\n| 6 | 7DH | 82H |\n| 7 | 07H | F8H |\n| 8 | 7FH | 80H |\n| 9 | 6FH | 90H |\nHar segment ke saath **330Ω resistor**. Multi-digit mein **multiplexing** (alag-alag digit ek ke baad ek tez switch, ~1–5 ms each).\n```\nMOV DPTR,#TABLE\nMOVC A,@A+DPTR\nMOV P1,A\n```\n>> rel: movx-movc, lcd-interface\n\n@@ lcd-interface | Interfacing | LCD 16x2 (HD44780) interfacing | lcd, lcd interfacing, 16x2 lcd, hd44780, lcd commands, lcd initialization, lcd init, lcd kaise jode, lcd display program, lcd rs rw en, lcd 4 bit mode, lcd 8 bit mode, lcd command list, 0x38, lcd not working, lcd, 16x2\n## 16×2 LCD (HD44780)\n**Pins:** VSS(GND), VDD(+5V), **VEE (contrast, 10K pot)**, **RS** (0=command, 1=data), **RW** (0=write), **E** (enable pulse), D0–D7, LED+/LED−.\n**Common commands:**\n| Cmd | Kaam |\n|---|---|\n| 38H | 8-bit, 2 line, 5×7 |\n| 28H | 4-bit, 2 line |\n| 0EH | display ON, cursor ON |\n| 0CH | display ON, cursor OFF |\n| 06H | cursor right (auto-increment) |\n| 01H | clear display (1.6 ms delay!) |\n| 80H | line 1 start |\n| C0H | line 2 start |\n**Simulator me connection:** RS=P3.7, RW=P3.6, E=P3.5, Data D0–D7 = P0 (P0 ko pull-ups chahiye).\n```\nINIT: MOV A,#38H / ACALL CMD\n      MOV A,#0EH / ACALL CMD\n      MOV A,#06H / ACALL CMD\n      MOV A,#01H / ACALL CMD\nCMD:  MOV P0,A / CLR P3.7 / CLR P3.6 / SETB P3.5 / CLR P3.5 / ACALL DELAY / RET\nDAT:  MOV P0,A / SETB P3.7 / CLR P3.6 / SETB P3.5 / CLR P3.5 / ACALL DELAY / RET\n```\nSample code: **'Samples' tab → LCD Display 'HI'**.\n>> rel: seven-seg, keypad\n\n@@ keypad | Interfacing | 4x4 Keypad interfacing | keypad, keypad interfacing, 4x4 keypad, matrix keypad, key scan, keypad scanning, rows columns, keypad code, keypad kaise jode, keypad\n## 4×4 Matrix Keypad\n16 keys = 4 rows × 4 columns (8 pins = ek port).\n**Scanning:** columns ko ek-ek karke LOW karo, rows padho; jo row low mile wahi key dabi hai.\n```\n; rows = P2.0-P2.3 (input), cols = P2.4-P2.7 (output)\nMOV P2,#0FFH\nCLR P2.4           ; column 0 active\nMOV A,P2\nANL A,#0FH\nCJNE A,#0FH,KEY    ; koi row low?\nSETB P2.4\n... (agle columns repeat)\n```\nPull-ups lagao (ya internal) rows par, aur debounce delay do. Simulator: Keypad (rows P2.0–3, cols P2.4–7). Sample: **'Keypad Scan'**.\n>> rel: lcd-interface, switch-interface\n\n@@ dc-motor | Interfacing | DC Motor interfacing (L293D / ULN2003 / transistor) | dc motor, motor interfacing, l293d, motor driver, h bridge, motor direction, motor forward reverse, motor kaise chalate hain, transistor driver, pwm motor, motor speed control, uln2003, motor, motor driver\n## DC Motor Interfacing\n8051 pin sirf ~mA current deta hai — motor **direct nahi** chalega. Driver zaroori.\n- **Transistor (NPN, 2N2222/BC547)** + base resistor (1K) + **flyback diode (1N4007)** motor ke parallel — sirf ek direction.\n- **L293D (H-bridge):** 2 motors, **direction control**. IN1/IN2 se: `10` = forward, `01` = reverse, `00/11` = stop; ENABLE = 1.\n- **ULN2003:** 7 Darlington driver array (inverting; input 1 → output LOW sinks).\n```\nSETB P1.0     ; IN1 =1\nCLR  P1.1     ; IN2 =0  -> forward\nSETB P1.2     ; enable\n```\n**Speed control:** PWM ek enable pin par (timer se duty cycle badlo). Back-EMF se bachne ke liye diode zaroor.\nSimulator: Devices me **L293D + DC Motor + Battery(+12V)**, motor ki supply L293D ke VSS2 se.\n>> rel: stepper, relay-interface\n\n@@ stepper | Interfacing | Stepper Motor interfacing | stepper motor, stepper interfacing, stepper sequence, step angle, stepper motor program, unipolar stepper, 28byj, uln2003 stepper, full step half step, stepper direction, stepper\n## Stepper Motor (Unipolar, 4-coil)\nMotor ULN2003 ke through, 4 pins (P1.0–P1.3) se coil energize karte hain.\n| Step | Wave drive | Full step (2-phase) |\n|---|---|---|\n| 1 | 0001 (01H) | 1001 (09H) |\n| 2 | 0010 (02H) | 0011 (03H) |\n| 3 | 0100 (04H) | 0110 (06H) |\n| 4 | 1000 (08H) | 1100 (0CH) |\n```\nLOOP: MOV P1,#09H  ; step 1\n      ACALL DELAY  ; delay = speed\n      MOV P1,#03H\n      ACALL DELAY\n      MOV P1,#06H\n      ACALL DELAY\n      MOV P1,#0CH\n      ACALL DELAY\n      SJMP LOOP\n```\nSequence ulta chalaoge to **reverse direction**. Delay kam = tez speed (itna kam nahi ki motor step miss kare). Step angle = 360° / steps per revolution (jaise 1.8° → 200 steps).\n>> rel: dc-motor, relay-interface\n\n@@ relay-interface | Interfacing | Relay & Buzzer interfacing | relay, relay interfacing, relay driver, buzzer, buzzer interfacing, 230v control, ac load control, flyback diode relay, transistor relay, ac bulb, appliance control\n## Relay & Buzzer\n**Relay:** electromechanical switch — coil (5V/12V, ~70 mA) → **NPN transistor** (BC547/2N2222) + 1K base R + **1N4007 flyback diode** coil ke across. Contacts: COM, **NO** (normally open), **NC**.\n```\nSETB P1.0   ; transistor ON -> relay ON\nACALL DELAY\nCLR P1.0    ; OFF\n```\nAC load (230V) ko contacts se switch karo — **safety/isolation** ka dhyan.\n**Buzzer:** active buzzer = DC lagao, beep. Passive buzzer = frequency (square wave) chahiye — timer se toggle karo: `CPL P1.0` har half-period.\n>> rel: dc-motor, led-interface\n\n@@ adc | Interfacing | ADC0804 interfacing (analog input) | adc, adc0804, analog to digital, adc interfacing, adc0808, adc program, analog input, sensor reading, adc kaise use kare, 8051 me adc nahi hota, adc, kya 8051 me adc hota hai, on chip adc, adc hota hai\n## ADC0804 (8-bit)\n8051 me **on-chip ADC nahi** hota — external ADC0804.\n**Pins:** CS, RD, WR, INTR, Vin(+), Vin(−), **Vref/2**, DB0–DB7, CLK-R, CLK-IN.\n**Digital value = Vin / Step**; Step = Vref / 256 (Vref=5V → 19.53 mV).\n**Conversion steps:**\n1. CS=0, WR: HIGH→LOW→HIGH (start conversion)\n2. Wait INTR = LOW (conversion complete)\n3. CS=0, RD: HIGH→LOW → data on DB0–7\n```\nSTART: CLR P3.0  ; CS\n       CLR P3.1  ; WR low\n       SETB P3.1 ; WR high -> start\nWAIT:  JB P3.3,WAIT   ; INTR low?\n       CLR P3.2  ; RD low\n       MOV A,P1  ; data\n       SETB P3.2\n```\nExamples: 2.5V → 128, 5V → 255. LM35 (10 mV/°C) → 25°C = 0.25V → ~13.\n>> rel: lm35, dac\n\n@@ lm35 | Interfacing | LM35 temperature sensor | lm35, temperature sensor, temperature measure, thermometer, lm35 interfacing, ds18b20, temperature kaise naape\n## LM35\nOutput = **10 mV per °C** (0.25V = 25°C). 3 pin: +Vs, OUT, GND. 8051 me **ADC0804** ke through jodo.\nTemperature (°C) = ADC_value × (5V/256) / 0.01 = **ADC × 1.953** (≈ ADC × 2 jab Vref=5V). Behtar resolution ke liye ADC0804 Vref/2 = 1.28V → har count ≈ 1°C... (Vref=2.56V).\nDisplay: ADC value ko BCD (DIV AB) me convert karke LCD/7-seg par dikhao.\n>> rel: adc, bcd\n\n@@ dac | Interfacing | DAC0808 interfacing (waveform generation) | dac, dac0808, digital to analog, waveform generation, sawtooth, triangular wave, square wave generation, dac interfacing, dac program, 8 bit dac, dac\n## DAC0808 (8-bit)\nInput: D0–D7 (P1), output: **current Iout** → op-amp (741) se voltage me convert. **Vout = Vref × (D / 256)** (Vref=5V → 0–4.98V).\n**Sawtooth wave:**\n```\nAGAIN: MOV A,#0\nUP:    MOV P1,A\n       INC A\n       CJNE A,#0,UP   ; 255 ke baad wrap hoke 0\n       SJMP AGAIN\n```\n**Square wave:** P1 = 00H, delay, P1 = FFH, delay. **Triangular:** 0→255 count up phir 255→0 down.\nSimulator: Devices me **DAC0808** + **Oscilloscope (CRO)** — waveform real dikhegi.\n>> rel: adc, lm35\n\n@@ servo | Interfacing | Servo Motor (SG90) control | servo, servo motor, sg90, servo control, servo angle, pwm servo, servo program, servo kaise chalate hain, servo 90 degree, servo\n## Servo Motor (SG90)\n3 wires: Brown/Black = GND, Red = +5V, Orange/Yellow = **Signal**. Control = **PWM, period 20 ms (50 Hz)**; pulse width angle decide karti hai:\n| Pulse | Angle |\n|---|---|\n| 1.0 ms | 0° |\n| 1.5 ms | 90° |\n| 2.0 ms | 180° |\nPattern: pin HIGH (pulse width) → LOW (baaki 20 ms). Har 20 ms me repeat; servo ko position hold karne ke liye PWM lagatar chahiye.\nTimer0 se pulse width generate karo (50 ms ki jagah ~1.5 ms ka reload). Simulator me Devices → **Servo SG90**.\n>> rel: dc-motor, timer-delay\n\n@@ hcsr04 | Interfacing | HC-SR04 Ultrasonic sensor | hc-sr04, ultrasonic, ultrasonic sensor, distance measurement, trig echo, distance sensor, hc sr04, sonar, distance kaise naape\n## HC-SR04 Ultrasonic\nPins: VCC, **TRIG**, **ECHO**, GND. \n1. TRIG pin par **10 µs ka HIGH pulse**\n2. Sensor 8 pulses (40kHz) bhejta hai\n3. ECHO pin utni der **HIGH** rehta hai jitna sound ke aane-jane me time laga\n4. **Distance (cm) = Echo time (µs) / 58**\nTimer0 ko ECHO HIGH hone par start karo (GATE ya software), LOW hone par stop; TH0:TL0 × 1.085 µs = time. Range 2 cm – 400 cm. Echo 5V hai — 8051 ke saath theek.\n>> rel: timer-delay, tmod\n\n@@ i2c | Interfacing | I2C protocol (DS1307, 24C02) | i2c, i2c protocol, ds1307, rtc, 24c02, eeprom, scl sda, i2c 8051, real time clock, at24c02, i2c start stop, i2c\n## I²C (2-wire)\nPins: **SCL** (clock) aur **SDA** (data) — dono **pull-up (4.7K)** ke saath. 8051 me hardware I²C nahi → **bit-banging** (software se pins toggle).\n- **START:** SCL high rahe tab SDA high→low\n- **STOP:** SCL high rahe tab SDA low→high\n- Data bit SCL high par stable; 8 bits + **ACK** (slave SDA low kare)\n- Pehla byte = device address + R/W (DS1307 = **D0H/D1H**, 24C02 = **A0H/A1H**)\n**DS1307 RTC:** registers 00H seconds … 06H year, BCD me. **24C02:** 256 bytes EEPROM, byte write + 5 ms write time.\nSimulator ke Devices me **DS1307** aur **AT24C02** available hain, dono SCL=P1.0, SDA=P1.1 se jodo.\n>> rel: servo, hcsr04\n\n@@ shift-reg | Interfacing | 74HC595 aur MAX232 | 74hc595, shift register, serial to parallel, max232, rs232, rs-232, port expansion, 595, level shifter, pins kam padh gaye\n## 74HC595 (serial-in, parallel-out)\nPins: **DS (data), SHCP (shift clock), STCP (latch), OE, MR, Q0–Q7, Q7S (cascade)**.\nProcess: data bit DS par rakho → SHCP ko pulse (rising edge pe shift) × 8 bit → **STCP pulse** (outputs update). 3 pins se 8 outputs, cascade karo to 16, 24...\n## MAX232\nRS-232 (±12V) ↔ TTL (0/5V) level converter. PC se serial link ke liye P3.0/P3.1 ko MAX232 ke through jodo. Chip ke 4 capacitors 1µF lagte hain.\n>> rel: serial-tx, i2c\n\n@@ sensors | Interfacing | IR, PIR, LDR sensors | ir sensor, pir sensor, ldr, motion sensor, light sensor, obstacle sensor, sensors with 8051, sensor interfacing, line follower\n## Digital Sensors\n- **IR obstacle sensor:** object aane par OUT = LOW (module me comparator). `JNB P1.0,OBSTACLE`.\n- **LDR module:** light par DO = HIGH/LOW (preset knob se threshold).\n- **PIR motion:** motion par OUT = HIGH (kuch seconds hold).\nSab 3 pins: VCC, GND, OUT → seedha port pin (pull-up/ground ka dhyan).\nSimulator Devices me ye sab available hain; dialog se object/light/motion toggle karo.\n>> rel: switch-interface, adc\n\n@@ crystal-ckt | Hardware | Minimum circuit (8051 chalane ke liye kya chahiye) | minimum circuit, minimum system, 8051 circuit kaise banaye, 8051 ko kaise chalaye, hardware setup, 8051 kaise chalta hai, minimum components, crystal capacitor reset, programming 8051 chip, burner, flash\n## 8051 chalane ka Minimum Circuit\n1. **+5V** → pin 40 (VCC), **GND** → pin 20\n2. **Crystal** 11.0592 MHz → pin 18 & 19, har taraf se **30pF** cap GND tak\n3. **Reset circuit** → pin 9: 10µF (VCC se) + 8.2K (GND tak)\n4. **EA (pin 31) → VCC** (internal ROM use ho)\n5. Output (LED etc.) port pin se resistor ke saath\n**Program dalna:** Keil/assembler se **.HEX** file → **Flash programmer** (USBasp / ISP for AT89S51, ya Flash Magic via UART for P89V51) se chip me burn.\n>> rel: reset, osc-timing, led-interface\n\n@@ viva1 | Viva / Exam | 8051 Viva Questions (Basic) | viva, viva questions, interview questions, important questions, exam questions, short questions, 8051 questions, practical viva, oral questions, important questions 8051, university exam\n## 8051 — Important Viva Questions (Short answers)\n1. **8051 kya hai?** 8-bit microcontroller, Intel (1980), 40-pin DIP.\n2. **Kitni RAM/ROM?** 128B RAM, 4KB ROM.\n3. **Kitne ports, pins?** 4 ports, 32 I/O pins.\n4. **Kaun sa port open-drain hai?** Port 0 (pull-up chahiye).\n5. **Timers?** 2, 16-bit (T0, T1).\n6. **Interrupts?** 5 (INT0, T0, INT1, T1, Serial).\n7. **Stack pointer reset value?** 07H.\n8. **PC reset value?** 0000H.\n9. **Machine cycle?** 12 clock = 1 µs @12 MHz (1.085 µs @11.0592).\n10. **11.0592 MHz kyun?** Exact baud rates ke liye.\n11. **Register banks?** 4 (00H–1FH).\n12. **Bit-addressable area?** 20H–2FH (128 bits) + kuch SFR.\n13. **SFR area?** 80H–FFH.\n14. **DPTR?** 16-bit = DPH+DPL.\n15. **PSW flags?** CY, AC, F0, RS1, RS0, OV, P.\n16. **Harvard architecture?** Code aur data memory alag.\n17. **EA pin ka kaam?** 1 → internal ROM, 0 → external ROM.\n18. **ALE kya karta hai?** P0 se address latch.\n19. **TMOD / TCON?** Timer mode / control (TR, TF, IT, IE).\n20. **Serial mode 1 baud?** Timer1 se, 9600 → TH1 = FDH.\n21. **RET vs RETI?** RETI interrupt logic ko clear karta hai.\n22. **MUL AB result?** A = low, B = high.\n23. **Quasi-bidirectional?** Port ko input banane ke liye pehle 1 likhna padta hai.\n24. **MOVC vs MOVX?** Code memory vs external data memory.\n25. **Reset kaise?** RST pin 2 machine cycle high.\nKisi bhi question ka detail poochho (jaise \"stack pointer kya hai\").\n>> rel: viva2, what, features\n\n@@ viva2 | Viva / Exam | Long answer questions (exam style list) | long answer, exam long questions, draw block diagram, explain architecture, 5 marks, 10 marks question, exam important topics, university important questions, most important topics 8051, important topics\n## Exam me aksar aane wale Long Questions\n1. **8051 ka architecture / block diagram** draw karke explain karo → *architecture*\n2. **Memory organization** (RAM map, SFR) → *memory*, *sfr*\n3. **Pin diagram + function of each pin** → *pins*\n4. **Timers/counters — TMOD, TCON, modes** → *tmod*, *tcon*, *timer modes*\n5. **Interrupts — vector table, IE, IP** → *interrupts*, *ie-ip*\n6. **Serial communication — SCON, baud rate** → *scon*, *baud*\n7. **Addressing modes with examples** → *addressing modes*\n8. **Instruction set categories** → *instruction set*\n9. **Interfacing: LCD, keypad, ADC/DAC, stepper, 7-seg** → *lcd*, *keypad*, *adc*, *dac*, *stepper*\n10. **Programs:** 1s delay using Timer, serial TX, ADD/SUB/MUL/DIV, block transfer, largest of array, LED toggle, sorting.\nMujhe sirf topic ka naam bolo (jaise \"SCON explain karo\") — main exam-style answer dungi.\n>> rel: viva1\n\n@@ prog-array | Programs | Common programs (largest number, sum, sort, block copy) | largest number, smallest number, sum of numbers, sorting, bubble sort, ascending order, array program, block transfer, block copy, find largest in array, add n numbers, factorial, fibonacci, palindrome, count ones\n## Common Exam Programs\n**Largest of 5 numbers (RAM 30H–34H):**\n```\n    MOV R0,#30H\n    MOV R2,#4\n    MOV A,@R0\nL:  INC R0\n    MOV B,@R0\n    CJNE A,B,CHK\n    SJMP NXT\nCHK: JNC NXT          ; A>=B\n    MOV A,B\nNXT: DJNZ R2,L\n    MOV 40H,A         ; largest\n    SJMP $\n```\n**Sum of N numbers:**\n```\n    MOV R0,#30H\n    MOV R2,#5\n    CLR A\nL:  ADD A,@R0\n    INC R0\n    DJNZ R2,L\n```\n**Count number of 1's in A:**\n```\n    MOV R2,#8\n    MOV R3,#0\nL:  RLC A\n    JNC S\n    INC R3\nS:  DJNZ R2,L\n```\nAur bhi programs chahiye (factorial, sorting, fibonacci...)? Naam likho — main step-by-step likh dungi, ya 'code do' kehkar pooch lo.\n>> rel: asm-basics, instr-jump\n\n@@ factorial | Programs | Factorial / Fibonacci / Sorting programs | factorial program, fibonacci, multiplication without mul, square of number, cube number\n## Factorial of a number (≤5) — A me result\n```\n    MOV R0,#5      ; n\n    MOV A,#1\nL:  MOV B,R0\n    MUL AB         ; A = A*R0\n    DJNZ R0,L\n    MOV 40H,A      ; 5! = 120 = 78H\n    SJMP $\n```\n## Fibonacci (first 8 terms @ 40H…)\n```\n    MOV R0,#40H\n    MOV R2,#6\n    MOV @R0,#0\n    INC R0\n    MOV @R0,#1\nL:  MOV A,@R0\n    DEC R0\n    ADD A,@R0\n    INC R0\n    INC R0\n    MOV @R0,A\n    DEC R0\n    DJNZ R2,L\n    SJMP $\n```\n## Bubble sort (ascending, 5 bytes @30H)\nOuter loop 4 baar, inner me adjacent pair compare (`CJNE`, `JC`) karke `XCH` se swap karo. Poora code chahiye to bolo: \"bubble sort ka code do\".\n>> rel: prog-array\n\n@@ errors | Debug | Common errors / code kaam kyun nahi kar raha | error, assembler error, code not working, code kaam nahi kar raha, program run nahi ho raha, undefined symbol, syntax error, wrong operand, led nahi jal rahi, common mistakes, debugging, mistakes, galti, kyun nahi chal raha, blink nahi ho raha, led blink nahi, led nahi jal rahi, nahi ho raha, kaam nahi karta, not working\n## Common Mistakes (aur fix)\n| Problem | Wajah | Fix |\n|---|---|---|\n| Program chalke ruk jaata/ghoomta | End me loop nahi | `SJMP $` lagao |\n| LED turant jal-bujh | Delay nahi | `ACALL DELAY` |\n| Timer delay nahi | TR0 set nahi / TF0 clear nahi | `SETB TR0`, polling me `CLR TF0` |\n| UART kuch nahi bhejta | TR1 set nahi / TH1 galat | `SETB TR1`, TH1=FDH |\n| Switch read galat | Input ke liye pin 1 nahi | `SETB P3.0` pehle |\n| P0 LED/switch nahi chala | P0 open-drain | 10K pull-up |\n| `MOV R0,R1` error | Rn→Rn allowed nahi | `MOV A,R1 / MOV R0,A` |\n| ISR ke baad program ud jata | RETI ki jagah RET / stack unbalanced | RETI, PUSH/POP balance |\n| Number `FFH` error | Hex A–F se shuru ho to 0 lagao | `0FFH` |\n| SUBB galat | Carry set tha | `CLR C` pehle |\nApna code yahan paste karo aur **🩺 Check My Code** dabao — main real assembler se chalake exact error line batati hoon.\n>> rel: asm-basics\n\n@@ roadmap | Learning | 8051 kaise seekhein / project ideas | kaise seekhe, learning path, roadmap, project ideas, mini project, 8051 projects, final year project, beginner guide, sikhna shuru kaha se, practice, seekhu, seekhna, sikhu, sikhna, learn 8051, 8051 kaise seekhu, beginners\n## 8051 Seekhne ka Roadmap\n1. Architecture, memory, ports, registers samjho\n2. Assembly basics: MOV, ADD, JMP, loops\n3. LED blink → LED chaser → switch se LED\n4. Timer delay → timer interrupt\n5. 7-segment counter → LCD display → keypad\n6. Serial communication (UART)\n7. Motor (DC / stepper / servo) + relay\n8. ADC/DAC, sensors (LM35, IR, ultrasonic), I²C RTC\n9. Embedded C (Keil) + real hardware (AT89S51)\n**Mini project ideas:** traffic light controller, digital clock (DS1307 + LCD), temperature monitor (LM35 + ADC + LCD), password door lock (keypad + relay), obstacle-avoiding robot (IR + L293D), distance meter (HC-SR04 + LCD), stepper motor controller, waveform generator (DAC).\nIs simulator me har ek device available hai — Devices window me jaake circuit banao aur chalao!\n>> rel: sim-howto\n\n@@ sim-howto | Simulator | Simulator kaise use karein (short) | simulator kaise use kare, simulator help, how to use simulator, devices window, assemble run step, project save, copy paste components, oscilloscope kaise khole\n## Simulator Quick Guide\n1. **Main window** me assembly likho → **Assemble** → **Run** (ya **Step** debug ke liye).\n2. Registers/ports/memory live dikhte hain; speed slider se control.\n3. **Devices** button → circuit designer: left library se device drag karo, **Wire Mode (W)** se pin-to-pin wires jodo, **RUN**.\n4. **Shortcuts:** `Ctrl+C/V/D` copy/paste/duplicate, `R` rotate, `Delete`, `Shift+drag` multi-select. Right-click → **Duplicate × N** se 8 LED ek saath.\n5. **Oscilloscope** component ko pin se jodo, right-click → Open Oscilloscope Window.\n6. **UART window** se serial TX/RX waveform aur byte inject.\n7. Project auto-save hota hai; File → Save As se `.sim` download.\nPoora detail ke liye bolo: \"**simulator ka poora guide do**\".\n>> rel: roadmap\n\n@@ sbuf | Serial | SBUF (Serial Buffer) | sbuf, serial buffer, sbuf kya hota hai, sbuf register, 99h, serial data register\n## SBUF — Serial Buffer (99H)\nSBUF actually **do alag registers** hai ek hi address (99H) par:\n- **Write:** `MOV SBUF,A` → transmit buffer me data jaata hai aur **transmission turant shuru** ho jata hai.\n- **Read:** `MOV A,SBUF` → receive buffer se aaya hua byte milta hai.\nIsliye ek hi naam se TX aur RX dono hote hain. TX complete hone par **TI=1**, RX complete hone par **RI=1** (dono software se clear karo).\n8051 **double-buffered receive** karta hai: pichla byte SBUF me padha na gaya ho tab bhi agla byte shift register me aa sakta hai (par uske baad overrun ho sakta hai).\n>> rel: scon, serial-tx, serial-rx\n\n@@ square-wave | Programs | Square wave / frequency generate karna | square wave, square wave generate, frequency generate, 1khz, pulse generate, clock generate, pwm, pwm generate, duty cycle, toggle pin timer\n## Square Wave (Timer0 se) — 1 kHz example\nPeriod 1 ms → **half period = 500 µs**. Counts = 500 / 1.085 ≈ 461 → reload = 65536 − 461 = **FE33H**.\n```\n    MOV TMOD,#01H\nAGAIN:\n    MOV TH0,#0FEH\n    MOV TL0,#33H\n    SETB TR0\nW:  JNB TF0,W\n    CLR TR0\n    CLR TF0\n    CPL P1.0          ; har 500 us pe toggle -> 1 kHz\n    SJMP AGAIN\n```\nFormula: **Half-period reload = 65536 − (T_half / 1.085 µs)**. Duty cycle badalna ho to HIGH aur LOW ke liye alag reload values lo (**PWM**). Simulator me P1.0 par **Oscilloscope** lagao aur dekho. DAC0808 se sawtooth/triangular bhi bana sakte ho.\n>> rel: timer-delay, dac, servo\n\n@@ bubble | Programs | Bubble sort program (ascending) | bubble sort, sorting, sort program, ascending order, descending order, array sort, sort numbers, bubble sort ka code\n## Bubble Sort — 5 numbers (RAM 30H–34H), Ascending\n```\n    MOV R2,#4          ; passes = n-1\nOUT: MOV R0,#30H\n    MOV A,R2\n    MOV R3,A           ; inner loop count\nIN: MOV A,@R0          ; A = current\n    INC R0\n    MOV B,@R0          ; B = next\n    CJNE A,B,DIFF\n    SJMP NEXT\nDIFF: JC NEXT          ; A < B -> theek hai\n    MOV @R0,A          ; swap: next = A\n    DEC R0\n    MOV @R0,B          ;        current = B\n    INC R0\nNEXT: DJNZ R3,IN\n    DJNZ R2,OUT\n    SJMP $\n```\n**Descending** chahiye to `JC NEXT` ki jagah `JNC NEXT` karo. Pehle RAM 30H–34H me numbers daal ke Step mode me dekho kaise sort hote hain.\n>> rel: prog-array, instr-jump\n\n@@ count-ones | Programs | Number me 1 ki ginti / ones count | count ones, number of ones, 1 ki ginti, kitne 1 hain, count bits, set bits, ones in a byte, parity count\n## Byte me 1's ginna\n```\n    MOV A,#0B7H        ; number\n    MOV R2,#8          ; 8 bits\n    MOV R3,#0          ; counter\nL:  RLC A\n    JNC S\n    INC R3\nS:  DJNZ R2,L\n    ; R3 = 1 ki ginti (B7H me 6)\n    SJMP $\n```\nIdea: har bit ko carry me rotate karo, carry=1 ho to counter badhao. Parity flag (P) bhi A me 1's ki ginti odd/even batata hai.\n>> rel: prog-array, instr-logic\n\n@@ dev-all | Devices | Simulator ke saare Devices (list aur kaam) | simulator devices, devices list, kaun kaun se devices hain, components list, kitne devices hain, devices window me kya kya hai, available components, sab devices, devices kis liye use hote hain, components ka use, sare components\n## Simulator ke Devices — kaun sa device kis kaam ka\n| Category | Device | Kis liye use hota hai |\n|---|---|---|\n| **IC** | 8051 (AT89C51) | Main microcontroller — aapka code yahi chalata hai |\n| | ULN2003A | 7-channel driver (stepper, relay, buzzer, lamp ko current dene ke liye) |\n| | L293D | H-bridge: DC motor ki direction + speed |\n| | ADC0804 | Analog voltage → 8-bit digital number |\n| | DAC0808 | 8-bit digital number → analog voltage (waveform) |\n| | 74HC595 | Serial → parallel (kam pins se 8 outputs) |\n| | DS1307 | Real-time clock (I²C) — ghadi |\n| | AT24C02 | 256-byte EEPROM (I²C) — data permanent save |\n| **Output** | LED | Indication (1 bit ON/OFF) |\n| | 7-Segment, 4-Digit 7-Segment | Digit (0–9) / 4-digit number (multiplexed) dikhana |\n| | 8×8 Dot Matrix | Letters, symbols, animation (row-column scan) |\n| | LCD 16×2 | Text/numbers dikhana |\n| | Buzzer | Awaaz/beep |\n| | Relay + Lamp | AC/heavy load ON/OFF |\n| | DC Motor, Stepper, Servo | Motion/rotation |\n| | Oscilloscope (CRO) | Pin ka waveform dekhna |\n| **Input/Sensors** | Push Button, Keypad | User input |\n| | Potentiometer, LM35, LDR | Analog input (ADC se) |\n| | HC-SR04, IR, PIR | Distance / obstacle / motion |\n| | DHT11 | Temperature + Humidity (digital, single-wire) |\n| **Passive** | Resistor, Capacitor, Battery, Ground, NPN transistor | Current limit, supply (+5V/GND), switching |\nKisi bhi device ka naam likho (jaise \"**relay kya hai**\" ya \"**LM35 kaise kaam karta hai**\") — main uska use, working, pins, wiring aur code bata dungi.\n>> rel: interface-general, dev-8051, sim-devwin\n\n@@ interface-general | Devices | Koi bhi device 8051 se kaise interface karte hain (general method) | koi bhi device interface, device interface kaise karte hain, interfacing kya hota hai, interfacing steps, interfacing ka matlab, interfacing general, device connect karna\n## Interfacing = Hardware connection + Software\n**Interfacing** matlab kisi bahari device ko 8051 ke **port pins** se jodna aur code se usse baat karna.\n\n**Hardware ke 4 steps:**\n1. **Device ko power do** — +5V (Battery +) aur GND (Ground). Bina power ke koi device kaam nahi karta.\n2. **Signal pins ko port se jodo** — output device (LED, relay) ke input pin ko P1/P2 ke pin se; input device (switch, sensor) ke output ko port pin se.\n3. **Current dekho** — 8051 pin ~10 mA hi sink karta hai. LED ko **resistor (330Ω)** chahiye; motor/relay/buzzer ko **driver** (ULN2003/L293D/transistor) chahiye.\n4. **Voltage level** — ADC/DAC/sensor ko sahi reference (5V).\n\n**Software ke steps:**\n1. Pin ko **input ya output** ki tarah soch ke initialize karo (input pin par pehle `SETB` karo).\n2. Device ka **protocol** follow karo (LCD: RS/E pulses, ADC: CS/WR/RD, I²C: START/STOP, servo: PWM).\n3. **Delay** do jahan device ko time chahiye.\n4. Loop me padho/likho.\n\n| Device type | Kaise jodte hain | Code me |\n|---|---|---|\n| LED, buzzer | pin + resistor/driver | `SETB/CLR pin` |\n| Switch/sensor | pin ko input | `JB/JNB pin` |\n| LCD, ADC, DAC | 8-bit data + control pins | byte `MOV P0,A` + pulse |\n| Motor/relay | driver IC/transistor | direction bits + enable |\n| I²C (RTC, EEPROM) | SDA + SCL (2 pins) | START, address, data, STOP |\nSimulator me ye sab real jaisa hi hota hai — Devices window me jodke chalao.\n>> rel: dev-all, code-flow, sim-wire\n\n@@ code-flow | Devices | Code kaise likhte hain (flow: init, loop, delay) | code kaise likhe, program kaise likhe, code likhne ka tarika, code structure device ke liye, program flow, init loop, pehle kya likhe, program banane ka process, code writing steps, pehle code phir circuit\n## Code likhne ka sahi Flow (kisi bhi project ke liye)\n1. **Socho:** kaun sa pin kis device se juda hai (pin table banao).\n2. **Initialize:** stack (`MOV SP,#60H`), ports (`MOV P1,#0FFH`), timer/serial agar chahiye.\n3. **Main loop:** input padho → decision lo → output do → **delay**.\n4. **Subroutines:** DELAY, LCD_CMD, LCD_DATA, SEND jaise chhote functions.\n5. **Test:** pehle Step se, phir Run.\n```\nORG 0000H\n      SJMP MAIN\nORG 0030H\nMAIN: MOV SP,#60H      ; stack safe jagah\n      MOV P1,#0FFH     ; sab outputs OFF (active-low)\nLOOP: JB P3.0,OFF      ; switch dabaya?\n      CLR P1.0         ; LED ON\n      SJMP LOOP\nOFF:  SETB P1.0        ; LED OFF\n      SJMP LOOP\nDELAY: MOV R7,#250\nD1:   DJNZ R7,D1\n      RET\nEND\n```\nSimulator me workflow: **Main editor me code → Assemble → DEVICES → circuit → RUN**. Code editor ka code RUN par khud load ho jata hai.\n>> rel: asm-basics, sim-workflow, errors\n\n@@ dev-8051 | Devices | 8051 IC (microcontroller) in the simulator | 8051 ic, ic 8051, at89c51 component, microcontroller component, main chip, 8051 chip simulator me, ic kaise lagate hain, ic double click, code upload ic\n## 8051 / AT89C51 (DIP-40) — Simulator me\n**Kya hai:** circuit ka dimaag. Aapka assembly program isi par chalta hai; baaki devices iske pins se control hote hain.\n**Kis liye:** LED/LCD/motor ko control karna, sensors padhna, serial bhejna.\n**Pins:** P1.0–P1.7 (left top), RST, P3.0–P3.7, XTAL1/2, GND; P0.0–P0.7, VCC, ALE, /PSEN, /EA, P2.0–P2.7 (right).\n**Simulator me use:**\n1. Library se **IC_8051** canvas par rakho.\n2. IC par **double-click** → code window: \"Upload Code\" (file) ya main editor ka code load karo.\n3. Port pins ko devices se **wire** karo, **RUN** dabao.\n- P0 **open-drain** hai: LED/switch ya LCD data ke liye externally pull-up/driver ka dhyan rakho. Baaki ports P1, P2, P3 internal pull-up wale hain.\n- Crystal 11.0592 MHz maana jaata hai (UART baud exact).\n- VCC/GND pins ko supply (Battery +) aur Ground se jodna realistic hai; designer power rails ko pin-level me samajhta hai.\n>> rel: pins, ports, sim-devwin\n\n@@ dev-resistor | Devices | Resistor (kyun lagate hain, value kaise chune) | resistor, resistor kya hai, resistor kyun lagate hain, resistor value, ohm, 330 ohm, current limiting resistor, resistor ka use, pull up resistor, color code, resistor\n## Resistor\n**Kya hai:** current ko rokne wala passive component (unit Ω).\n**Kyun zaroori:** LED jaise device jyada current lene par **jal jaate hain**; resistor current ko safe limit me rakhta hai. **Ohm's law: I = V / R.**\n**Kaam:** (1) LED current limiting 220–470Ω, (2) **pull-up** (10K) input pin ya P0 par, (3) pull-down, (4) voltage divider, (5) transistor base resistor (1K–4.7K).\n**Value:** R = (5V − Vf) / I → LED: (5−2)/10mA = 300Ω → **330Ω**.\n**Simulator me:** Resistor ke 2 pins P1, P2. **Double-click** karke ohms set karo (330, 1000, 10000...). Bands (colour code) value ke hisaab se khud badalte hain. **LED bina resistor ke direct 5V se jodoge to wo \"burnt\" (jal gayi, kaali) ho jaayegi** — real hardware jaisa!\n>> rel: dev-led, led-interface\n\n@@ dev-led | Devices | LED (kaise kaam karta hai, simulator me) | led kya hai, led kaise kaam karta hai, led ka use, led working, led anode cathode, led jal gayi, led burnt, led nahi jal rahi simulator me, led colour change, led kaise lagaye simulator me, led\n## LED (Light Emitting Diode)\n**Kya hai:** diode jo current se roshni deta hai. **Sirf ek direction** me current leta hai: **Anode (+) → Cathode (−)**.\n**Kis liye:** status indication, 1-bit output dikhana, chaser patterns.\n**Working:** forward voltage ~2V (red); current ~5–15 mA. Zyada current → jal jaati hai, isliye **resistor zaroori**.\n**Simulator me pins:** `ANODE`, `CATHODE`. **Do tarike se lagao:**\n1. *Active-high:* P1.0 → Resistor → LED ANODE; CATHODE → Ground. P1.0 = 1 → ON.\n2. *Active-low (behtar):* Battery(+) → Resistor → LED ANODE; CATHODE → P1.0. P1.0 = 0 → ON.\n**Tips:** Right-click → **LED colour** (red/green/yellow/blue/white). 8 LED ek saath: ek LED lagao, **Ctrl+D**/right-click → *Duplicate × N*. Agar LED **kaali/dull** ho gayi = resistor nahi tha (burnt). Agar jale hi nahi: resistor/ground/path aur code me pin check karo.\n```\nMOV P1,#00H    ; active-low sab ON\n```\n>> rel: dev-resistor, led-interface, errors\n\n@@ dev-7seg | Devices | 7-Segment Display (simulator me) | 7 segment kya hai, 7 segment display ka use, seven segment working, common anode common cathode, 7 segment kaise lagaye simulator me, 7seg, display digit, 7 segment com pin\n## 7-Segment Display\n**Kya hai:** 7 LEDs (a–g) + dp se bana digit display. **Kis liye:** counter, clock, score, temperature digit.\n**Pins:** `A B C D E F G DP COM`.\n- **Common Cathode (CC):** COM = Ground, segment pin **HIGH = ON**.\n- **Common Anode (CA):** COM = +5V, segment pin **LOW = ON** (code inverted).\n**Simulator me:** segments ko **330Ω resistors** ke through P1.0–P1.6 (a=P1.0 … g=P1.6) se jodo; COM ko Ground (CC) ya Battery+ (CA). **Right-click → \"Toggle Common Cathode / Anode\"**. Resistor nahi lagaya to segments jal sakte hain.\nDigit codes (CC): 0=3FH 1=06H 2=5BH 3=4FH 4=66H 5=6DH 6=7DH 7=07H 8=7FH 9=6FH. (CA: C0 F9 A4 B0 99 92 82 F8 80 90)\n```\n      MOV DPTR,#TAB\n      MOV R2,#0\nL:    MOV A,R2\n      MOVC A,@A+DPTR\n      MOV P1,A\n      ACALL DELAY\n      INC R2\n      CJNE R2,#10,L\n      MOV R2,#0\n      SJMP L\nTAB:  DB 3FH,06H,5BH,4FH,66H,6DH,7DH,07H,7FH,6FH\n```\n>> rel: seven-seg, dev-resistor\n\n@@ dev-lcd | Devices | LCD 16x2 (simulator me wiring + code) | lcd kya hai, lcd ka use, lcd 16x2 simulator, lcd wiring, lcd kaise lagaye simulator me, lcd pins connection, lcd blank, lcd kuch dikh nahi raha, lcd contrast, lcd kaise kaam karta hai, lcd\n## LCD 16×2 (HD44780) — Simulator me\n**Kis liye:** text/numbers dikhana (sensor value, message, menu). 2 lines × 16 characters.\n**Kaise kaam karta hai:** andar HD44780 controller hota hai. Aap **command** (RS=0) aur **data/character** (RS=1) bhejte ho, **E pin ki pulse** par wo latch karta hai. Cursor, clear, position sab commands se.\n**Pins:** `VSS`(GND) `VDD`(+5V) `VEE`(contrast) `RS` `RW` `E` `D0–D7` `LEDA`(+) `LEDK`(−).\n**Wiring (8-bit):**\n- VSS → Ground, VDD → +5V, **VEE → Ground** (contrast max, easy), RW → Ground (ya P3.6=0)\n- RS → P3.7, E → P3.5, D0–D7 → P0.0–P0.7 (P0 ko pull-up chahiye, simulator me direct chalta hai)\n- LEDA → +5V, LEDK → Ground (backlight)\n**Code:** `38H, 0EH, 06H, 01H` (init) → `80H` (line1) → characters. 4-bit mode (D4–D7 + `28H`) bhi supported hai.\n```\n      MOV A,#38H  ; ACALL CMD\n      MOV A,#0CH  ; ACALL CMD\n      MOV A,#01H  ; ACALL CMD\n      MOV A,#'H'  ; ACALL DAT\n      MOV A,#'I'  ; ACALL DAT\n```\n**Kuch nahi dikh raha?** VDD/VSS/VEE connect, E pulse (SETB→CLR), init commands, aur 1.6 ms delay after `01H` check karo. Right-click → blue/green theme.\n>> rel: lcd-interface, dev-all\n\n@@ dev-switch | Devices | Push Button / Switch | switch kya hai, push button, button ka use, switch simulator me kaise lagaye, switch pins, push button interfacing simulator, switch click, button pressed\n## Push Button (Switch)\n**Kis liye:** user input — start/stop, mode, interrupt trigger.\n**Working:** dabane par 2 pins short; chhodne par open.\n**Simulator me:** pins `P1`, `P2`. Ek pin → **Ground**, dusra → port pin (jaise P3.0). Dabane par pin = **0** (active-low), chhodne par pull-up se **1**. Canvas par button par **click/hold** karke dabao (RUN chalte waqt).\n```\nSETB P3.0\nWAIT: JB P3.0,WAIT   ; jab tak 1\n      CPL P1.0\nREL:  JNB P3.0,REL\n      SJMP WAIT\n```\nPort 0 par lagao to 10K pull-up resistor (Battery+) chahiye. **Interrupt ke liye P3.2 (INT0)/P3.3 (INT1).**\n>> rel: switch-interface, ext-int\n\n@@ dev-keypad | Devices | Keypad 4x4 (simulator me) | keypad kya hai, keypad simulator me kaise lagaye, keypad pins, keypad rows columns, matrix keypad working, keypad ka use, keypad wiring, keypad\n## 4×4 Keypad\n**Kis liye:** number/password/menu input. 16 keys (1–9, 0, A–D, *, #).\n**Working:** keys matrix (4 rows × 4 cols) me — key dabane par uski row aur column judte hain. 8 pins me 16 keys.\n**Pins:** `R0–R3`, `C0–C3`.\n**Simulator me:** Rows → P2.0–P2.3, Columns → P2.4–P2.7 (convention). **Scanning:** ek column ko 0 karo, rows padho — jo row 0 ho wahi key. Canvas par keys par click karo.\n```\nSCAN: MOV P2,#0FFH\n      CLR P2.4          ; column 0\n      MOV A,P2\n      ANL A,#0FH\n      CJNE A,#0FH,KEY   ; koi row low?\n```\n>> rel: keypad, dev-switch\n\n@@ dev-buzzer | Devices | Buzzer | buzzer kya hai, buzzer ka use, buzzer simulator me, buzzer awaaz, buzzer kaise lagaye, buzzer beep, alarm, buzzer sound nahi aa rahi, buzzer\n## Buzzer\n**Kis liye:** alarm, beep, key-press feedback.\n**Kaise kaam karta hai:** piezo/magnetic element; DC dene par (active) beep, ya frequency dene par (passive) us frequency ki tone.\n**Pins:** `P` (+), `N` (−).\n**Simulator me:** P → port pin (ya driver output), N → Ground. **Real awaaz** (WebAudio) aati hai — frequency ke hisaab se tone! Right-click → Mute/Unmute.\n```\n; ~1 kHz tone: pin har 500 us par toggle\nL: CPL P1.0\n   MOV R7,#230\nD: DJNZ R7,D\n   SJMP L\n```\nZyada current wala buzzer ho to **ULN2003/transistor** se chalao.\n>> rel: relay-interface, dev-uln\n\n@@ dev-relay | Devices | Relay + Lamp (kaise kaam karta hai) | relay kya hai, relay ka use, relay kaise kaam karta hai, relay simulator me, relay wiring, relay lamp, lamp kya hai, com no nc, relay click, ac load control, relay\n## Relay + Lamp\n**Relay kya hai:** electromagnetic switch. Chhota current coil me → bada load (bulb, pump, AC) ON/OFF — **electrical isolation** ke saath.\n**Pins:** coil `A1`, `A2`; contacts `COM` (common), `NO` (normally open), `NC` (normally closed).\n- Coil OFF: COM–NC juda; Coil ON: COM–NO juda (click awaaz).\n**Simulator me wiring:**\n1. Coil: A1 → Battery(+), A2 → **NPN collector (C)**; NPN **E → Ground**, **B → resistor (1K) → P1.0**. (Ya ULN2003 output se.)\n2. Load: Battery(+) → COM, NO → **Lamp P1**, Lamp P2 → Ground.\n3. P1.0 = 1 → NPN ON → coil energize → lamp jalta hai.\n**Lamp:** simple bulb jo current milte hi jalta hai (load dikhane ke liye).\n```\nSETB P1.0   ; relay ON\nACALL DELAY\nCLR P1.0    ; OFF\n```\nReal me coil ke across **flyback diode** lagate hain (back-EMF).\n>> rel: dev-npn, relay-interface, dev-uln\n\n@@ dev-npn | Devices | NPN Transistor (switch ki tarah) | transistor kya hai, npn transistor, transistor ka use, transistor switch, bc547, 2n2222, base collector emitter, transistor simulator me, transistor driver, transistor kyun lagate hain, transistor\n## NPN Transistor (BC547 / 2N2222)\n**Kis liye:** chhote signal se bade load (relay, motor, buzzer) ko switch karna — electronic switch/amplifier.\n**Pins:** `B` (Base), `C` (Collector), `E` (Emitter).\n**Working:** Base me chhota current (via resistor) bahe to **C–E ke beech bada current** bahne lagta hai (switch ON). Base = 0 to OFF.\n**Simulator me:** E → **Ground**, C → load ka (−) side, B → **1K resistor → port pin**. Pin HIGH → load ON. Base resistor **zaroori** (1K–4.7K) warna pin/base overload.\nLoad ke saath motor/relay ho to **diode (flyback)** lagana real me na bhoolo.\n>> rel: dev-relay, dc-motor\n\n@@ dev-uln | Devices | ULN2003A Driver | uln2003 kya hai, uln2003a ka use, darlington driver, uln2003 kaise lagaye, uln2003 simulator me, stepper driver, uln2003 inverting, high current driver\n## ULN2003A — 7-channel Darlington Driver\n**Kis liye:** 8051 pin kamzor hai (~mA). ULN2003 **500 mA tak** per channel sink karta hai — stepper, relay, buzzer, lamp, LED array ke liye.\n**Pins:** inputs `IN1–IN7`, outputs `OUT1–OUT7`, `GND`, `COM` (load supply / flyback diode clamp).\n**Working:** **inverting** — Input HIGH (1) → output **LOW (sink to GND)** → load ON. Input 0 → output open.\n**Simulator me:** P1.0–P1.3 → IN1–IN4; OUT1–OUT4 → Stepper IN1–IN4; **GND → Ground**; **COM → Battery(+)** (stepper COM bhi +). Load ka dusra end supply (+) par hona chahiye.\n```\nMOV P1,#09H   ; step pattern\n```\n>> rel: stepper, dev-stepper\n\n@@ dev-stepper | Devices | Stepper Motor (simulator me) | stepper motor kya hai, stepper ka use, stepper kaise kaam karta hai, stepper simulator me, stepper wiring, step angle, stepper rotate, stepper wiring uln2003, stepper\n## Stepper Motor\n**Kya hai:** motor jo **step-by-step** ghoomta hai — har pulse par fixed angle. Position/speed bina feedback ke control. **Kis liye:** robot arm, printer, CNC, camera slider.\n**Working:** 4 coils ko sequence me energize karne se rotor aage badhta hai. Sequence ka order = direction; step ke beech delay = speed.\n**Pins:** `IN1–IN4` (4 coils), `COM` (common = +supply).\n**Simulator me wiring:** `P1.0–P1.3 → ULN2003 IN1–IN4`, `ULN OUT1–OUT4 → Stepper IN1–IN4`, `Stepper COM → Battery(+)`, `ULN GND → Ground`, `ULN COM → Battery(+)`.\n**Sequence (full step):** 09H, 0CH, 06H, 03H (forward); ulta = reverse.\n```\nL: MOV P1,#09H  ; ACALL DELAY\n   MOV P1,#0CH  ; ACALL DELAY\n   MOV P1,#06H  ; ACALL DELAY\n   MOV P1,#03H  ; ACALL DELAY\n   SJMP L\n```\nDelay kam = tez, bahut kam = step miss. Stepper ghoomta animation me dikhta hai.\n>> rel: stepper, dev-uln\n\n@@ dev-dcmotor | Devices | DC Motor + L293D (simulator me) | dc motor kya hai, dc motor simulator me, l293d kya hai, l293d ka use, h bridge kya hai, motor direction kaise badle, l293d wiring, motor kaise chalaye simulator me, l293d pins, motor ghoom nahi raha\n## DC Motor + L293D H-Bridge\n**DC Motor:** voltage lagao to ghoomta hai; **polarity ulti → direction ulti**; zyada voltage/PWM → zyada speed. Direct 8051 se nahi chalega (current), driver chahiye.\n**L293D (H-bridge):** 2 motors ko **dono direction** me chalata hai. `IN1/IN2` input, `OUT1/OUT2` motor ko, `EN1` enable.\n| IN1 | IN2 | Motor |\n|---|---|---|\n| 1 | 0 | Forward |\n| 0 | 1 | Reverse |\n| 0 | 0 | Stop |\n| 1 | 1 | Brake |\n**Pins (simulator):** `EN1 IN1 OUT1 GND GND2 OUT2 IN2 VCC2` | `VCC1 IN4 OUT4 GND3 GND4 OUT3 IN3 EN2`.\n**Wiring:** P1.0 → IN1, P1.1 → IN2, P1.2 → EN1; **VCC1 → +5V** (logic), **VCC2 → Battery(+)** (motor supply); **GND pins → Ground**; OUT1/OUT2 → DC Motor IN1/IN2.\n```\nSETB P1.2     ; enable\nSETB P1.0     ; IN1=1\nCLR  P1.1     ; IN2=0  -> forward\n```\n**Speed:** EN pin par PWM (timer se duty cycle).\n>> rel: dc-motor, dev-pwm\n\n@@ dev-pwm | Devices | PWM (speed / brightness control) | pwm kya hai, pwm kaise banate hain, speed control motor, duty cycle, pwm led brightness, pwm 8051, pulse width modulation\n## PWM — Pulse Width Modulation\nPin ko tezi se ON/OFF karte ho; **ON time / total period = Duty cycle**. Average voltage = 5V × duty. **LED brightness, motor speed, servo angle** isse control hote hain.\n```\n; 25% duty (ON 1 unit, OFF 3 unit) ~ 1 kHz\nL: SETB P1.0\n   MOV R7,#60\nA: DJNZ R7,A\n   CLR P1.0\n   MOV R7,#180\nB: DJNZ R7,B\n   SJMP L\n```\nON ka delay badhao = speed/brightness zyada. Simulator me **Oscilloscope** se duty cycle dekh sakte ho; motor/LED me average effect dikhta hai.\n>> rel: square-wave, servo, dev-dcmotor\n\n@@ dev-servo | Devices | Servo Motor SG90 | servo kya hai, servo motor ka use, servo kaise kaam karta hai, servo simulator me, sg90, servo angle, servo wiring, servo control, servo\n## Servo Motor (SG90)\n**Kya hai:** motor + gears + feedback — **angle (0–180°)** par ghoom ke ruk jata hai. **Kis liye:** robotic arm, gate, camera pan.\n**Working:** signal pin par **20 ms period ki PWM**; **pulse width = angle**:\n| Pulse | Angle |\n|---|---|\n| 1.0 ms | 0° |\n| 1.5 ms | 90° |\n| 2.0 ms | 180° |\n(Kuch servo 0.5–2.5 ms tak ghoomte hain.) Pulse lagataar milna chahiye warna servo position hold nahi karta.\n**Pins:** `SIG`, `VCC`, `GND`.\n**Simulator me:** SIG → P1.0, VCC → Battery(+), GND → Ground. Servo ka horn angle ke saath ghoomta dikhta hai.\n**Working code (90°, ~1.5 ms pulse + ~18.5 ms gap):**\n```\nL:  SETB P1.0\n    MOV R6,#3          ; 3 x ~0.5 ms = 1.5 ms\nL1: MOV R7,#229\nL2: DJNZ R7,L2\n    DJNZ R6,L1\n    CLR P1.0\n    MOV R5,#36         ; baaki ~18.5 ms\nL3: MOV R6,#255\nL4: DJNZ R6,L4\n    DJNZ R5,L3\n    SJMP L\n```\n`MOV R6,#2` → ~1 ms (0°), `#4` → ~2 ms (180°). Timer0 se aur accurate hota hai.\n>> rel: servo, dev-pwm\n\n@@ dev-cro | Devices | Oscilloscope (CRO) kaise use karte hain | oscilloscope, cro, oscilloscope kaise use kare, cro kya hota hai, oscilloscope ka use, waveform dekhna, ch1 ch2, cro simulator me, scope window, trigger, time base, oscilloscope open nahi ho raha\n## Oscilloscope (CRO)\n**Kya hai:** signal ka **voltage vs time** graph dikhane wala instrument. **Kis liye:** pin ka waveform, frequency, duty cycle, UART pulses, DAC output, PWM check karna.\n**Pins:** `CH1`, `CH2` (probes), `GND`.\n**Simulator me:**\n1. Library se **OSCILLOSCOPE** rakho.\n2. **CH1 → jis pin ka waveform dekhna hai** (jaise P1.0, TXD, DAC VOUT, sensor out). GND → Ground.\n3. **RUN** karo. Scope par **double-click** ya right-click → **Open Oscilloscope Window**.\n4. Real CRO jaise controls: **VOLTS/DIV, TIME/DIV, Position, Trigger (level/slope/auto-norm), AC/DC/GND, DUAL, ADD, X-Y, Autoset, Measure (frequency, Vpp, duty)**.\n**Tips:** Waveform stable na ho to trigger level badlo ya **AUTOSET** dabao. Analog (DAC/POT) signals bhi dikhte hain.\n>> rel: dev-all, sim-wire\n\n@@ dev-hcsr04 | Devices | HC-SR04 Ultrasonic (simulator me) | ultrasonic kya hai, hc-sr04 simulator me, ultrasonic sensor kaise kaam karta hai, distance sensor simulator, trig echo kaise jode, ultrasonic ka use, distance set kaise kare\n## HC-SR04 Ultrasonic Sensor\n**Kis liye:** object ki **doori** napna (2–400 cm) — parking sensor, robot obstacle.\n**Working:** TRIG par 10 µs pulse → sensor 40 kHz sound bhejta hai → echo laut kar aane tak **ECHO pin HIGH**. **Distance = ECHO time (µs) / 58 cm.**\n**Pins:** `VCC`, `TRIG`, `ECHO`, `GND`.\n**Simulator me:** VCC → Battery(+), GND → Ground, TRIG → P1.0 (output), ECHO → P1.1 (input). Sensor par **double-click** ya right-click → **Set Distance** (slider se object door/paas). Timer0 se ECHO ka time napo.\n```\nSETB P1.1          ; echo input\nCLR P1.0 / SETB P1.0 / (10us delay) / CLR P1.0   ; trigger\nWAIT: JNB P1.1,WAIT\n      SETB TR0       ; echo start\nH:    JB P1.1,H\n      CLR TR0        ; TH0:TL0 = time\n```\n>> rel: hcsr04, timer-delay\n\n@@ dev-adc | Devices | ADC0804 (analog to digital) simulator me | adc0804 kya hai, adc ka use, adc kaise kaam karta hai, adc simulator me, adc wiring, analog to digital converter, adc0804 pins, adc kaise lagaye, adc conversion, adc\n## ADC0804 — Analog to Digital Converter\n**Kis liye:** analog signal (POT, LM35, LDR) ko **0–255 digital number** me badalna, kyunki 8051 me ADC nahi hota.\n**Working:** CS=0, **WR pulse** → conversion shuru; **INTR LOW** → ho gaya; **RD pulse** → DB0–DB7 par result. Result = Vin / (Vref/256).\n**Pins:** `CS RD WR CLKIN INTR VINP VINN AGND VREF2 DGND` | `VCC CLKR DB0–DB7`.\n**Simulator me wiring:** DB0–DB7 → P1.0–P1.7; CS → Ground; WR → P3.0, RD → P3.1, INTR → P3.2; VINP ← sensor/POT wiper; VINN, AGND, DGND → Ground; VCC → Battery(+); VREF2 open (5V ref) ya 2.5V.\n```\nL:  CLR P3.0 ; WR low\n    SETB P3.0 ; WR high -> start\nW:  JB P3.2,W ; INTR low?\n    CLR P3.1  ; RD low\n    MOV A,P1  ; A = digital value\n    SETB P3.1\n    MOV P2,A  ; dikhao\n    SJMP L\n```\nPOT 50% → 128, 100% → 255.\n>> rel: adc, dev-pot, dev-lm35\n\n@@ dev-pot | Devices | Potentiometer (POT) | potentiometer kya hai, pot ka use, pot kaise kaam karta hai, variable resistor, pot simulator me, pot wiper, pot adc, knob\n## Potentiometer\n**Kya hai:** 3-pin variable resistor / voltage divider. **Kis liye:** analog input — volume, brightness, speed set, ADC test.\n**Pins:** `P1`, `W` (wiper), `P2`.\n**Working:** P1=+5V, P2=GND → **W par 0–5V** (knob ke hisaab se).\n**Simulator me:** P1 → Battery(+), P2 → Ground, W → ADC0804 **VINP**. POT par **double-click** → **slider/knob** se position 0–100% badlo. LCD/LED par ADC value dikhao.\n>> rel: dev-adc, dev-lm35\n\n@@ dev-lm35 | Devices | LM35 Temperature Sensor | lm35 kya hai, lm35 ka use, temperature sensor, lm35 simulator me, lm35 kaise kaam karta hai, temperature measure, temperature kaise naape\n## LM35 Temperature Sensor\n**Kis liye:** temperature naapna (thermometer, fan control, alarm).\n**Working:** output voltage = **10 mV × °C**. 25°C → 0.25V, 100°C → 1.0V. Analog hai → **ADC0804** chahiye.\n**Pins:** `VCC`, `OUT`, `GND`.\n**Simulator me:** VCC → Battery(+), GND → Ground, OUT → ADC0804 VINP. LM35 par **double-click** → temperature slider (0–150°C). ADC value (Vref=5V): 25°C → ~13, 100°C → ~51. **Temperature = ADC × 1.953 (°C)** (ya ≈ADC×2).\n>> rel: dev-adc, lm35\n\n@@ dev-dac | Devices | DAC0808 (digital to analog) | dac0808 kya hai, dac ka use, dac kaise kaam karta hai, dac simulator me, dac wiring, digital to analog, waveform generate dac, dac0808 pins, dac\n## DAC0808 — Digital to Analog Converter\n**Kis liye:** digital number (0–255) ko **voltage** me badalna — waveform generator (sine/triangle/sawtooth), audio, analog control.\n**Working:** 8-bit input A1(MSB)…A8(LSB), reference current → output **current**; op-amp se **voltage**. **Vout ≈ 5V × (D/256).**\n**Pins:** `A1–A8`, `VCC`, `VREFP`, `VREFN`, `GND`, `VOUT` (op-amp ke baad voltage).\n**Simulator me:** P1.0–P1.7 → A8…A1 (P1.7 = MSB → A1), VCC → Battery(+), GND/VREFN → Ground, VREFP → +5V. **VOUT → Oscilloscope CH1** — sawtooth/triangle dekho.\n```\nL: MOV A,#0\nU: MOV P1,A\n   INC A\n   JNZ U      ; 0..255 phir 0\n   SJMP L     ; sawtooth\n```\n>> rel: dac, dev-cro\n\n@@ dev-595 | Devices | 74HC595 Shift Register | 74hc595 kya hai, shift register ka use, 74hc595 simulator me, serial to parallel, 595 wiring, pin kam hone par, shift register kaise kaam karta hai, led expand\n## 74HC595 — Serial-In Parallel-Out\n**Kis liye:** **3 pins se 8 outputs** — jab 8051 ke pins kam pad jaayein (LED bar, 7-seg, relay). Cascade karke 16/24 outputs.\n**Working:** `SER` par bit rakho → `SRCLK` rising edge par shift; 8 bit baad `RCLK` rising edge par outputs me latch hota hai. `OE` low = outputs enable; `SRCLR` high = normal.\n**Pins:** `QA–QH`, `SER`, `SRCLK` (shift clk), `RCLK` (latch), `OE`, `SRCLR`, `SQH` (cascade out), VCC, GND.\n**Simulator me:** SER → P2.0, SRCLK → P2.1, RCLK → P2.2, **OE → Ground**, **SRCLR → +5V**, VCC/GND; QA–QH → 8 LEDs (resistor ke saath).\n```\n      CLR P2.1 ; CLR P2.2         ; idle low\n      MOV A,#55H ; MOV R2,#8\nB:    RLC A\n      MOV P2.0,C\n      SETB P2.1 ; CLR P2.1       ; shift\n      DJNZ R2,B\n      SETB P2.2 ; CLR P2.2       ; latch\n```\n>> rel: shift-reg, dev-led\n\n@@ dev-ldr | Devices | LDR (light sensor module) | ldr kya hai, ldr ka use, light sensor, ldr module simulator me, ldr kaise kaam karta hai, andhera ujala sensor, auto light, ldr ao do\n## LDR Light Sensor Module\n**Kis liye:** roshni naapna — automatic street light, dark/bright detection.\n**Working:** LDR ka resistance light badhne par **ghatta** hai. Module me comparator hai: **AO** (analog voltage) aur **DO** (digital: andhera = HIGH).\n**Pins:** `VCC`, `GND`, `DO`, `AO`.\n**Simulator me:** VCC → Battery(+), GND → Ground, **DO → port pin** (digital) ya **AO → ADC0804 VINP** (analog). LDR par **double-click** → Light % aur Threshold (module ka pot). AO = 5V × (1 − light).\n```\nJB P3.0,DARK    ; DO high = andhera\nCLR P1.0        ; light OFF\nDARK: SETB P1.0 ; light ON\n```\n>> rel: sensors, dev-adc\n\n@@ dev-ir | Devices | IR Obstacle Sensor | ir sensor kya hai, ir obstacle sensor, ir sensor ka use, line follower sensor, ir simulator me, ir sensor kaise kaam karta hai, obstacle detect\n## IR Obstacle Sensor\n**Kis liye:** obstacle/object detect, line follower robot, object counter.\n**Working:** IR LED infrared bhejta hai; saamne cheez ho to reflect hoke IR photodiode me aata hai → module ka **OUT = LOW** (obstacle); nahi to HIGH.\n**Pins:** `VCC`, `GND`, `OUT`.\n**Simulator me:** VCC → Battery(+), GND → Ground, OUT → P1.0 (input). **Double-click** ya right-click → **Place/Remove obstacle**.\n```\nSETB P1.0\nL: JNB P1.0,STOPIT  ; obstacle\n   ; aage badho\n```\n>> rel: sensors, dev-pir\n\n@@ dev-pir | Devices | PIR Motion Sensor | pir kya hai, pir sensor ka use, motion sensor, pir simulator me, pir kaise kaam karta hai, motion detect, human detect\n## PIR Motion Sensor\n**Kis liye:** insaan/jaanwar ki movement detect — security alarm, automatic light.\n**Working:** **Passive Infrared** — body heat (IR) ke change ko sense karta hai. Motion par **OUT = HIGH** kuch seconds tak hold.\n**Pins:** `VCC`, `OUT`, `GND`.\n**Simulator me:** VCC → Battery(+), GND → Ground, OUT → P1.0. **Double-click** ya right-click → **Trigger motion (3 s)** — OUT 3 second HIGH.\n```\nL: JNB P1.0,L    ; motion ka wait\n   SETB P1.1     ; alarm/buzzer ON\n```\n>> rel: sensors, dev-ir\n\n@@ dev-rtc | Devices | DS1307 RTC (I2C real-time clock) | ds1307 kya hai, rtc kya hai, real time clock, ds1307 simulator me, ghadi, ds1307 kaise kaam karta hai, ds1307 wiring, time date chip, ds1307 register\n## DS1307
